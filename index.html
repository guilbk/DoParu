-яких [[c:math115:set|множин]]? (так / ні)","a":["так"],"sol":[["Діаграма","обидві частини — кола $A$ і $B$ без кола $C$"]],"fin":"так","quiz":true,"difficulty":1,"concepts":["c:math115:venn"]},{"q":"Чи правильна рівність $A\\setminus(B\\cup C)=(A\\setminus B)\\setminus C$ для будь-яких [[c:math115:set|множин]]? (так / ні)","a":["так"],"sol":[["Ліва: з $A$ викинути все з $B$ і все з $C$","права робить те саме за два кроки"]],"fin":"так","quiz":true,"difficulty":1,"concepts":["c:math115:venn","c:math115:difference"]},{"q":"Чи правильна рівність $A\\setminus(B\\setminus C)=(A\\setminus B)\\setminus C$ для будь-яких [[c:math115:set|множин]]? (так / ні)","a":["ні"],"sol":[["Візьми $A=C=\\{1\\}$, $B=\\varnothing$","ліва $=\\{1\\}$, права $=\\varnothing$"]],"fin":"ні","quiz":true,"difficulty":2,"trap":true,"concepts":["c:math115:difference"]},{"q":"Чи правильна рівність $A\\cap(B\\triangle C)=(A\\cap B)\\triangle(A\\cap C)$ для будь-яких [[c:math115:set|множин]]? (так / ні)","a":["так"],"sol":[["Діаграма з трьома колами","області збігаються: $\\cap$ дистрибутивний відносно $\\triangle$"]],"fin":"так","quiz":true,"difficulty":2,"concepts":["c:math115:venn","c:math115:symmetric-difference"]},{"q":"$(A\\triangle B)\\triangle(A\\cap B) = ?$ Запиши через одну операцію над $A$ і $B$","a":["A∪B","AuB","A\\cup B","A or B"],"sol":[["$A\\triangle B$ — усе крім спільного, $A\\cap B$ — спільне","не перетинаються; їхнє «або-або» — об'єднання"]],"fin":"$A\\cup B$","quiz":true,"difficulty":2,"concepts":["c:math115:symmetric-difference"]},{"q":"$A\\triangle(A\\cap B) = ?$ Запиши через одну операцію над $A$ і $B$","a":["A\\B","A\\setminus B","A-B","A minus B"],"sol":[["$A\\cap B\\subseteq A$","«або-або» з підмножиною = викинути її з $A$"]],"fin":"$A\\setminus B$","quiz":true,"difficulty":2,"concepts":["c:math115:symmetric-difference","c:math115:difference"]},{"q":"$A\\triangle A = ?$","a":["{}","∅"],"sol":[["Зайвого з обох боків","нема"]],"fin":"$\\varnothing$","quiz":true,"difficulty":1,"concepts":["c:math115:symmetric-difference"]},{"q":"$A\\triangle\\varnothing = ?$","a":["A"],"sol":[["$A\\setminus\\varnothing=A$, $\\varnothing\\setminus A=\\varnothing$","разом $A$"]],"fin":"$A$","quiz":true,"difficulty":1,"concepts":["c:math115:symmetric-difference","c:math115:empty-set"]},{"q":"$\\overline{A\\cup B}$ дорівнює $\\overline A\\cap\\overline B$ чи $\\overline A\\cup\\overline B$? Напиши «перетин» або «[[c:math115:union-intersection|об'єднання]]»","a":["перетин","∩","cap"],"sol":[["Де Морган","заперечення «або» — це «і»"]],"fin":"$\\overline A\\cap\\overline B$ — перетин","quiz":true,"difficulty":2,"trap":true,"concepts":["c:math115:difference","c:math115:union-intersection"]},{"q":"Скільки областей на діаграмі Венна для трьох [[c:math115:set|множин]] $A$, $B$, $C$ (разом із зовнішньою)?","a":["8","вісім"],"sol":[["Кожен елемент або в $A$, або ні; так само з $B$ і $C$","$2^3=8$"]],"fin":"$8$","quiz":true,"difficulty":1,"concepts":["c:math115:venn"]}]}],"expl":{"d:m1:1":{"w":[["Бачимо","$A=\\{3;5;\\{3\\}\\}$ і питання «чи $\\{5\\}\\in A$»."],["Хочемо","Зрозуміти, чи лежить у мішку $A$ саме така річ — мішок $\\{5\\}$."],["Крок 1","Виписуємо речі з $A$ по одній: число $3$, число $5$, мішок $\\{3\\}$."],["Крок 2","Шукаємо мішок $\\{5\\}$. Число $5$ є, але це число, не мішок. Мішка $\\{5\\}$ нема."],["Перевір","Порівняй: «$\\{5\\}\\subseteq A$» — так, бо число $5$ є в $A$. А «$\\{5\\}\\in A$» — ні."],["Пастка","Фігурні дужки — це мішок. Питання $\\in$ шукає річ рівно з такими дужками, як написано."]],"k":[["вчити","$\\{x\\}\\in A$ лише якщо мішок $\\{x\\}$ сам лежить у $A$"]]},"d:m1:5":{"w":[["Бачимо","$\\{1;\\{2\\}\\}$ і $\\{1;2\\}$."],["Хочемо","Перевірити, чи це той самий мішок: ті самі речі всередині?"],["Крок 1","Перший мішок: число $1$ і мішок $\\{2\\}$. Другий: числа $1$ і $2$."],["Крок 2","Мішок $\\{2\\}$ і число $2$ — різні речі. У першому мішку нема числа $2$; у другому нема мішка $\\{2\\}$."],["Перевір","Рівність — це два включення. Уже перше не виконується: $\\{2\\}\\in$ першому, але $\\{2\\}\\notin$ другому."],["Пастка","Дужки навколо числа міняють річ. $2\\ne\\{2\\}$."]],"k":[["вчити","$A=B\\Leftrightarrow A\\subseteq B\\wedge B\\subseteq A$"]]},"d:m1:7":{"w":[["Бачимо","$\\{\\{1;2;3\\}\\}$ — дужки подвійні."],["Хочемо","Порахувати речі в ЗОВНІШНЬОМУ мішку."],["Крок 1","Знімаємо зовнішні дужки. Всередині — одна річ: мішок $\\{1;2;3\\}$."],["Перевір","Те, що всередині тієї речі лежать три числа, для лічби зовні не має значення."],["Пастка","$|\\{1;2;3\\}|=3$, але $|\\{\\{1;2;3\\}\\}|=1$."]],"k":[["вчити","мішок у мішку — одна річ"]]},"d:m1:8":{"w":[["Бачимо","$B=\\{a;b;\\{c;d\\}\\}$, питання «чи $c\\in B$»."],["Хочемо","Знайти річ $c$ серед елементів $B$."],["Крок 1","Речі в $B$: $a$, $b$, мішок $\\{c;d\\}$. Усе."],["Крок 2","$c$ лежить УСЕРЕДИНІ третьої речі, але не є окремою річчю в $B$."],["Перевір","$c\\in\\{c;d\\}$ — так. $c\\in B$ — ні. Належність не «просвічує» крізь дужки."],["Пастка","Належність дивиться лише на один рівень дужок."]],"k":[["вчити","$x\\in A$ — $x$ є елементом $A$ безпосередньо"]]},"d:m2:0":{"w":[["Бачимо","$\\varnothing\\subseteq\\{7\\}$."],["Хочемо","Перевірити за означенням: кожен елемент лівої лежить у правій."],["Крок 1","Елементи лівої: нема жодного."],["Крок 2","Правило «кожен елемент… лежить у правій» нічим порушити — порушника нема."],["Перевір","Так само $\\varnothing\\subseteq A$ для будь-якої $A$, і навіть $\\varnothing\\subseteq\\varnothing$."],["Пастка","«Порожня — значить ні до чого не належить» — плутанина $\\in$ і $\\subseteq$. $\\varnothing\\in\\{7\\}$ — ні, а $\\varnothing\\subseteq\\{7\\}$ — так."]],"k":[["вчити","$\\varnothing\\subseteq A$ — завжди"]]},"d:m2:1":{"w":[["Бачимо","$\\{\\varnothing\\}\\subseteq\\varnothing$."],["Хочемо","Кожна річ лівого мішка має знайтися в правому."],["Крок 1","Лівий мішок НЕ порожній: у ньому одна річ — $\\varnothing$."],["Крок 2","Правий мішок порожній. Річ $\\varnothing$ там не знайти."],["Перевір","Порядок важливий: $\\varnothing\\subseteq\\{\\varnothing\\}$ — так; $\\{\\varnothing\\}\\subseteq\\varnothing$ — ні."],["Пастка","$\\{\\varnothing\\}\\ne\\varnothing$: перший має один елемент, другий — нуль."]],"k":[["вчити","$|\\{\\varnothing\\}|=1$"]]},"d:m2:3":{"w":[["Бачимо","$\\{\\varnothing\\}\\subseteq\\{\\{\\varnothing\\}\\}$."],["Хочемо","Кожна річ лівого — у правому?"],["Крок 1","Річ лівого: $\\varnothing$."],["Крок 2","Речі правого: одна — мішок $\\{\\varnothing\\}$. Це не $\\varnothing$ (у ньому щось лежить)."],["Перевір","Зате $\\{\\varnothing\\}\\in\\{\\{\\varnothing\\}\\}$ — так. Знову $\\in$ проти $\\subseteq$."],["Пастка","Рахуй дужки: $\\varnothing$, $\\{\\varnothing\\}$, $\\{\\{\\varnothing\\}\\}$ — три різні речі."]],"k":[["вчити","$\\{\\varnothing\\}\\subseteq X\\Leftrightarrow\\varnothing\\in X$"]]},"d:m2:5":{"w":[["Бачимо","$\\{1;2\\}\\in\\{1;2;3\\}$."],["Хочемо","Чи лежить мішок $\\{1;2\\}$ як окрема річ у правому мішку?"],["Крок 1","Речі правого: числа $1$, $2$, $3$. Мішків там нема."],["Перевір","$\\{1;2\\}\\subseteq\\{1;2;3\\}$ — так. $\\{1;2\\}\\in\\{1;2;3\\}$ — ні."],["Пастка","Зліва мішок — майже завжди питання про $\\subseteq$. Про $\\in$ — лише коли цей мішок сам лежить усередині, як у $\\{\\{1;2\\}\\}$."]],"k":[["вчити","зліва річ → $\\in$; зліва мішок → $\\subseteq$"]]},"d:m2:11":{"w":[["Бачимо","Скільки підмножин має $\\varnothing$."],["Хочемо","Перелічити всі множини $X$ з $X\\subseteq\\varnothing$."],["Крок 1","Якщо $X$ має хоч одну річ, вона мусить бути в $\\varnothing$ — неможливо. Отже $X$ без речей: $X=\\varnothing$."],["Перевір","Формула $2^n$ при $n=0$: $2^0=1$. Збігається."],["Пастка","«Нуль елементів — нуль підмножин» — ні. Порожня множина — підмножина самої себе."]],"k":[["вчити","$|\\mathcal{P}(\\varnothing)|=2^0=1$"]]},"d:m3:3":{"w":[["Бачимо","$T\\setminus S$, де $S=\\{2;4;6;8\\}$, $T=\\{1;2;3;4\\}$."],["Хочемо","Взяти $T$ і викинути з нього все, що є в $S$."],["Крок 1","Речі $T$: $1,2,3,4$. Які з них є в $S$? $2$ і $4$."],["Крок 2","Викидаємо: лишаються $1$, $3$."],["Перевір","Порівняй із $S\\setminus T=\\{6;8\\}$ — інша множина. Різниця не симетрична."],["Пастка","Зліва від $\\setminus$ — з кого забираємо; справа — що забираємо."]],"k":[["вчити","$A\\setminus B=\\{x\\mid x\\in A\\wedge x\\notin B\\}$"]]},"d:m4:0":{"w":[["Бачимо","$\\varnothing\\cap\\{\\varnothing\\}$."],["Хочемо","Спільні речі двох мішків."],["Крок 1","Лівий мішок порожній — речей нема."],["Крок 2","Спільна річ мала б лежати в обох. У лівому нічого не лежить — спільних нема."],["Перевір","$A\\cap\\varnothing=\\varnothing$ для будь-якої $A$."],["Пастка","Не плутай із $\\{\\varnothing\\}\\cap\\{\\varnothing\\}=\\{\\varnothing\\}$: там в обох мішках лежить річ $\\varnothing$."]],"k":[["вчити","$A\\cap\\varnothing=\\varnothing$"]]},"d:m4:4":{"w":[["Бачимо","$\\{\\varnothing;\\{\\varnothing\\}\\}\\setminus\\{\\varnothing\\}$."],["Хочемо","З лівого мішка викинути все, що є в правому."],["Крок 1","Речі лівого: $\\varnothing$ і $\\{\\varnothing\\}$. Речі правого: одна — $\\varnothing$."],["Крок 2","Викидаємо $\\varnothing$. Лишається одна річ: $\\{\\varnothing\\}$."],["Крок 3","Відповідь — мішок з цією річчю: $\\{\\{\\varnothing\\}\\}$."],["Пастка","Відповідь $\\{\\varnothing\\}$ — помилка: це сама річ, а не мішок, у якому вона лишилась."]],"k":[["вчити","результат операції — завжди мішок"]]},"d:m5:2":{"w":[["Бачимо","$A\\setminus(B\\setminus C)$ проти $(A\\setminus B)\\setminus C$."],["Хочемо","Перевірити, чи рівні для будь-яких множин. Для «ні» досить одного прикладу."],["Крок 1","Візьмемо $A=\\{1\\}$, $B=\\varnothing$, $C=\\{1\\}$."],["Крок 2","Ліва: $B\\setminus C=\\varnothing$, $A\\setminus\\varnothing=\\{1\\}$."],["Крок 3","Права: $A\\setminus B=\\{1\\}$, $\\{1\\}\\setminus C=\\varnothing$."],["Перевір","$\\{1\\}\\ne\\varnothing$ — рівність хибна. На діаграмі: ліва частина містить $A\\cap C$, права — ні."],["Пастка","Дужки в різниці переставляти не можна — $\\setminus$ не асоціативна."]],"k":[["вчити","рівні лише коли $A\\cap C=\\varnothing$"]]},"d:m5:8":{"w":[["Бачимо","$\\overline{A\\cup B}$ — доповнення об'єднання."],["Хочемо","Записати без риски над дужками."],["Крок 1","$x\\in\\overline{A\\cup B}$ означає: $x$ НЕ в $A$ і НЕ в $B$ одночасно (щоб не бути в об'єднанні, треба не бути в жодному)."],["Крок 2","«Не в $A$ і не в $B$» = $x\\in\\overline A\\cap\\overline B$."],["Перевір","Це де Морган з логіки: $\\neg(a\\vee b)\\simeq\\neg a\\wedge\\neg b$."],["Пастка","Риска над $\\cup$ дає $\\cap$, над $\\cap$ дає $\\cup$ — знак перевертається."]],"k":[["вчити","$\\overline{A\\cup B}=\\overline A\\cap\\overline B$"]]}},"concepts":[{"id":"c:math115:statement","level":2,"t":"Висловлювання","one":"Речення, про яке можна чесно сказати: правда або неправда. Питання й накази — не висловлювання.","body":[["Уяви","«Сьогодні понеділок» — можна перевірити, отже висловлювання. «Ходімо!» — перевірити нічого, не висловлювання."],["Правило","Одна перевірка: чи ставиться оцінка $1$ або $0$. Ставиться — висловлювання, навіть якщо оцінка $0$."],["Пастка","«$2+2=5$» — висловлювання (хибне). «$x+2=5$» без $x$ — ще ні, це предикат."]],"prereq":["c:true-false","c:sentence"],"aliases":["висловлювання","висловлюванням","висловлювань"],"check":{"q":"Чи є висловлюванням «Скільки тобі років?» (так / ні)","a":["ні"]},"book":"Логічне висловлювання — фраза, стосовно якої можна визначити її істинність чи хибність.","course":"math115","next":["c:math115:atom","c:math115:predicate"]},{"id":"c:math115:atom","level":2,"t":"Атом (атомарне висловлювання)","one":"Найдрібніший шматок висловлювання, який уже не ділиться сполучниками. Позначають $a, b, c$.","body":[["Уяви","«Дощ і холодно» = два атоми: «дощ», «холодно». Склеєні словом «і»."],["Правило","Шукаєш «і», «або», «не», «якщо…то», «тоді й тільки тоді» — ріжеш по них. Що лишилося без сполучників — атоми."],["Пастка","«Не холодно» — це атом «холодно» плюс «не», а не окремий атом."]],"prereq":["c:math115:statement","c:and-or-not"],"aliases":["атом","атоми","атомів","атомарне"],"book":"Атомарне висловлювання — те, що не розкладається на простіші висловлювання за допомогою логічних зв'язок.","course":"math115","next":["c:math115:connective"]},{"id":"c:math115:connective","level":2,"t":"Логічна зв'язка","one":"Значок, що склеює висловлювання: $\\neg$ не, $\\wedge$ і, $\\vee$ або, $\\oplus$ або-або, $\\to$ якщо-то, $\\leftrightarrow$ тоді й лише тоді.","body":[["Уяви","Це ті самі шкільні «і / або / не», лише значками, плюс дві стрілки для «якщо» і «тоді й тільки тоді»."],["Правило","У кожної зв'язки один особливий рядок: $\\wedge$ істинна лише при $1,1$; $\\vee$ хибна лише при $0,0$; $\\to$ хибна лише при $1\\to0$; $\\oplus$ істинна при різних; $\\leftrightarrow$ — при однакових."],["Пастка","«але», «проте», «а» — це також $\\wedge$."]],"prereq":["c:and-or-not","c:math115:atom"],"aliases":["зв'язка","зв'язки","зв'язок","логічна зв'язка","логічні зв'язки"],"book":"Логічні зв'язки: заперечення $\\neg$, кон'юнкція $\\wedge$, диз'юнкція $\\vee$, виключна диз'юнкція $\\oplus$, імплікація $\\to$, еквіваленція $\\leftrightarrow$.","course":"math115","next":["c:math115:implication","c:math115:truth-table"]},{"id":"c:math115:implication","level":2,"t":"Імплікація $a\\to b$","one":"«Якщо $a$, то $b$». Хибна лише в одному випадку: $a=1$, $b=0$. У решті — істинна.","body":[["Уяви","Обіцянка «якщо здам ДЗ, то отримаю бал». Порушено лише коли ДЗ здав, а бала нема."],["Правило","$0\\to0=1$, $0\\to1=1$, $1\\to0=0$, $1\\to1=1$. Ліва частина — достатня умова, права — необхідна."],["Пастка","«$a$, лише якщо $b$» — це $a\\to b$; «$a$, якщо $b$» — це $b\\to a$. Протилежні стрілки."]],"prereq":["c:math115:connective","c:if-then"],"aliases":["імплікація","імплікації","імплікацію"],"check":{"q":"$0\\to1 = ?$","a":["1","істина"]},"book":"Імплікація $a\\to b$ хибна тоді й лише тоді, коли $a$ істинне, а $b$ хибне: $a\\to b\\simeq\\neg a\\vee b$.","course":"math115","next":["c:math115:consequence","c:math115:induction"]},{"id":"c:math115:truth-table","level":2,"t":"Таблиця істинності","one":"Таблиця, де зліва всі набори значень атомів, справа — значення формули на кожному наборі.","body":[["Уяви","Два атоми — чотири рядки: $00, 01, 10, 11$. Три атоми — вісім. Рахуємо формулу в кожному рядку."],["Правило","Атомів $n$ — рядків $2^n$. Стовпці заповнюємо від внутрішніх дужок до головної зв'язки."],["Пастка","Пропущений рядок — і висновок про формулу може бути хибним. Рядків рівно $2^n$, не менше."]],"prereq":["c:math115:connective","c:table","c:power-two"],"aliases":["таблиця істинності","таблиці істинності","таблицю істинності"],"book":"Таблиця істинності формули — таблиця, яка кожній інтерпретації атомів ставить у відповідність значення формули.","course":"math115","next":["c:math115:tautology","c:math115:equivalence","c:math115:consequence"]},{"id":"c:math115:tautology","level":2,"t":"Тавтологія і суперечність","one":"Тавтологія — формула, що істинна за будь-яких значень атомів. Суперечність — хибна за будь-яких.","body":[["Уяви","«Дощ або не дощ» — правда завжди, що б не сталося. Це тавтологія."],["Правило","У стовпці формули лише $1$ — тавтологія; лише $0$ — тотожно-хибна; і те й те — виконлива, але не тавтологія."],["Пастка","Щоб спростувати тавтологію, вистачає одного рядка з $0$."]],"prereq":["c:math115:truth-table"],"aliases":["тавтологія","тавтологією","тавтології","суперечність","тотожно-хибна"],"book":"Формула $F$ — тавтологія, якщо $I(F)=1$ за будь-якої інтерпретації $I$; тотожно-хибна (суперечлива), якщо $I(F)=0$ за будь-якої інтерпретації.","course":"math115","next":["c:math115:equivalence"]},{"id":"c:math115:equivalence","level":2,"t":"Логічна еквівалентність $F\\simeq G$","one":"Дві формули еквівалентні, якщо їхні стовпці в таблиці істинності збігаються в усіх рядках.","body":[["Уяви","Два різні маршрути, що завжди приводять у те саме місце. $a\\to b$ і $\\neg a\\vee b$ — саме такі."],["Правило","$F\\simeq G$ тоді й лише тоді, коли $F\\leftrightarrow G$ — тавтологія. Перевіряти — таблицею або перетвореннями."],["Пастка","Один рядок, де стовпці різні, — і еквівалентності нема."]],"prereq":["c:math115:truth-table","c:math115:tautology"],"aliases":["еквівалентність","еквівалентні","еквівалентна","логічна еквівалентність"],"book":"$F\\simeq G$, якщо для будь-якої інтерпретації $I(F)=I(G)$; рівносильно, $F\\leftrightarrow G$ є тавтологією.","course":"math115","next":[]},{"id":"c:math115:consequence","level":2,"t":"Логічний наслідок $\\models$","one":"$F\\models G$: у кожному рядку, де $F$ істинна, $G$ теж істинна. «З $F$ випливає $G$».","body":[["Уяви","Із «Микола проспав» випливає «Микола запізниться». Але з «запізнився» НЕ випливає «проспав» — міг застрягти в заторі."],["Правило","Дивимось лише на рядки, де всі посилки $1$. Якщо там висновок теж $1$ — наслідок правильний."],["Пастка","Обернений напрямок не гарантується: із $a\\to b$ і $b$ не випливає $a$."]],"prereq":["c:math115:implication","c:math115:truth-table"],"aliases":["логічний наслідок","логічним наслідком","випливає","наслідок"],"book":"$G$ — логічний наслідок $F$ ($F\\models G$), якщо за будь-якої інтерпретації, де $I(F)=1$, також $I(G)=1$.","course":"math115","next":[]},{"id":"c:math115:predicate","level":2,"t":"Предикат $P(x)$","one":"Речення з буквою, яке стає висловлюванням, коли букву замінити конкретним значенням.","body":[["Уяви","«$x$ парне» — ні правда, ні неправда, поки не сказали $x$. $x=4$: правда. $x=7$: неправда."],["Правило","Предикат — це «шаблон» висловлювання. Скільки букв — стільки місць для підстановки: $S(x,y,z)$."],["Пастка","Предикат сам по собі не має значення $0$ чи $1$. Значення має лише після підстановки або квантора."]],"prereq":["c:math115:statement","c:variable"],"aliases":["предикат","предикати","предикатом","предикатів"],"book":"Предикат — функція, що кожному набору значень змінних з певної множини ставить у відповідність $0$ або $1$.","course":"math115","next":["c:math115:quantifier"]},{"id":"c:math115:quantifier","level":2,"t":"Квантори $\\forall$ і $\\exists$","one":"$\\forall x$ — «для кожного $x$», $\\exists x$ — «існує хоч один $x$». Роблять із предиката висловлювання.","body":[["Уяви","$E(x)$ — «$x$ парне». $\\forall x\\,E(x)$ — «усі числа парні» (неправда). $\\exists x\\,E(x)$ — «є парне число» (правда)."],["Правило","$\\forall$ спростовується одним винятком. $\\exists$ доводиться одним прикладом. Порядок різних кванторів міняти не можна."],["Пастка","$\\exists x\\,\\forall y$ і $\\forall y\\,\\exists x$ — різні речення."]],"prereq":["c:math115:predicate","c:all-some"],"aliases":["квантор","квантори","кванторів","квантором"],"book":"Квантор загальності $\\forall x\\,P(x)$ істинний, якщо $P(x)$ істинне для всіх $x$; квантор існування $\\exists x\\,P(x)$ — якщо $P(x)$ істинне хоча б для одного $x$.","course":"math115","next":["c:math115:negation-quantifier"]},{"id":"c:math115:negation-quantifier","level":2,"t":"Заперечення з кванторами","one":"Заперечення перекидає квантор: $\\neg\\forall x\\,P \\simeq \\exists x\\,\\neg P$, $\\neg\\exists x\\,P\\simeq\\forall x\\,\\neg P$.","body":[["Уяви","«Не всі птахи літають» = «є птах, який не літає». «Немає жодного дракона» = «кожна істота — не дракон»."],["Правило","$\\neg$ проходить крізь квантор, міняючи $\\forall\\leftrightarrow\\exists$, і далі заперечує предикат."],["Пастка","$\\neg\\forall x\\,P$ — це НЕ $\\forall x\\,\\neg P$. «Не всі» ≠ «усі не»."]],"prereq":["c:math115:quantifier","c:and-or-not"],"aliases":["заперечення квантора","заперечення з кванторами"],"check":{"q":"$\\neg\\exists x\\,P(x)$ — це $\\forall x\\,\\neg P(x)$? (так / ні)","a":["так"]},"book":"$\\neg\\forall x\\,P(x)\\simeq\\exists x\\,\\neg P(x)$; $\\neg\\exists x\\,P(x)\\simeq\\forall x\\,\\neg P(x)$.","course":"math115","next":[]},{"id":"c:math115:induction","level":2,"t":"Математична індукція","one":"Спосіб довести «для всіх $n$»: перевірити $n=1$, потім показати, що з кроку $n$ випливає крок $n+1$.","body":[["Уяви","Доміно в ряд. Штовхнув перше (база) і знаєш, що кожне валить наступне (перехід) — упадуть усі."],["Правило","База: $P(1)$ істинне. Перехід: припускаємо $P(n)$, виводимо $P(n+1)$. Разом — $P(n)$ для всіх натуральних."],["Пастка","Без бази перехід нічого не дає: кісточки стоять, поки першу не штовхнули."]],"prereq":["c:natural-numbers","c:math115:implication"],"aliases":["індукція","індукції","індукцією","математична індукція"],"book":"Якщо $P(1)$ істинне і для кожного натурального $n$ з $P(n)$ випливає $P(n+1)$, то $P(n)$ істинне для всіх натуральних $n$.","course":"math115","next":[]},{"id":"c:math115:set","level":2,"t":"Множина","one":"Множина — це «мішок» із предметів, що розглядається як одне ціле. Важливо лише, які предмети всередині.","body":[["Уяви","$A=\\{1;3;5\\}$ — мішок з трьома числами. $\\{5;1;3\\}$ і $\\{1;1;3;5\\}$ — той самий мішок."],["Правило","Задати можна переліком у фігурних дужках або умовою: $\\{x \\mid E(x)\\}$ — «усі $x$, для яких $E(x)$», де $E(x)$ — «$x$ парне»."],["Пастка","Фігурні дужки — і є мішок. $1$ і $\\{1\\}$ — різні речі: число і мішок з одним числом."]],"prereq":["c:set-bag","c:element"],"aliases":["множина","множини","множину","множиною","множин"],"check":{"q":"Чи $\\{2;7\\}=\\{7;2;2\\}$? (так / ні)","a":["так"]},"book":"Множина — сукупність об'єктів, що розглядається як єдине ціле. Об'єкти, з яких складається множина, називають її елементами. Множина визначається своїми елементами.","course":"math115","next":["c:math115:membership","c:math115:empty-set","c:math115:cardinality","c:math115:union-intersection","c:math115:difference","c:math115:venn"]},{"id":"c:math115:membership","level":2,"t":"Належність $x\\in A$","one":"$x\\in A$ — «$x$ лежить у мішку $A$». $x\\notin A$ — не лежить. Питання завжди про ОДИН предмет.","body":[["Уяви","$A=\\{1;2;3\\}$. Число $2$ в мішку: $2\\in A$. Число $5$ — ні: $5\\notin A$."],["Правило","Ліворуч від $\\in$ — предмет, праворуч — множина. Перевіряємо: чи є цей предмет серед перелічених."],["Пастка","$\\{2\\}\\in A$? Ні: у $A$ лежить число $2$, а не мішок $\\{2\\}$. Мішок $\\{2\\}$ — це вже підмножина."]],"prereq":["c:math115:set","c:element"],"aliases":["належить","належність","не належить","елемент множини","елементом"],"check":{"q":"$A=\\{1;2;\\{1\\}\\}$. Чи $\\{1\\}\\in A$? (так / ні)","a":["так"]},"book":"Запис $x\\in A$ означає, що $x$ є елементом множини $A$; $x\\notin A$ — що $x$ не є елементом $A$.","course":"math115","next":["c:math115:subset","c:math115:difference"]},{"id":"c:math115:empty-set","level":2,"t":"Порожня множина $\\varnothing$","one":"Мішок, у якому нічого немає. Один-єдиний для всіх: $\\varnothing=\\{\\}$, $|\\varnothing|=0$.","body":[["Уяви","Порожній мішок. Він існує, його можна покласти в інший мішок: $\\{\\varnothing\\}$ — мішок з порожнім мішком усередині."],["Правило","$\\varnothing$ не має елементів. $\\{\\varnothing\\}$ має один елемент — сам $\\varnothing$. Тому $\\varnothing\\ne\\{\\varnothing\\}$."],["Пастка","$\\varnothing\\subseteq A$ для будь-якої $A$ — «усі елементи порожньої лежать в $A$» виконується, бо перевіряти нічого."]],"prereq":["c:math115:set","c:zero"],"aliases":["порожня множина","порожню множину","порожньої множини","порожня"],"check":{"q":"$|\\{\\varnothing\\}| = ?$","a":["1"]},"book":"Порожня множина $\\varnothing$ — множина, яка не містить жодного елемента. Порожня множина є підмножиною будь-якої множини.","course":"math115","next":[]},{"id":"c:math115:subset","level":2,"t":"Підмножина $A\\subseteq B$","one":"$A\\subseteq B$: кожен елемент $A$ лежить і в $B$. Маленький мішок «уміщається» у великий.","body":[["Уяви","$A=\\{2;4\\}$, $B=\\{1;2;3;4\\}$. Беремо кожен елемент $A$: $2$ є в $B$, $4$ є в $B$ — отже $A\\subseteq B$."],["Правило","Перевіряємо ВСІ елементи лівої множини по черзі. Один не знайшовся — не підмножина. $A\\subseteq A$ і $\\varnothing\\subseteq A$ завжди."],["Пастка","$\\in$ і $\\subseteq$ — різні знаки: $2\\in B$ (предмет), $\\{2\\}\\subseteq B$ (мішок). «$2\\subseteq B$» — помилка."]],"prereq":["c:math115:membership","c:all-some"],"aliases":["підмножина","підмножиною","підмножини","підмножин","включення"],"check":{"q":"Чи $\\{1;3\\}\\subseteq\\{1;2;3\\}$? (так / ні)","a":["так"]},"book":"$A\\subseteq B$ (множина $A$ є підмножиною множини $B$), якщо кожний елемент $A$ є елементом $B$: $\\forall x\\,(x\\in A\\to x\\in B)$.","course":"math115","next":["c:math115:set-equality","c:math115:powerset"]},{"id":"c:math115:set-equality","level":2,"t":"Рівність множин","one":"$A=B$, коли в них ті самі елементи: кожен з $A$ є в $B$ і кожен з $B$ є в $A$.","body":[["Уяви","Два мішки рівні, якщо, перебравши обидва, не знайдеш речі, яка є лише в одному."],["Правило","$A=B\\Leftrightarrow A\\subseteq B$ і $B\\subseteq A$. Порядок і повтори не рахуються: $\\{1;2\\}=\\{2;1;1\\}$."],["Пастка","Щоб довести рівність, треба ДВА включення. Одного мало."]],"prereq":["c:math115:subset"],"aliases":["рівність множин","рівні множини","множини рівні"],"book":"$A=B$ тоді й лише тоді, коли $A\\subseteq B$ і $B\\subseteq A$.","course":"math115","next":[]},{"id":"c:math115:powerset","level":2,"t":"Булеан $\\mathcal{P}(A)$ і кількість підмножин","one":"Булеан — множина всіх підмножин $A$. Якщо в $A$ є $n$ елементів, підмножин рівно $2^n$.","body":[["Уяви","$A=\\{a;b\\}$. Підмножини: $\\varnothing$, $\\{a\\}$, $\\{b\\}$, $\\{a;b\\}$ — чотири, і $2^2=4$."],["Правило","Кожен елемент або береш, або ні — два варіанти. $n$ елементів — $2\\cdot2\\cdots2=2^n$ варіантів. $\\varnothing$ і сама $A$ завжди входять."],["Пастка","$2^n$, а не $2n$: для трьох елементів $8$ підмножин, не $6$."]],"prereq":["c:math115:subset","c:power-two"],"aliases":["булеан","усіх підмножин","кількість підмножин"],"check":{"q":"Скільки підмножин у $\\{1;2;3\\}$?","a":["8","вісім"]},"book":"Булеан (множина всіх підмножин) $\\mathcal{P}(A)=\\{X\\mid X\\subseteq A\\}$; якщо $|A|=n$, то $|\\mathcal{P}(A)|=2^n$.","course":"math115","next":[]},{"id":"c:math115:cardinality","level":2,"t":"Кількість елементів $|A|$","one":"$|A|$ — скільки різних елементів у множині. $|\\{1;3;5\\}|=3$, $|\\varnothing|=0$, $|\\{\\varnothing\\}|=1$.","body":[["Уяви","Рахуємо речі в мішку. Мішок усередині мішка — одна річ, хай там у ньому скільки завгодно."],["Правило","Повтори не рахуємо: $|\\{1;1;2\\}|=2$. Для об'єднання: $|A\\cup B|=|A|+|B|-|A\\cap B|$ — спільні порахували двічі, віднімаємо раз."],["Пастка","$|\\{\\{1;2;3\\}\\}|=1$: один елемент, і він — множина."]],"prereq":["c:math115:set","c:count"],"aliases":["кількість елементів","потужність","скільки елементів"],"book":"Кількість елементів скінченної множини $A$ (потужність) позначають $|A|$.","course":"math115","next":[]},{"id":"c:math115:union-intersection","level":2,"t":"Об'єднання $\\cup$ і перетин $\\cap$","one":"$A\\cup B$ — усе, що є хоч в одному мішку. $A\\cap B$ — лише те, що є в обох.","body":[["Уяви","$A=\\{1;2;3\\}$, $B=\\{2;3;4\\}$. Зсипати разом: $A\\cup B=\\{1;2;3;4\\}$. Спільне: $A\\cap B=\\{2;3\\}$."],["Правило","$\\cup$ — це «або» ($x\\in A\\vee x\\in B$), $\\cap$ — це «і» ($x\\in A\\wedge x\\in B$). Порядок множин не важливий."],["Пастка","Значок $\\cup$ схожий на чашку — у неї все зсипають (більше). $\\cap$ — шапка, стискає (менше)."]],"prereq":["c:math115:set","c:and-or-not"],"aliases":["об'єднання","перетин","перетином","об'єднанням","об'єднання множин","перетин множин"],"check":{"q":"$\\{1;2\\}\\cap\\{2;3\\} = ?$","a":["{2}"]},"book":"$A\\cup B=\\{x\\mid x\\in A\\vee x\\in B\\}$; $A\\cap B=\\{x\\mid x\\in A\\wedge x\\in B\\}$.","course":"math115","next":["c:math115:symmetric-difference","c:math115:venn"]},{"id":"c:math115:difference","level":2,"t":"Різниця $A\\setminus B$ і доповнення","one":"$A\\setminus B$ — з мішка $A$ забрали все, що є в $B$. Доповнення $\\overline{A}=U\\setminus A$ — усе поза $A$.","body":[["Уяви","$A=\\{1;2;3\\}$, $B=\\{2;3;4\\}$. Із $A$ викидаємо $2$ і $3$: $A\\setminus B=\\{1\\}$. А $B\\setminus A=\\{4\\}$ — інше!"],["Правило","$x\\in A\\setminus B\\Leftrightarrow x\\in A\\wedge x\\notin B$. Забирати те, чого в $A$ нема, — нічого не змінює."],["Пастка","Різниця не симетрична: $A\\setminus B\\ne B\\setminus A$ зазвичай. $A\\setminus\\varnothing=A$, $A\\setminus A=\\varnothing$."]],"prereq":["c:math115:set","c:math115:membership","c:subtraction"],"aliases":["різниця","різницю","різниця множин","доповнення"],"check":{"q":"$\\{1;2;3\\}\\setminus\\{3;4\\} = ?$","a":["{1;2}"]},"book":"$A\\setminus B=\\{x\\mid x\\in A\\wedge x\\notin B\\}$; доповнення $\\overline{A}=U\\setminus A$, де $U$ — універсальна множина.","course":"math115","next":["c:math115:symmetric-difference"]},{"id":"c:math115:symmetric-difference","level":2,"t":"Симетрична різниця $A\\,\\triangle\\,B$","one":"Те, що є рівно в одному з мішків: $A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)=(A\\cup B)\\setminus(A\\cap B)$.","body":[["Уяви","$A=\\{1;2;3\\}$, $B=\\{2;3;4\\}$. Спільне ($2$, $3$) викидаємо, решту збираємо: $A\\triangle B=\\{1;4\\}$."],["Правило","Це «або-або» для множин: $x\\in A\\oplus x\\in B$. Симетрична: $A\\triangle B=B\\triangle A$. $A\\triangle A=\\varnothing$, $A\\triangle\\varnothing=A$."],["Пастка","Не плутай із звичайною різницею: $\\triangle$ бере «зайве» з ОБОХ боків."]],"prereq":["c:math115:union-intersection","c:math115:difference"],"aliases":["симетрична різниця","симетричну різницю","симетричної різниці"],"check":{"q":"$\\{1;2\\}\\triangle\\{2;3\\} = ?$","a":["{1;3}"]},"book":"$A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)=\\{x\\mid x\\in A\\oplus x\\in B\\}$.","course":"math115","next":[]},{"id":"c:math115:venn","level":2,"t":"Діаграма Венна","one":"Малюнок: прямокутник — усе ($U$), кола — множини. Операцію показують заштрихованою областю.","body":[["Уяви","Два кола перетинаються — на малюнку чотири області: лише $A$, лише $B$, обидва, жодне. Будь-який вираз з $A$ і $B$ — набір цих областей."],["Правило","Штрихуємо ліву частину рівності, потім праву окремо. Збіглися області — рівність правильна для будь-яких $A$, $B$, $C$."],["Пастка","Три кола дають 8 областей. Пропустив одну — перевірка не рахується."]],"prereq":["c:math115:set","c:math115:union-intersection"],"aliases":["діаграма Венна","діаграми Венна","діаграмах Венна","діаграмою Венна"],"book":"Діаграма Венна — схематичне зображення множин як областей площини; результат операції зображують відповідною областю.","course":"math115","next":[]}],"pics":{"STMT":"<figure class=\"pic\"><p class=\"ptitle\">Висловлювання чи ні?<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Речення<\/th><th>Це висловлювання?<\/th><th>Чому<\/th><\/tr>\n<tr><td style=\"text-align:left\">Чай не охолов<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">можна сказати «правда» або «неправда»<\/td><\/tr>\n<tr><td style=\"text-align:left\">2 + 2 = 5<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">хибне — але це теж відповідь<\/td><\/tr>\n<tr><td style=\"text-align:left\">Ходімо надвір<\/td><td class=\"f\">ні<\/td><td style=\"text-align:left\">наказ, його не перевіриш<\/td><\/tr>\n<tr><td style=\"text-align:left\">Ти голодний?<\/td><td class=\"f\">ні<\/td><td style=\"text-align:left\">питання<\/td><\/tr>\n<tr><td style=\"text-align:left\">Агов!<\/td><td class=\"f\">ні<\/td><td style=\"text-align:left\">вигук<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Тест один: чи можна відповісти «істина» або «хиба». Хибне речення — усе одно висловлювання<\/figcaption><\/figure>","CONN":"<figure class=\"pic\"><p class=\"ptitle\">П'ять зв'язок — кожну запам'ятай одним рядком<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>a ∧ b<\/b><span>«і». Істинне ЛИШЕ коли обидва істинні<\/span><\/div>\n<div class=\"kv\"><b>a ∨ b<\/b><span>«або». Хибне ЛИШЕ коли обидва хибні<\/span><\/div>\n<div class=\"kv\"><b>a ⊕ b<\/b><span>«або...або». Істинне коли вони РІЗНІ<\/span><\/div>\n<div class=\"kv\"><b>a → b<\/b><span>«якщо...то». Хибне ЛИШЕ коли 1 → 0<\/span><\/div>\n<div class=\"kv\"><b>a ↔ b<\/b><span>«тоді й лише тоді». Істинне коли ОДНАКОВІ<\/span><\/div>\n<div class=\"kv\"><b>¬a<\/b><span>«не». Перевертає: 1 стає 0<\/span><\/div>\n<\/div>\n<figcaption>У кожної зв'язки є один особливий рядок. Вивчи його — решта дістається сама<\/figcaption><\/figure>","TT4":"<figure class=\"pic\"><p class=\"ptitle\">Усі чотири рядки одразу<\/p>\n<div class=\"scroll\"><table>\n<tr><th>a<\/th><th>b<\/th><th>a ∧ b<\/th><th>a ∨ b<\/th><th>a ⊕ b<\/th><th>a → b<\/th><th>a ↔ b<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td class=\"f\">0<\/td><td class=\"f\">0<\/td><td class=\"f\">0<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>0<\/td><td>1<\/td><td class=\"f\">0<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><td class=\"f\">0<\/td><\/tr>\n<tr><td>1<\/td><td>0<\/td><td class=\"f\">0<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><td class=\"hi\">0<\/td><td class=\"f\">0<\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><td class=\"f\">0<\/td><td class=\"t\">1<\/td><td class=\"t\">1<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Підсвічена клітинка — єдиний рядок, де імплікація хибна. Більше ніде вона не 0<\/figcaption><\/figure>","IMPL":"<figure class=\"pic\"><svg viewBox=\"0 0 340 128\" class=\"nline\" role=\"img\" aria-label=\"Імплікація як обіцянка\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">a → b — це обіцянка «якщо a, то b»<\/text>\n<rect x=\"14\" y=\"26\" width=\"150\" height=\"40\" rx=\"7\" class=\"cell\"/>\n<text x=\"89\" y=\"43\" text-anchor=\"middle\" class=\"pmono\">a = 1, b = 1<\/text>\n<text x=\"89\" y=\"58\" text-anchor=\"middle\" class=\"pgood\">обіцянку дотримано<\/text>\n<rect x=\"176\" y=\"26\" width=\"150\" height=\"40\" rx=\"7\" class=\"cellhi\"/>\n<text x=\"251\" y=\"43\" text-anchor=\"middle\" class=\"pmonohi\">a = 1, b = 0<\/text>\n<text x=\"251\" y=\"58\" text-anchor=\"middle\" class=\"pbad\">ЗБРЕХАВ → 0<\/text>\n<rect x=\"14\" y=\"74\" width=\"150\" height=\"40\" rx=\"7\" class=\"cell\"/>\n<text x=\"89\" y=\"91\" text-anchor=\"middle\" class=\"pmono\">a = 0, b = 1<\/text>\n<text x=\"89\" y=\"106\" text-anchor=\"middle\" class=\"pgood\">не збрехав → 1<\/text>\n<rect x=\"176\" y=\"74\" width=\"150\" height=\"40\" rx=\"7\" class=\"cell\"/>\n<text x=\"251\" y=\"91\" text-anchor=\"middle\" class=\"pmono\">a = 0, b = 0<\/text>\n<text x=\"251\" y=\"106\" text-anchor=\"middle\" class=\"pgood\">не збрехав → 1<\/text>\n<\/svg><figcaption>Якщо умова не настала — обіцянку порушити неможливо, тому 1. Це і збиває більшість<\/figcaption><\/figure>","TTROWS":"<figure class=\"pic\"><p class=\"ptitle\">Як заповнити ліві стовпці, щоб нічого не пропустити<\/p>\n<div class=\"scroll\"><table>\n<tr><th>№<\/th><th>a<\/th><th>b<\/th><th>c<\/th><\/tr>\n<tr><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>2<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr>\n<tr><td>3<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr>\n<tr><td>4<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr>\n<tr><td>5<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>6<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr>\n<tr><td>7<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr>\n<tr><td>8<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Права колонка міняється щорядка, середня — через два, ліва — через чотири. Це просто лічба 0…7 у двійковій<\/figcaption><\/figure>","TT8":"<figure class=\"pic\"><p class=\"ptitle\">Приклад з лекції: F = ((a ∨ ¬b) ⊕ c) → ¬a<\/p>\n<div class=\"scroll\"><table>\n<tr><th>a<\/th><th>b<\/th><th>c<\/th><th>¬b<\/th><th>a ∨ ¬b<\/th><th>(a ∨ ¬b) ⊕ c<\/th><th>¬a<\/th><th>F<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td class=\"hi\">0<\/td><\/tr>\n<tr><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td class=\"t\">1<\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td class=\"hi\">0<\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td class=\"t\">1<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Проміжні стовпці — не для краси. Без них помилка неминуча<\/figcaption><\/figure>","KINDS":"<figure class=\"pic\"><p class=\"ptitle\">Три слова, які треба знати дослівно<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>тавтологія<\/b><span>стовпець F — самі одиниці. Приклад: a ∨ ¬a<\/span><\/div>\n<div class=\"kv\"><b>тотожно-хибна<\/b><span>стовпець F — самі нулі. Приклад: a ∧ ¬a<\/span><\/div>\n<div class=\"kv\"><b>виконлива<\/b><span>є хоча б одна 1, але НЕ всі. Тобто не тавтологія<\/span><\/div>\n<\/div>\n<figcaption>Пастка: тавтологія — це не «виконлива». За означенням виконлива формула тавтологією не є<\/figcaption><\/figure>","DEMORG":"<figure class=\"pic\"><svg viewBox=\"0 0 340 108\" class=\"nline\" role=\"img\" aria-label=\"Закони де Моргана\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Заперечення заходить усередину і міняє зв'язку<\/text>\n<text x=\"170\" y=\"42\" text-anchor=\"middle\" class=\"pbig\">¬(a ∧ b) = ¬a ∨ ¬b<\/text>\n<text x=\"170\" y=\"60\" text-anchor=\"middle\" class=\"pv\">«не обидва» = «хоча б одного немає»<\/text>\n<line x1=\"40\" y1=\"70\" x2=\"300\" y2=\"70\" class=\"leg\"/>\n<text x=\"170\" y=\"90\" text-anchor=\"middle\" class=\"pbig\">¬(a ∨ b) = ¬a ∧ ¬b<\/text>\n<text x=\"170\" y=\"104\" text-anchor=\"middle\" class=\"pv\">«жодного» = «немає першого і немає другого»<\/text>\n<\/svg><figcaption>Мінус заходить під дужку і перевертає знак — рівно як у ¬(x+y) в алгебрі<\/figcaption><\/figure>","PREDIC":"<figure class=\"pic\"><svg viewBox=\"0 0 340 126\" class=\"nline\" role=\"img\" aria-label=\"Як предикат стає висловлюванням\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">P(x) = «x &gt; 5» — це ще НЕ висловлювання<\/text>\n<rect x=\"90\" y=\"24\" width=\"160\" height=\"26\" rx=\"7\" class=\"cellhi\"/>\n<text x=\"170\" y=\"41\" text-anchor=\"middle\" class=\"pmonohi\">P(x)<\/text>\n<path d=\"M110 56 l-30 20\" class=\"arw\"/><path d=\"M76 80 l2 -9 l6 5 z\" class=\"arwf\"/>\n<path d=\"M230 56 l30 20\" class=\"arw\"/><path d=\"M264 80 l-8 -3 l2 8 z\" class=\"arwf\"/>\n<rect x=\"10\" y=\"82\" width=\"150\" height=\"34\" rx=\"7\" class=\"cell\"/>\n<text x=\"85\" y=\"96\" text-anchor=\"middle\" class=\"pmono\">підставити число<\/text>\n<text x=\"85\" y=\"110\" text-anchor=\"middle\" class=\"pgood\">P(7) = істина<\/text>\n<rect x=\"180\" y=\"82\" width=\"150\" height=\"34\" rx=\"7\" class=\"cell\"/>\n<text x=\"255\" y=\"96\" text-anchor=\"middle\" class=\"pmono\">поставити квантор<\/text>\n<text x=\"255\" y=\"110\" text-anchor=\"middle\" class=\"pgood\">∀x P(x) = хиба<\/text>\n<\/svg><figcaption>Два способи перетворити предикат на висловлювання. Третього немає<\/figcaption><\/figure>","QORDER":"<figure class=\"pic\"><p class=\"ptitle\">Порядок кванторів міняє зміст<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>∀x ∃y : y &gt; x<\/b><span>для кожного числа знайдеться більше. ІСТИНА — для кожного x беремо y = x+1<\/span><\/div>\n<div class=\"kv\"><b>∃y ∀x : y &gt; x<\/b><span>існує число, більше за ВСІ одразу. ХИБА — такого немає<\/span><\/div>\n<\/div>\n<figcaption>Ті самі значки, та сама нерівність — і різні відповіді. Читай строго зліва направо<\/figcaption><\/figure>","CHECKM":"<figure class=\"pic\"><p class=\"ptitle\">Як за 30 секунд перевірити знак ⊨<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>1. Припусти протилежне<\/b><span>вважай, що ВИСНОВОК хибний. Це дає значення частини змінних<\/span><\/div>\n<div class=\"kv\"><b>2. Дотягни посилки<\/b><span>спробуй зробити всі посилки істинними при цих значеннях<\/span><\/div>\n<div class=\"kv\"><b>3. Читай результат<\/b><span>вийшло → знак стоїть НЕправильно, ось контрприклад. Суперечність → правильно<\/span><\/div>\n<\/div>\n<figcaption>Повна таблиця не потрібна ніколи: або ти знаходиш один поганий рядок, або доводиш, що його немає<\/figcaption><\/figure>","RULES4":"<figure class=\"pic\"><p class=\"ptitle\">Чотири правила, які варто впізнавати з першого погляду<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Назва<\/th><th>Що дано<\/th><th>Що випливає<\/th><\/tr>\n<tr><td style=\"text-align:left\">modus ponens<\/td><td>A,  A → B<\/td><td class=\"hi\">B<\/td><\/tr>\n<tr><td style=\"text-align:left\">modus tollens<\/td><td>A → B,  ¬B<\/td><td class=\"hi\">¬A<\/td><\/tr>\n<tr><td style=\"text-align:left\">силогізм<\/td><td>A → B,  B → C<\/td><td class=\"hi\">A → C<\/td><\/tr>\n<tr><td style=\"text-align:left\">резолюція<\/td><td>¬A ∨ B,  A ∨ C<\/td><td class=\"hi\">B ∨ C<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Modus tollens іде НАЗАД: немає наслідку — значить не було й причини<\/figcaption><\/figure>","QPATTERN":"<figure class=\"pic\"><p class=\"ptitle\">Два шаблони. Більше в ПР 3 нічого й не треба<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Українською<\/th><th>Формулою<\/th><th>Зв'язка<\/th><\/tr>\n<tr><td style=\"text-align:left\">усі P є Q<\/td><td class=\"hi\">∀x (P(x) → Q(x))<\/td><td>∀ живе з →<\/td><\/tr>\n<tr><td style=\"text-align:left\">жоден P не є Q<\/td><td class=\"hi\">∀x (P(x) → ¬Q(x))<\/td><td>∀ живе з →<\/td><\/tr>\n<tr><td style=\"text-align:left\">деякі P є Q<\/td><td class=\"hi\">∃x (P(x) ∧ Q(x))<\/td><td>∃ живе з ∧<\/td><\/tr>\n<tr><td style=\"text-align:left\">деякі P не є Q<\/td><td class=\"hi\">∃x (P(x) ∧ ¬Q(x))<\/td><td>∃ живе з ∧<\/td><\/tr>\n<\/table><\/div>\n<figcaption>∀ ходить у парі з →, ∃ ходить у парі з ∧. Переплутати їх — головна помилка теми<\/figcaption><\/figure>","QWRONG":"<figure class=\"pic\"><p class=\"ptitle\">Чому не можна писати ∀x (P(x) ∧ Q(x))<\/p>\n<div class=\"cols\">\n<div class=\"kv\" style=\"border-color:var(--bad)\"><b style=\"color:var(--bad)\">∀x (двієчник(x) ∧ ледачий(x))<\/b><span>каже: КОЖНА людина у світі — двієчник і ледар. Умова такого не стверджує<\/span><\/div>\n<div class=\"kv\" style=\"border-color:var(--good)\"><b style=\"color:var(--good)\">∀x (двієчник(x) → ледачий(x))<\/b><span>каже: якщо вже двієчник — то ледар. Про решту людей нічого<\/span><\/div>\n<div class=\"kv\" style=\"border-color:var(--bad)\"><b style=\"color:var(--bad)\">∃x (P(x) → Q(x))<\/b><span>дзеркальна помилка: така формула майже завжди істинна, а тому нічого не означає<\/span><\/div>\n<\/div>\n<figcaption>Стрілка обмежує область, кон'юнкція стверджує. Тому «усі» просить →, а «деякі» просить ∧<\/figcaption><\/figure>","NEGFORMS":"<figure class=\"pic\"><p class=\"ptitle\">Заперечення: чотири готові пари<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Твердження<\/th><th>Його заперечення<\/th><\/tr>\n<tr><td>∀x (P → Q)<\/td><td class=\"hi\">∃x (P ∧ ¬Q)<\/td><\/tr>\n<tr><td>∃x (P ∧ Q)<\/td><td class=\"hi\">∀x (P → ¬Q)<\/td><\/tr>\n<tr><td>∀x (P → ¬Q)<\/td><td class=\"hi\">∃x (P ∧ Q)<\/td><\/tr>\n<tr><td>∃x (P ∧ ¬Q)<\/td><td class=\"hi\">∀x (P → Q)<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Квантор перевертається, стрілка стає кон'юнкцією і навпаки, а другий предикат міняє знак<\/figcaption><\/figure>","QUANT":"<figure class=\"pic\"><svg viewBox=\"0 0 340 116\" class=\"nline\" role=\"img\" aria-label=\"Квантори та їх заперечення\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Заперечення міняє квантор і заходить усередину<\/text>\n<text x=\"170\" y=\"42\" text-anchor=\"middle\" class=\"pbig\">¬∀x P(x) = ∃x ¬P(x)<\/text>\n<text x=\"170\" y=\"59\" text-anchor=\"middle\" class=\"pv\">«не всі» = «знайдеться той, хто ні»<\/text>\n<line x1=\"40\" y1=\"70\" x2=\"300\" y2=\"70\" class=\"leg\"/>\n<text x=\"170\" y=\"92\" text-anchor=\"middle\" class=\"pbig\">¬∃x P(x) = ∀x ¬P(x)<\/text>\n<text x=\"170\" y=\"109\" text-anchor=\"middle\" class=\"pv\">«жодного немає» = «кожен — ні»<\/text>\n<\/svg><figcaption>∀ = «для кожного», ∃ = «існує хоча б один». Під запереченням вони міняються місцями<\/figcaption><\/figure>","RABBIT":"<figure class=\"pic\"><p class=\"ptitle\">Кролики з ПР 3: M — ненажерливий, S — старий, B — чорний<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Речення<\/th><th>Формула<\/th><\/tr>\n<tr><td style=\"text-align:left\">(а) жоден старий не ненажерливий<\/td><td class=\"hi\">∀x (S(x) → ¬M(x))<\/td><\/tr>\n<tr><td style=\"text-align:left\">(б) деякі ненажерливі — чорні<\/td><td class=\"hi\">∃x (M(x) ∧ B(x))<\/td><\/tr>\n<tr><td style=\"text-align:left\">(в) усім не чорним не властива ненажерливість<\/td><td class=\"hi\">∀x (¬B(x) → ¬M(x))<\/td><\/tr>\n<tr><td style=\"text-align:left\">(г) усі ненажерливі — молоді<\/td><td class=\"hi\">∀x (M(x) → ¬S(x))<\/td><\/tr>\n<\/table><\/div>\n<figcaption>«Молодий» — це просто ¬S. Нового предиката вигадувати не треба<\/figcaption><\/figure>","MODEL":"<figure class=\"pic\"><svg viewBox=\"0 0 340 130\" class=\"nline\" role=\"img\" aria-label=\"Контрприклад як один кролик\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Спростувати висновок можна одним кроликом<\/text>\n<rect x=\"70\" y=\"26\" width=\"200\" height=\"62\" rx=\"9\" class=\"cellhi\"/>\n<text x=\"170\" y=\"45\" text-anchor=\"middle\" class=\"pvalb\">старий: так<\/text>\n<text x=\"170\" y=\"61\" text-anchor=\"middle\" class=\"pvalb\">ненажерливий: ні<\/text>\n<text x=\"170\" y=\"77\" text-anchor=\"middle\" class=\"pvalb\">чорний: так<\/text>\n<text x=\"170\" y=\"104\" text-anchor=\"middle\" class=\"pgood\">обидві посилки — істинні<\/text>\n<text x=\"170\" y=\"120\" text-anchor=\"middle\" class=\"pbad\">висновок «усі старі не чорні» — хибний<\/text>\n<\/svg><figcaption>Не треба будувати цілий світ кроликів. Один правильно підібраний — це вже повне спростування<\/figcaption><\/figure>","EXPRESS":"<figure class=\"pic\"><p class=\"ptitle\">Виразити предикат: усе зводиться до «існує таке z»<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Треба виразити<\/th><th>Через S(x,y,z): x+y=z та P(x,y,z): x·y=z<\/th><\/tr>\n<tr><td style=\"text-align:left\">x = y<\/td><td class=\"hi\">∃z (0(z) ∧ S(x, z, y))<\/td><\/tr>\n<tr><td style=\"text-align:left\">x &lt; y<\/td><td class=\"hi\">∃z (¬0(z) ∧ S(x, z, y))<\/td><\/tr>\n<tr><td style=\"text-align:left\">x ділиться на y<\/td><td class=\"hi\">∃z P(y, z, x)<\/td><\/tr>\n<tr><td style=\"text-align:left\">x — частка від y : z<\/td><td class=\"hi\">P(x, z, y)<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Прийом один: те, чого бракує, оголошуємо новою змінною під ∃. «x менше y» = «до x можна щось ненульове додати й отримати y»<\/figcaption><\/figure>","GEOM":"<figure class=\"pic\"><p class=\"ptitle\">Та сама ідея в геометрії: P1 — точка, P2 — пряма, P3(x,y) — x лежить на y<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>x і y перетинаються<\/b><span>∃z (P1(z) ∧ P3(z,x) ∧ P3(z,y)) — існує спільна точка<\/span><\/div>\n<div class=\"kv\"><b>x, y, z на одній прямій<\/b><span>∃u (P2(u) ∧ P3(x,u) ∧ P3(y,u) ∧ P3(z,u))<\/span><\/div>\n<div class=\"kv\"><b>x і y паралельні<\/b><span>¬∃z (P1(z) ∧ P3(z,x) ∧ P3(z,y)) — спільної точки НЕМАЄ<\/span><\/div>\n<\/div>\n<figcaption>Паралельність — це просто заперечення перетину. Окремої ідеї вигадувати не треба<\/figcaption><\/figure>","PARITY":"<figure class=\"pic\"><p class=\"ptitle\">Парність: усе доведення тримається на двох записах<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Слово<\/th><th>Запис<\/th><th>Що з ним роблять<\/th><\/tr>\n<tr><td>парне<\/td><td class=\"hi\">x = 2k<\/td><td style=\"text-align:left\">підставляють і виносять 2 за дужку<\/td><\/tr>\n<tr><td>непарне<\/td><td class=\"hi\">x = 2k + 1<\/td><td style=\"text-align:left\">підставляють і виносять 2, лишається +1<\/td><\/tr>\n<tr><td>x² парне<\/td><td class=\"hi\">⟺ x парне<\/td><td style=\"text-align:left\">окремий факт, ним користуються постійно<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Побачив слово «парне» — одразу пиши 2k. Далі задача розв'язується сама<\/figcaption><\/figure>","PROOFWAYS":"<figure class=\"pic\"><p class=\"ptitle\">Чотири способи. Формулювання задачі підказує, який брати<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Спосіб<\/th><th>Коли брати<\/th><th>Що робиш<\/th><\/tr>\n<tr><td style=\"text-align:left\">прямо<\/td><td style=\"text-align:left\">«доведіть, що…»<\/td><td style=\"text-align:left\">підставляєш означення і рахуєш<\/td><\/tr>\n<tr><td style=\"text-align:left\">контрапозиція<\/td><td style=\"text-align:left\">«якщо A, то B» і B простіше заперечити<\/td><td style=\"text-align:left\">доводиш ¬B → ¬A<\/td><\/tr>\n<tr><td style=\"text-align:left\">від супротивного<\/td><td style=\"text-align:left\">«не існує», «не має коренів»<\/td><td style=\"text-align:left\">припускаєш, що є, і ловиш суперечність<\/td><\/tr>\n<tr><td style=\"text-align:left\">контрприклад<\/td><td style=\"text-align:left\">«доведіть чи спростуйте»<\/td><td style=\"text-align:left\">шукаєш одне число, яке все ламає<\/td><\/tr>\n<\/table><\/div>\n<figcaption>«Доведіть чи спростуйте» майже завжди означає «спростуйте». Спершу хвилину шукай контрприклад<\/figcaption><\/figure>","EXIST":"<figure class=\"pic\"><svg viewBox=\"0 0 340 124\" class=\"nline\" role=\"img\" aria-label=\"Доведення існування великого простого\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Існує просте число, більше за 10¹⁰⁰<\/text>\n<rect x=\"12\" y=\"26\" width=\"150\" height=\"34\" rx=\"7\" class=\"cell\"/>\n<text x=\"87\" y=\"40\" text-anchor=\"middle\" class=\"pmonohi\">N = 10¹⁰⁰<\/text>\n<text x=\"87\" y=\"54\" text-anchor=\"middle\" class=\"pv\">беремо M = N! + 1<\/text>\n<path d=\"M166 43 h12\" class=\"arw\"/><path d=\"M182 43 l-7 -4 v8 z\" class=\"arwf\"/>\n<rect x=\"186\" y=\"26\" width=\"142\" height=\"34\" rx=\"7\" class=\"cellhi\"/>\n<text x=\"257\" y=\"40\" text-anchor=\"middle\" class=\"pmonohi\">p ділить M<\/text>\n<text x=\"257\" y=\"54\" text-anchor=\"middle\" class=\"pv\">будь-який його дільник<\/text>\n<text x=\"170\" y=\"80\" text-anchor=\"middle\" class=\"pv\">Якби p ⩽ N, то p ділило б і N!, і M,<\/text>\n<text x=\"170\" y=\"94\" text-anchor=\"middle\" class=\"pv\">а отже й різницю M − N! = 1<\/text>\n<text x=\"170\" y=\"112\" text-anchor=\"middle\" class=\"pgood\">Одиниця на просте не ділиться → p &gt; N<\/text>\n<\/svg><figcaption>Ідея Евкліда: не шукаємо конкретне число, а показуємо, що воно мусить бути<\/figcaption><\/figure>","INDSKEL":"<figure class=\"pic\"><p class=\"ptitle\">Скелет, який просто переписуєш у зошит<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Рядок<\/th><th>Що пишеш<\/th><\/tr>\n<tr><td style=\"text-align:left\">База<\/td><td style=\"text-align:left\">при n = 1 (або з якого сказано): ліворуч …, праворуч …, збіглося<\/td><\/tr>\n<tr><td style=\"text-align:left\">Припущення<\/td><td style=\"text-align:left\">нехай рівність виконується при n = k<\/td><\/tr>\n<tr><td style=\"text-align:left\">Перехід<\/td><td style=\"text-align:left\">доведемо для n = k+1. Виділяємо шматок із припущення, підставляємо, зводимо<\/td><\/tr>\n<tr><td style=\"text-align:left\">Висновок<\/td><td style=\"text-align:left\">за принципом математичної індукції — для всіх n<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Це чотири рядки на кожну задачу ПР 4. Змінюється лише алгебра всередині переходу<\/figcaption><\/figure>","INDUCT":"<figure class=\"pic\"><svg viewBox=\"0 0 340 104\" class=\"nline\" role=\"img\" aria-label=\"Індукція як доміно\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Індукція — це ряд доміно<\/text>\n<rect x=\"26\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cellhi\"/>\n<rect x=\"66\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cell\"/>\n<rect x=\"106\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cell\"/>\n<rect x=\"146\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cell\"/>\n<rect x=\"186\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cell\"/>\n<rect x=\"226\" y=\"30\" width=\"13\" height=\"42\" rx=\"2\" class=\"cell\"/>\n<text x=\"266\" y=\"56\" class=\"pmono\">…<\/text>\n<path d=\"M32 82 q40 16 80 0\" class=\"arw\"/><path d=\"M112 82 l-7 -4 v8 z\" class=\"arwf\"/>\n<text x=\"32\" y=\"98\" text-anchor=\"middle\" class=\"pgood\">база<\/text>\n<text x=\"150\" y=\"98\" text-anchor=\"middle\" class=\"pv\">крок: k → k+1<\/text>\n<\/svg><figcaption>База штовхає першу кістку. Крок гарантує, що кожна валить наступну. Разом — падають усі<\/figcaption><\/figure>","SUMSTEP":"<figure class=\"pic\"><svg viewBox=\"0 0 340 106\" class=\"nline\" role=\"img\" aria-label=\"Перехід у задачах на суму\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Перехід у сумі — це завжди один і той самий рух<\/text>\n<text x=\"170\" y=\"42\" text-anchor=\"middle\" class=\"pbig\">S(k+1) = S(k) + a(k+1)<\/text>\n<text x=\"170\" y=\"60\" text-anchor=\"middle\" class=\"pv\">стару суму замінюємо формулою з припущення<\/text>\n<line x1=\"40\" y1=\"70\" x2=\"300\" y2=\"70\" class=\"leg\"/>\n<text x=\"170\" y=\"88\" text-anchor=\"middle\" class=\"pv\">далі тільки алгебра: спільний знаменник,<\/text>\n<text x=\"170\" y=\"102\" text-anchor=\"middle\" class=\"pv\">винести дужку, звести до формули з k+1<\/text>\n<\/svg><figcaption>Ніякої кмітливості: додав наступний доданок, підставив припущення, згорнув<\/figcaption><\/figure>","TELESC":"<figure class=\"pic\"><p class=\"ptitle\">Задача A4: сума дробів дорівнює n / (2n+1)<\/p>\n<div class=\"scroll\"><table>\n<tr><th>n<\/th><th>Сума<\/th><th>n / (2n+1)<\/th><\/tr>\n<tr><td>1<\/td><td>1/3<\/td><td class=\"hi\">1/3<\/td><\/tr>\n<tr><td>2<\/td><td>1/3 + 1/15 = 2/5<\/td><td class=\"hi\">2/5<\/td><\/tr>\n<tr><td>3<\/td><td>2/5 + 1/35 = 3/7<\/td><td class=\"hi\">3/7<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Перед доведенням завжди підстав n = 1, 2, 3. Це і база, і перевірка, що формулу переписав правильно<\/figcaption><\/figure>","DIVTRICK":"<figure class=\"pic\"><p class=\"ptitle\">Подільність: додай і відніми — і припущення саме вилізе<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Задача<\/th><th>Крок переходу<\/th><th>Залишок<\/th><\/tr>\n<tr><td style=\"text-align:left\">5ⁿ − 1 ⋮ 4<\/td><td>5·(5ᵏ − 1) + 4<\/td><td class=\"hi\">4 ⋮ 4<\/td><\/tr>\n<tr><td style=\"text-align:left\">11ⁿ − 6 ⋮ 5<\/td><td>11·(11ᵏ − 6) + 60<\/td><td class=\"hi\">60 ⋮ 5<\/td><\/tr>\n<tr><td style=\"text-align:left\">6·7ⁿ − 2·3ⁿ ⋮ 4<\/td><td>7·(6·7ᵏ − 2·3ᵏ) + 8·3ᵏ<\/td><td class=\"hi\">8·3ᵏ ⋮ 4<\/td><\/tr>\n<tr><td style=\"text-align:left\">3ⁿ + 7ⁿ − 2 ⋮ 8<\/td><td>3·(3ᵏ + 7ᵏ − 2) + 4·(7ᵏ + 1)<\/td><td class=\"hi\">7ᵏ+1 парне → ⋮ 8<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Схема одна: винести множник так, щоб у дужках стояв рівно вираз із припущення, а решту показати кратною окремо<\/figcaption><\/figure>","INEQ":"<figure class=\"pic\"><svg viewBox=\"0 0 340 116\" class=\"nline\" role=\"img\" aria-label=\"Нерівності в індукції\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">Нерівність: ланцюжок із двох ланок<\/text>\n<rect x=\"12\" y=\"26\" width=\"100\" height=\"30\" rx=\"7\" class=\"cellhi\"/>\n<text x=\"62\" y=\"46\" text-anchor=\"middle\" class=\"pmonohi\">(k+1)³<\/text>\n<path d=\"M116 41 h16\" class=\"arw\"/><path d=\"M136 41 l-7 -4 v8 z\" class=\"arwf\"/>\n<rect x=\"140\" y=\"26\" width=\"80\" height=\"30\" rx=\"7\" class=\"cell\"/>\n<text x=\"180\" y=\"46\" text-anchor=\"middle\" class=\"pmono\">&lt; 3k³<\/text>\n<path d=\"M224 41 h16\" class=\"arw\"/><path d=\"M244 41 l-7 -4 v8 z\" class=\"arwf\"/>\n<rect x=\"248\" y=\"26\" width=\"80\" height=\"30\" rx=\"7\" class=\"cellhi\"/>\n<text x=\"288\" y=\"46\" text-anchor=\"middle\" class=\"pmonohi\">&lt; 3·3ᵏ<\/text>\n<text x=\"170\" y=\"76\" text-anchor=\"middle\" class=\"pv\">Перша ланка — алгебра: (1 + 1/k)³ ⩽ 3 при k ⩾ 4<\/text>\n<text x=\"170\" y=\"94\" text-anchor=\"middle\" class=\"pv\">Друга ланка — припущення індукції: k³ &lt; 3ᵏ<\/text>\n<text x=\"170\" y=\"112\" text-anchor=\"middle\" class=\"pgood\">Разом: (k+1)³ &lt; 3ᵏ⁺¹<\/text>\n<\/svg><figcaption>У нерівностях перехід — це ланцюжок оцінок. Одна ланка від алгебри, одна від припущення<\/figcaption><\/figure>","ONLYIF":"<figure class=\"pic\"><p class=\"ptitle\">Українська фраза → формула. Тут ламається найбільше людей<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Як сказано<\/th><th>Формула<\/th><th>Пояснення<\/th><\/tr>\n<tr><td style=\"text-align:left\">якщо a, то b<\/td><td class=\"hi\">a → b<\/td><td style=\"text-align:left\">звичайна імплікація<\/td><\/tr>\n<tr><td style=\"text-align:left\">a, <b>лише якщо<\/b> b<\/td><td class=\"hi\">a → b<\/td><td style=\"text-align:left\">b — необхідна умова для a<\/td><\/tr>\n<tr><td style=\"text-align:left\">a, <b>якщо<\/b> b<\/td><td class=\"hi\">b → a<\/td><td style=\"text-align:left\">стрілка в інший бік!<\/td><\/tr>\n<tr><td style=\"text-align:left\">a <b>тоді й лише тоді<\/b>, коли b<\/td><td class=\"hi\">a ↔ b<\/td><td style=\"text-align:left\">обидві стрілки<\/td><\/tr>\n<tr><td style=\"text-align:left\">a, <b>проте<\/b> b<\/td><td class=\"hi\">a ∧ b<\/td><td style=\"text-align:left\">«проте», «але», «а» — це ∧<\/td><\/tr>\n<tr><td style=\"text-align:left\">a <b>достатньо<\/b> для b<\/td><td class=\"hi\">a → b<\/td><td style=\"text-align:left\">достатня умова стоїть ЗЛІВА<\/td><\/tr>\n<tr><td style=\"text-align:left\">a <b>необхідно<\/b> для b<\/td><td class=\"hi\">b → a<\/td><td style=\"text-align:left\">необхідна умова стоїть СПРАВА<\/td><\/tr>\n<\/table><\/div>\n<figcaption>«Лише якщо» і «якщо» дають протилежні стрілки. Це найдорожча пастка всього Тижня 1<\/figcaption><\/figure>","NECSUF":"<figure class=\"pic\"><svg viewBox=\"0 0 340 132\" class=\"nline\" role=\"img\" aria-label=\"Необхідна і достатня умова\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" class=\"pt\">У записі a → b дві умови мають різні імена<\/text>\n<rect x=\"12\" y=\"26\" width=\"150\" height=\"46\" rx=\"8\" class=\"cellhi\"/>\n<text x=\"87\" y=\"44\" text-anchor=\"middle\" class=\"pmonohi\">a — ДОСТАТНЯ<\/text>\n<text x=\"87\" y=\"60\" text-anchor=\"middle\" class=\"pv\">вистачить a, щоб було b<\/text>\n<rect x=\"176\" y=\"26\" width=\"152\" height=\"46\" rx=\"8\" class=\"cellhi\"/>\n<text x=\"252\" y=\"44\" text-anchor=\"middle\" class=\"pmonohi\">b — НЕОБХІДНА<\/text>\n<text x=\"252\" y=\"60\" text-anchor=\"middle\" class=\"pv\">без b не буде a<\/text>\n<text x=\"170\" y=\"92\" text-anchor=\"middle\" class=\"pv\">«Щоб бути студентом KSE, треба скласти НМТ»<\/text>\n<text x=\"170\" y=\"108\" text-anchor=\"middle\" class=\"pgood\">НМТ необхідне → студент(x) → НМТ(x)<\/text>\n<text x=\"170\" y=\"126\" text-anchor=\"middle\" class=\"pbad\">але НМТ недостатнє: НМТ(x) → студент(x) хибно<\/text>\n<\/svg><figcaption>Достатня умова стоїть зліва від стрілки, необхідна — справа. Плутати їх коштує половини задачі<\/figcaption><\/figure>","STEPS5":"<figure class=\"pic\"><p class=\"ptitle\">Порядок спрощення. Завжди той самий<\/p>\n<div class=\"scroll\"><table>\n<tr><th>№<\/th><th>Що робимо<\/th><th>Чим<\/th><\/tr>\n<tr><td>1<\/td><td style=\"text-align:left\">прибираємо всі → і ↔<\/td><td>A → B = ¬A ∨ B<\/td><\/tr>\n<tr><td>2<\/td><td style=\"text-align:left\">заганяємо ¬ всередину<\/td><td>де Морган<\/td><\/tr>\n<tr><td>3<\/td><td style=\"text-align:left\">знімаємо подвійні ¬<\/td><td>¬¬A = A<\/td><\/tr>\n<tr><td>4<\/td><td style=\"text-align:left\">розкриваємо або виносимо дужки<\/td><td>дистрибутивність<\/td><\/tr>\n<tr><td>5<\/td><td style=\"text-align:left\">скорочуємо<\/td><td>поглинання, A ∨ ¬A = 1<\/td><\/tr>\n<\/table><\/div>\n<figcaption>У цьому порядку задача «звести до однієї дії» розв'язується механічно. У будь-якому іншому — застрягає<\/figcaption><\/figure>","REVERSE":"<figure class=\"pic\"><p class=\"ptitle\">Зворотна задача: маємо потрібні рядки → пишемо формулу<\/p>\n<div class=\"scroll\"><table>\n<tr><th>a<\/th><th>b<\/th><th>c<\/th><th>треба<\/th><th>внесок у формулу<\/th><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>0<\/td><td class=\"t\">1<\/td><td class=\"hi\">a ∧ b ∧ ¬c<\/td><\/tr>\n<tr><td>1<\/td><td>0<\/td><td>1<\/td><td class=\"t\">1<\/td><td class=\"hi\">a ∧ ¬b ∧ c<\/td><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>1<\/td><td class=\"t\">1<\/td><td class=\"hi\">¬a ∧ b ∧ c<\/td><\/tr>\n<tr><td colspan=\"5\" style=\"text-align:left\">решта рядків — 0, вони нічого не додають<\/td><\/tr>\n<\/table><\/div>\n<figcaption>Правило: за кожен потрібний рядок пишемо кон'юнкцію (змінна як є, якщо 1; із ¬, якщо 0), а всі такі кон'юнкції з'єднуємо через ∨<\/figcaption><\/figure>","CONTRAD":"<figure class=\"pic\"><p class=\"ptitle\">Особливий випадок: посилки суперечать одна одній<\/p>\n<div class=\"cols\">\n<div class=\"kv\"><b>x ∧ y ∧ ¬z<\/b><span>вимагає x = 1, y = 1, z = 0<\/span><\/div>\n<div class=\"kv\"><b>y → z<\/b><span>при y = 1 вимагає z = 1<\/span><\/div>\n<div class=\"kv\"><b>y → x<\/b><span>тут проблем немає<\/span><\/div>\n<\/div>\n<p class=\"small mt10\" style=\"text-align:center;color:var(--bad);font-weight:600\">z не може бути водночас 0 і 1 — жодного рядка, де всі три посилки істинні, не існує<\/p>\n<p class=\"small mt6\" style=\"text-align:center;color:var(--good);font-weight:600\">отже «поганого» рядка теж немає, і наслідком є будь-яка формула<\/p>\n<figcaption>З суперечливих посилок формально випливає все. Це не хитрість, а прямий наслідок означення<\/figcaption><\/figure>","CHAINS":"<figure class=\"pic\"><p class=\"ptitle\">Ланцюжок імплікацій: рахуємо зсередини назовні<\/p>\n<div class=\"scroll\"><table>\n<tr><th>n<\/th><th>F пр<span style=\"letter-spacing:0\">и<\/span> x = 0<\/th><th>F при x = 1<\/th><th>тавтологія?<\/th><\/tr>\n<tr><td>1<\/td><td>x → x = 1<\/td><td>1<\/td><td class=\"t\">так<\/td><\/tr>\n<tr><td>2<\/td><td>1 → 0 = 0<\/td><td>1<\/td><td class=\"f\">ні<\/td><\/tr>\n<tr><td>3<\/td><td>0 → 0 = 1<\/td><td>1<\/td><td class=\"t\">так<\/td><\/tr>\n<tr><td>4<\/td><td>1 → 0 = 0<\/td><td>1<\/td><td class=\"f\">ні<\/td><\/tr>\n<\/table><\/div>\n<figcaption>При x = 1 усе завжди 1, тож вирішує лише стовпець x = 0. Він чергується — і відповідь виходить «непарні n»<\/figcaption><\/figure>","VENN_OPS":"<figure class=\"pic\"><p class=\"ptitle\">Чотири операції на одному малюнку<\/p><div class=\"cols\"><div class=\"venn\" style=\"flex:1 1 180px\"><svg viewBox=\"0 0 280 132\" role=\"img\" aria-label=\"A ∪ B\"><defs><clipPath id=\"a0\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/clipPath><clipPath id=\"b0\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/clipPath><\/defs><rect class=\"u\" x=\"6\" y=\"6\" width=\"268\" height=\"120\" rx=\"4\"/><g class=\"sh\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><g class=\"s\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><text x=\"70\" y=\"24\">A<\/text><text x=\"204\" y=\"24\">B<\/text><text x=\"14\" y=\"122\" style=\"font-size:12px\">A ∪ B<\/text><\/svg><\/div><div class=\"venn\" style=\"flex:1 1 180px\"><svg viewBox=\"0 0 280 132\" role=\"img\" aria-label=\"A ∩ B\"><defs><clipPath id=\"a1\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/clipPath><clipPath id=\"b1\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/clipPath><\/defs><rect class=\"u\" x=\"6\" y=\"6\" width=\"268\" height=\"120\" rx=\"4\"/><g class=\"sh\" clip-path=\"url(#a1)\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><g class=\"s\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><text x=\"70\" y=\"24\">A<\/text><text x=\"204\" y=\"24\">B<\/text><text x=\"14\" y=\"122\" style=\"font-size:12px\">A ∩ B<\/text><\/svg><\/div><div class=\"venn\" style=\"flex:1 1 180px\"><svg viewBox=\"0 0 280 132\" role=\"img\" aria-label=\"A \\ B\"><defs><clipPath id=\"a2\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/clipPath><clipPath id=\"b2\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/clipPath><\/defs><rect class=\"u\" x=\"6\" y=\"6\" width=\"268\" height=\"120\" rx=\"4\"/><g class=\"sh\"><mask id=\"m2\"><rect width=\"280\" height=\"132\" fill=\"#fff\"/><circle cx=\"170\" cy=\"66\" r=\"52\" fill=\"#000\"/><\/mask><circle cx=\"110\" cy=\"66\" r=\"52\" mask=\"url(#m2)\"/><\/g><g class=\"s\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><text x=\"70\" y=\"24\">A<\/text><text x=\"204\" y=\"24\">B<\/text><text x=\"14\" y=\"122\" style=\"font-size:12px\">A \\ B<\/text><\/svg><\/div><div class=\"venn\" style=\"flex:1 1 180px\"><svg viewBox=\"0 0 280 132\" role=\"img\" aria-label=\"A △ B\"><defs><clipPath id=\"a3\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/clipPath><clipPath id=\"b3\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/clipPath><\/defs><rect class=\"u\" x=\"6\" y=\"6\" width=\"268\" height=\"120\" rx=\"4\"/><g class=\"sh\"><mask id=\"m3\"><rect width=\"280\" height=\"132\" fill=\"#fff\"/><g clip-path=\"url(#a3)\"><circle cx=\"170\" cy=\"66\" r=\"52\" fill=\"#000\"/><\/g><\/mask><g mask=\"url(#m3)\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><\/g><g class=\"s\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><text x=\"70\" y=\"24\">A<\/text><text x=\"204\" y=\"24\">B<\/text><text x=\"14\" y=\"122\" style=\"font-size:12px\">A △ B<\/text><\/svg><\/div><\/div><figcaption>Заштриховано те, що входить у результат. Різниця — лише «своє» ліве коло без спільної частини<\/figcaption><\/figure>","VENN_COMPL":"<figure class=\"pic\"><p class=\"ptitle\">Доповнення: все поза A<\/p><div class=\"venn\"><svg viewBox=\"0 0 280 132\" role=\"img\" aria-label=\"Ā = U \\ A\"><defs><clipPath id=\"a9\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/clipPath><clipPath id=\"b9\"><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/clipPath><\/defs><rect class=\"u\" x=\"6\" y=\"6\" width=\"268\" height=\"120\" rx=\"4\"/><g class=\"sh\"><mask id=\"m9\"><rect width=\"280\" height=\"132\" fill=\"#fff\"/><circle cx=\"110\" cy=\"66\" r=\"52\"/><\/mask><rect x=\"6\" y=\"6\" width=\"268\" height=\"120\" mask=\"url(#m9)\"/><\/g><g class=\"s\"><circle cx=\"110\" cy=\"66\" r=\"52\"/><circle cx=\"170\" cy=\"66\" r=\"52\"/><\/g><text x=\"70\" y=\"24\">A<\/text><text x=\"204\" y=\"24\">B<\/text><text x=\"14\" y=\"122\" style=\"font-size:12px\">Ā = U \\ A<\/text><\/svg><\/div><figcaption>Прямокутник — універсальна множина U, «усе, про що йде мова». Доповнення — прямокутник без A<\/figcaption><\/figure>","SET_VS_ELEM":"<figure class=\"pic\"><p class=\"ptitle\">∈ чи ⊆ — питання «що зліва?»<\/p><table><tr><th>Запис<\/th><th>Що зліва<\/th><th>Вірно?<\/th><th>Чому<\/th><\/tr><tr><td>2 ∈ {1, 2, 3}<\/td><td>число<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">2 лежить у мішку<\/td><\/tr><tr><td>{2} ⊆ {1, 2, 3}<\/td><td>мішок<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">кожен елемент {2} є в правому<\/td><\/tr><tr><td>{2} ∈ {1, 2, 3}<\/td><td>мішок<\/td><td class=\"f\">ні<\/td><td style=\"text-align:left\">у правому лежать числа, а не мішок {2}<\/td><\/tr><tr><td>2 ⊆ {1, 2, 3}<\/td><td>число<\/td><td class=\"f\">ні<\/td><td style=\"text-align:left\">⊆ ставлять лише між множинами<\/td><\/tr><tr><td>{1} ∈ {1, {1}}<\/td><td>мішок<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">у правому лежить сам мішок {1}<\/td><\/tr><tr><td>∅ ⊆ {1}<\/td><td>порожній мішок<\/td><td class=\"t\">так<\/td><td style=\"text-align:left\">перевіряти нічого — включення виконане<\/td><\/tr><\/table><figcaption>Зліва предмет — питай про ∈. Зліва мішок — питай про ⊆ (а про ∈ — лише якщо цей мішок сам лежить усередині)<\/figcaption><\/figure>","EMPTY_BAGS":"<figure class=\"pic\"><p class=\"ptitle\">∅, {∅}, {{∅}} — три різні речі<\/p><div class=\"cols\"><div class=\"kv\"><b>∅<\/b><span>порожній мішок. Елементів: 0<\/span><\/div><div class=\"kv\"><b>{∅}<\/b><span>мішок, у якому лежить порожній мішок. Елементів: 1<\/span><\/div><div class=\"kv\"><b>{∅, {∅}}<\/b><span>мішок з двома речами: ∅ і {∅}. Елементів: 2<\/span><\/div><\/div><figcaption>Рахуй фігурні дужки: кожна пара — ще один мішок<\/figcaption><\/figure>","SUBSETS_8":"<figure class=\"pic\"><p class=\"ptitle\">Усі підмножини {a, b, c} — рівно 2³ = 8<\/p><table><tr><th>0 елементів<\/th><th>1 елемент<\/th><th>2 елементи<\/th><th>3 елементи<\/th><\/tr><tr><td>∅<\/td><td>{a}<\/td><td>{a, b}<\/td><td>{a, b, c}<\/td><\/tr><tr><td><\/td><td>{b}<\/td><td>{a, c}<\/td><td><\/td><\/tr><tr><td><\/td><td>{c}<\/td><td>{b, c}<\/td><td><\/td><\/tr><\/table><figcaption>Кожен елемент або береш, або ні: 2·2·2 = 8 варіантів. Порожня і сама множина — теж підмножини<\/figcaption><\/figure>"}}},"foundation":[{"id":"c:element","level":0,"t":"Предмет (річ)","one":"Будь-що, на що можна вказати пальцем і сказати «оце»: число, буква, яблуко, навіть інший мішок.","body":[["Уяви","На столі лежать олівець, ключ і монета. Кожне з них — окремий предмет: три речі, кожну можна взяти в руку."],["На числах","Числа $1$, $2$, $3$ — теж предмети, просто їх не помацаєш. Ми їх «беремо» очима."],["Дивно, але","Мішок із речами — теж предмет. Його можна покласти в інший мішок. Це знадобиться в множинах."]],"prereq":[],"aliases":["предмет","предмети","об'єкт","об'єкти"],"next":["c:set-bag","c:math115:set","c:math115:membership"]},{"id":"c:count","level":0,"t":"Лічба: скільки","one":"Порахувати — назвати предмети по черзі «один, два, три…» і сказати останнє число.","body":[["Уяви","Три яблука на столі. Тицяємо в кожне: один, два, три. Відповідь — три."],["Правило","Кожен предмет рахуємо рівно один раз. Те саме яблуко двічі — не рахуємо."],["Пастка","«Скільки різних?» — однакові речі рахуємо як одну. У наборі $1, 1, 2$ різних чисел два."]],"prereq":[],"aliases":["скільки","кількість","порахувати","лічба"],"check":{"q":"Скільки різних чисел у наборі $3, 3, 5, 3$?","a":["2","два"]},"next":["c:all-some","c:set-bag","c:math115:cardinality"]},{"id":"c:zero","level":0,"t":"Нуль — «нічого»","one":"Нуль — це кількість, коли предметів немає взагалі. Порожній стіл, порожня кишеня.","body":[["Уяви","У кишені нічого. Скільки монет? Нуль. Це чесна відповідь, а не «не знаю»."],["Правило","Порожньо — теж стан, який можна назвати й записати: $0$ предметів."],["Далі буде","Мішок, у якому нічого немає, — теж мішок. У множинах його звуть порожньою множиною."]],"prereq":[],"aliases":["нуль","нічого немає","порожньо"],"next":["c:math115:empty-set"]},{"id":"c:natural-numbers","level":0,"t":"Натуральні числа","one":"Числа, якими рахують предмети: $1, 2, 3, 4, \\ldots$ — без кінця. Іноді додають $0$.","body":[["Уяви","Скільки б ти не нарахував, завжди можна додати ще одне яблуко — тому ряд не закінчується."],["Запис","Усі натуральні разом позначають $\\N$. Читається «ен натуральне»."],["Пастка","Половинки, від'ємні, дроби — не натуральні. $\\tfrac12$ яблука не порахуєш «одне, два»."]],"prereq":[],"aliases":["натуральні числа","натуральне число","натуральних чисел","натуральних"],"next":["c:variable","c:math115:induction"]},{"id":"c:table","level":0,"t":"Таблиця: рядки і стовпці","one":"Таблиця — це клітинки в рядках (уздовж) і стовпцях (згори вниз). Кожна клітинка — на перетині.","body":[["Уяви","Розклад уроків: зліва дні, зверху номери уроків. Клітинка «вівторок, 3-й урок» — це і є перетин."],["Правило","Читаємо рядок зліва направо, стовпець — згори вниз. Заголовок каже, що в цьому стовпці."],["Далі буде","Таблиця істинності — звичайна таблиця: у стовпцях зліва значення букв, справа — результат."]],"prereq":[],"aliases":["таблиця","таблиці","рядок","стовпець"],"next":["c:math115:truth-table"]},{"id":"c:power-two","level":0,"t":"Степінь двійки","one":"$2^n$ означає «два помножити на себе $n$ разів»: $2^3 = 2\\cdot2\\cdot2 = 8$.","body":[["Уяви","Аркуш згинаєш навпіл: 2 шари. Ще раз — 4. Ще — 8. Кожен згин подвоює: $2, 4, 8, 16, 32$."],["Правило","$2^1=2$, $2^2=4$, $2^3=8$, $2^4=16$, $2^5=32$. І окремо: $2^0 = 1$ — «жодного разу не подвоїли»."],["Пастка","$2^n$ — це НЕ $2\\cdot n$. $2^3 = 8$, а $2\\cdot3=6$."]],"prereq":[],"aliases":["степінь двійки","два в степені"],"check":{"q":"$2^4 = ?$","a":["16"]},"next":["c:math115:truth-table","c:math115:powerset"]},{"id":"c:subtraction","level":0,"t":"Забрати (відняти)","one":"Відняти — це забрати частину: було $7$, забрали $3$, лишилось $4$.","body":[["Уяви","У мішку 7 цукерок, з'їв 3. Рахуєш, що лишилось: $7-3=4$."],["Правило","Забирати можна лише те, що є. Якщо просять забрати цукерку, якої в мішку нема, — нічого не змінюється."],["Далі буде","Різниця множин $A\\setminus B$ — це саме «забрати з $A$ усе, що є в $B$»."]],"prereq":[],"aliases":["відняти","забрати","різниця чисел"],"next":["c:math115:difference"]},{"id":"c:sentence","level":0,"t":"Речення, яке щось стверджує","one":"Стверджувальне речення каже, як воно є: «Надворі дощ». Не питає і не наказує.","body":[["Уяви","Три фрази: «Надворі дощ», «Надворі дощ?», «Іди під дощ!». Лише перша про щось стверджує."],["Правило","Стверджує — можна погодитися або заперечити. Питання й наказ — не можна."],["Далі буде","У логіці такі речення звуть висловлюваннями і ставлять їм оцінку: правда чи неправда."]],"prereq":[],"aliases":["речення","стверджує","твердження"],"next":["c:true-false","c:math115:statement"]},{"id":"c:true-false","level":1,"t":"Правда чи неправда","one":"Про речення, яке щось стверджує, можна сказати одне з двох: правда або неправда. Третього нема.","body":[["Уяви","«Київ — столиця України» — правда. «$2+2=5$» — неправда. Обидва — нормальні речення, просто з різною оцінкою."],["Правило","Правду позначають $1$, неправду — $0$. Не «трохи правда» — рівно одне з двох."],["Пастка","Неправдиве речення — усе одно речення, яке щось стверджує. Просто його оцінка $0$."]],"prereq":["c:sentence"],"aliases":["правда","неправда","істина","хиба","істинне","хибне"],"check":{"q":"«$3 > 5$» — це правда ($1$) чи неправда ($0$)?","a":["0","неправда","хиба"]},"next":["c:and-or-not","c:if-then","c:math115:statement"]},{"id":"c:and-or-not","level":1,"t":"«і», «або», «не»","one":"Три слова, якими склеюють речення: «і» — обидва, «або» — хоч одне, «не» — навпаки.","body":[["Уяви","«Візьму зошит і ручку» — треба обидва. «Візьму зошит або ручку» — вистачить одного. «Не візьму зошит» — перевертає."],["Правило","«і»: правда, лише коли обидві частини правда. «або»: правда, коли хоч одна частина правда. «не»: правда стає неправдою і навпаки."],["Пастка","«або» у математиці не виключає «обидва»: «зошит або ручку» — взяти і те, й те теж підходить."]],"prereq":["c:true-false"],"aliases":["і, або, не","сполучник"],"next":["c:math115:atom","c:math115:connective","c:math115:negation-quantifier","c:math115:union-intersection"]},{"id":"c:if-then","level":1,"t":"«Якщо…, то…»","one":"«Якщо йде дощ, то я беру парасолю» — обіцянка: щоразу, коли перше, буде й друге.","body":[["Уяви","Обіцянку порушено лише в одному випадку: дощ іде, а парасолі нема. В усіх інших — обіцянка стоїть."],["Правило","Немає дощу — обіцянка не порушена, хоч би що з парасолею. Тому «якщо…то» неправдиве лише при «перше так, друге ні»."],["Пастка","«Якщо…, то…» не каже, що буде, коли перше НЕ сталося. Без дощу з парасолею — обіцянка ціла."]],"prereq":["c:true-false"],"aliases":["якщо…, то","якщо-то","обіцянка"],"next":["c:math115:implication"]},{"id":"c:variable","level":1,"t":"Буква замість числа","one":"Змінна — буква, на місце якої можна підставити різні числа: $x+1$ при $x=4$ дає $5$.","body":[["Уяви","Порожня клітинка в прикладі: $\\square + 1 = ?$. Букву $x$ пишуть замість клітинки."],["Правило","Підставив число — вираз став числом. Поки не підставив — це «формула для будь-якого»."],["Далі буде","Речення з буквою: «$x$ парне». Правда чи ні — залежить від того, що підставиш. Це предикат."]],"prereq":["c:natural-numbers"],"aliases":["змінна","змінні","буква замість числа"],"next":["c:math115:predicate"]},{"id":"c:all-some","level":1,"t":"«Усі» і «хоч один»","one":"«Усі яблука червоні» — перевіряєш кожне. «Хоч одне червоне» — вистачить знайти одне.","body":[["Уяви","Кошик із 5 яблук. «Усі червоні» руйнує одне зелене. «Хоч одне червоне» рятує одне червоне."],["Правило","«Усі» спростовується одним прикладом-винятком. «Хоч один» доводиться одним прикладом."],["Пастка","Заперечення «усі червоні» — не «усі не червоні», а «хоч одне не червоне»."]],"prereq":["c:count"],"aliases":["усі","кожен","хоч один","існує","для кожного"],"next":["c:math115:quantifier","c:math115:subset"]},{"id":"c:set-bag","level":1,"t":"Множина як мішок","one":"Мішок, у який поклали предмети. Важливо лише, ЩО всередині, — не порядок і не повтори.","body":[["Уяви","Мішок із монетою, ключем і ґудзиком. Потрусив — порядок змінився, а мішок той самий."],["Правило","Дві однакові монети в мішку рахуються як одна річ «монета». Мішок може бути й порожнім."],["Далі буде","У курсі мішок звуть множиною, речі — елементами, а «лежить у мішку» пишуть $\\in$."]],"prereq":["c:element","c:count"],"aliases":["мішок","мішку","мішка"],"next":["c:math115:set"]}],"deadlines":[{"id":"math101-syllabus-quiz","course":"MATH101","title":"REQUIRED: Syllabus and course-structure quiz (+2 бонуси)","kind":"quiz","start":"2026-09-03T15:00","end":"2026-09-06T23:59","tz":"Europe/Kyiv","status":"missed","priority":"normal","confidence":"exact","source":"Moodle 4198","notes":"Не пройдено. 1 спроба. Бонус втрачено.","url":null},{"id":"math101-extern-2","course":"MATH101","title":"Proficiency Exam (екстерн-тест), потік 2","kind":"exam","start":"2026-09-10T08:30","end":"2026-09-10T11:00","tz":"Europe/Kyiv","status":"done","priority":"normal","confidence":"exact","source":"Moodle 4198 / Slack","notes":"Здано 10.09 11:00, файл blahodarov_kyrylo_compressed.pdf. Самооцінка ≈34/100 → Full Track.","url":null},{"id":"cs101-test-1","course":"CS101","title":"Тест 1 — Історія обчислювальної техніки (25 питань, 60 хв, 1 спроба, 5 б)","kind":"quiz","start":"2026-09-07T09:00","end":"2026-09-13T23:59","tz":"Europe/Kyiv","status":"closed","priority":"high","confidence":"exact","source":"Moodle cmid 129856","notes":"Вікно закрилось 13.09 о 23:59.","url":"https://teaching.kse.org.ua/mod/quiz/view.php?id=129856"},{"id":"eng121-credit-docs","course":"ENG121","title":"Перезарахування англійської: заява (з е-підписом) + сертифікат TOEFL → Марія Зелінська","kind":"deadline","start":"2026-09-14T00:00","end":"2026-09-14T12:00","tz":"Europe/Kyiv","status":"open"," DP.addAttempt = function (course, task, given, ok, ms, ctx) {

/* data.js — індекси по вшитих пакетах (window.DATA формує build.py) */
DP.init = function () {
  DP.DATA = window.DATA || { build: {}, courses: {}, foundation: [], deadlines: [], calendar: { classes: [] } };

  for (const [cid, pk] of Object.entries(DP.DATA.courses)) {
    for (const c of pk.concepts || []) I.concepts.set(c.id, Object.assign({ level: 2, prereq: [], next: [], course: cid }, c));
    for (const t of pk.theory || []) I.theory.set(cid + "/t:" + t.id, Object.assign({ course: cid, key: cid + "/t:" + t.id }, t));
    for (const d of pk.drills || []) {

      (d.tasks || []).forEach((tk, i) => { const id = "d:" + d.id + ":" + i; I.tasks.set(cid + "/" + id, { course: cid, id, key: cid + "/" + id, task: tk, drill: dd, i }); });
    }
    for (const [k, v] of Object.entries(pk.expl || {})) I.expl.set(cid + "/" + k, v);
    Object.assign(I.pics, pk.pics || {});

  // зворотні ребра next[] (розгалуження Н4.а) — рахуємо і тут, щоб не залежати від збірки
  for (const c of I.concepts.values()) c.next = [];
  for (const c of I.concepts.values()) for (const p of c.prereq || []) { const q = I.concepts.get(p); if (q && !q.next.includes(c.id)) q.next.push(c.id); }

DP.lesson = (cid, lid) => DP.idx.theory.get(cid + "/t:" + lid) || null;
DP.drill = (cid, did) => DP.idx.drills.get(cid + "/d:" + did) || null;

DP.steps = function (cid, s) {

U.lnk = (s, href, cls, icon) => `<a class="lnk ${cls || ""}" href="${href}">${s}${icon || ""}</a>`;

U.step = (label, text, cls) => `<div class="step ${cls || ""}"><b>${label}</b><div>${text}</div></div>`;
U.blk = (label, text, cls) => `<div class="blk ${cls || ""}"><b>${label}</b><div>${text}</div></div>`;
U.inp = (attrs, cls) => `<input class="inp ${cls || ""}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ${attrs || ""}>`;

U.row = function (title, sub, meta, lead, cls, href) {
