/* sync.js — акаунт і синхронізація через Supabase. Без бібліотек: Auth (вхід через Google) і PostgREST через fetch.
   Конфіг вшиває build.py з supabase\config.local.json → window.SUPA = {url, anon}. Немає конфігу — режим «локально».
   У кожного свій акаунт: дані розділені на сервері (RLS за user_id) і на пристрої (свій слот localStorage, DP.slotKey). */
DP.sync = {
  AUTH_KEY: "doparu-auth", user: null, session: null, busy: false, lastSync: 0, timer: null, err: "",
  cfg() { return window.SUPA && window.SUPA.url && window.SUPA.anon ? window.SUPA : null; },
  status() {
    if (!navigator.onLine) return { cls: "off", label: "офлайн" };
    if (!this.cfg()) return { cls: "local", label: "локально" };
    if (!this.user) return { cls: "local", label: "гість" };
    if (this.err) return { cls: "off", label: "помилка синку" };
    return { cls: "", label: this.busy ? "синхронізую…" : "синхронізовано" };
  },
  /* ---- сесія ---- */
  load() {
    try { this.session = JSON.parse(localStorage.getItem(this.AUTH_KEY) || "null"); } catch (e) { this.session = null; }
    this.user = this.session && this.session.user || null; this.lastSync = +(localStorage.getItem(this.AUTH_KEY + "-last") || 0);
  },
  saveSession(s) { this.session = s; this.user = s && s.user || null; try { s ? localStorage.setItem(this.AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(this.AUTH_KEY); } catch (e) {} },
  /* дані користувача з самого токена — окремий запит не потрібен */
  userFromToken(tok) {
    const p = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    const m = p.user_metadata || {};
    return { id: p.sub, email: p.email || m.email || "", name: m.full_name || m.name || "", pic: m.avatar_url || m.picture || "" };
  },
  /* повернення від Google: #access_token=…&refresh_token=…&expires_in=… або #error=… */
  handleCallback() {
    const h = location.hash;
    if (!/access_token=|error=/.test(h)) return false;
    const q = {}; h.replace(/^#/, "").split("&").forEach(kv => { const [k, v] = kv.split("="); q[k] = decodeURIComponent((v || "").replace(/\+/g, " ")); });
    if (q.error || q.error_description) {
      history.replaceState(null, "", location.pathname + "#/me");
      setTimeout(() => DP.toast("Вхід не вдався: " + (q.error_description || q.error).slice(0, 90), 6000), 300);
      return true;
    }
    if (q.access_token) {
      const u = this.userFromToken(q.access_token);
      this.saveSession({ access_token: q.access_token, refresh_token: q.refresh_token, expires_at: Date.now() + (+q.expires_in || 3600) * 1000, user: u });
      const adopted = DP.adoptGuest();          // перший вхід: забираємо прогрес, зроблений до входу
      DP.load();                                 // далі працюємо у слоті цього акаунта
      history.replaceState(null, "", location.pathname + "#/me");
      setTimeout(() => {
        DP.toast("Вітаю, " + (u.name || u.email) + (adopted ? " — прогрес із цього пристрою перенесено в акаунт" : ""), adopted ? 6000 : 3500);
        this.saveProfile(); this.sync();
      }, 300);
      return true;
    }
    return false;
  },
  /* профіль: щоб у базі було видно, хто це, а не лише uuid */
  async saveProfile() {
    const u = this.user; if (!u) return;
    try { await this.upsert("profiles", [{ user_id: u.id, display_name: u.name || (u.email || "").split("@")[0], email: u.email || null, avatar_url: u.pic || null }]); }
    catch (e) { /* профіль не критичний — синк працює й без нього */ }
  },
  async refreshIfNeeded() {
    const s = this.session; if (!s) return false;
    if (s.expires_at - Date.now() > 60e3) return true;
    const cfg = this.cfg(); if (!cfg) return false;
    try {
      const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { apikey: cfg.anon, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) throw new Error("refresh " + r.status);
      const j = await r.json();
      this.saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: Object.assign(this.userFromToken(j.access_token), { id: j.user.id, email: j.user.email || "" }) });
      return true;
    } catch (e) { this.err = "сесія закінчилась — увійди ще раз"; this.saveSession(null); return false; }
  },
  /* вхід через Google: сторінка сама йде на Supabase, той — на Google і повертає токен у #hash */
  signInGoogle() {
    const cfg = this.cfg();
    if (!cfg) { DP.toast("Supabase ще не підключений — крок 02 у tasks\\02-supabase.md", 5000); return false; }
    const redirect = location.origin + location.pathname;
    location.href = `${cfg.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirect)}`;
    return true;
  },
  signOut() {
    const name = this.user && (this.user.name || this.user.email) || "";
    this.saveSession(null); this.err = "";
    DP.switchSlot();   // повертаємось у гостьовий слот: чужий прогрес не видно
    DP.toast(name ? "Вийшов із акаунта " + name + ". Прогрес лишився в акаунті — повернеться після входу" : "Вийшов", 5000);
  },
  /* ---- REST ---- */
  async rest(path, opts) {
    const cfg = this.cfg(); if (!cfg || !this.session) throw new Error("no session");
    if (!(await this.refreshIfNeeded())) throw new Error("no session");
    const h = Object.assign({ apikey: cfg.anon, Authorization: "Bearer " + this.session.access_token, "Content-Type": "application/json" }, (opts && opts.headers) || {});
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, Object.assign({}, opts, { headers: h }));
    if (!r.ok) throw new Error(`${path}: ${r.status} ${(await r.text()).slice(0, 120)}`);
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  upsert(table, rows) { if (!rows.length) return Promise.resolve(); return this.rest(table, { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) }); },
  /* ---- стан ↔ рядки ---- */
  toRemote(S) { // повний знімок локального стану у формі таблиць
    const uid = this.user.id; const iso = ms => new Date(ms || 0).toISOString();
    const kv = [];
    for (const [k, v] of Object.entries(S.progress)) kv.push({ user_id: uid, key: "progress:" + k, value: v, updated_at: iso(v.updatedAt) });
    for (const [k, v] of Object.entries(S.concepts)) kv.push({ user_id: uid, key: "concepts:" + k, value: v, updated_at: iso(v.updatedAt) });
    kv.push({ user_id: uid, key: "settings", value: S.settings, updated_at: iso(S.settings.updatedAt) });
    const attempts = S.attempts.map(a => ({ id: a.id, user_id: uid, ts: iso(a.ts), course: a.course, task: a.task, given: a.given, ok: !!a.ok, ms: Math.round(a.ms || 0) }));
    const errlog = S.errlog.map(e => ({ id: e.id, user_id: uid, ts: iso(e.ts), course: e.course, task: e.task, tag: e.tag || "", concept: e.concept || null, resolved: !!e.resolved, resolved_at: e.resolvedAt ? iso(e.resolvedAt) : null }));
    const a4 = Object.entries(S.a4).map(([k, v]) => ({ user_id: uid, test_id: k, lines: v.lines || [], updated_at: iso(v.updatedAt) }));
    const reminders = Object.entries(S.reminders).map(([k, v]) => ({ user_id: uid, deadline_id: k, state: v.v, updated_at: iso(v.updatedAt) }));
    return { kv, attempts, errlog, a4, reminders };
  },
  fromRemote(rows) { // рядки таблиць → стан у локальній формі (для DP.merge)
    const st = DP.blankState(); const ms = s => s ? new Date(s).getTime() : 0;
    for (const r of rows.kv || []) { const v = r.value || {}; if (r.key.startsWith("progress:")) st.progress[r.key.slice(9)] = Object.assign({ updatedAt: ms(r.updated_at) }, v); else if (r.key.startsWith("concepts:")) st.concepts[r.key.slice(9)] = Object.assign({ updatedAt: ms(r.updated_at) }, v); else if (r.key === "settings") st.settings = Object.assign({ updatedAt: ms(r.updated_at) }, v); }
    st.attempts = (rows.attempts || []).map(a => ({ id: a.id, ts: ms(a.ts), course: a.course, task: a.task, given: a.given || "", ok: !!a.ok, ms: a.ms || 0 }));
    st.errlog = (rows.errlog || []).map(e => ({ id: e.id, ts: ms(e.ts), course: e.course, task: e.task, tag: e.tag || "", concept: e.concept || "", resolved: !!e.resolved, resolvedAt: e.resolved_at ? ms(e.resolved_at) : undefined }));
    for (const r of rows.a4 || []) st.a4[r.test_id] = { lines: r.lines || [], updatedAt: ms(r.updated_at) };
    for (const r of rows.reminders || []) st.reminders[r.deadline_id] = { v: r.state, updatedAt: ms(r.updated_at) };
    return st;
  },
  /* ---- сам синк: тягнемо → зливаємо → штовхаємо ---- */
  async sync() {
    if (!this.cfg() || !this.user || this.busy || !navigator.onLine) return false;
    this.busy = true; this.err = ""; this.paint();
    try {
      const [kv, attempts, errlog, a4, reminders] = await Promise.all(["kv", "attempts", "errlog", "a4", "reminders"].map(t => this.rest(`${t}?select=*`)));
      const remote = this.fromRemote({ kv, attempts, errlog, a4, reminders });
      const before = JSON.stringify(DP.S);
      DP.S = Object.assign(DP.blankState(), DP.merge(DP.S, remote)); DP.S.queue = [];
      const changed = before !== JSON.stringify(DP.S);
      try { localStorage.setItem(DP.slotKey(), JSON.stringify(DP.S)); } catch (e) {}
      const R = this.toRemote(DP.S);
      await this.upsert("kv", R.kv); await this.upsert("attempts", R.attempts); await this.upsert("errlog", R.errlog); await this.upsert("a4", R.a4); await this.upsert("reminders", R.reminders);
      this.lastSync = Date.now(); try { localStorage.setItem(this.AUTH_KEY + "-last", String(this.lastSync)); } catch (e) {}
      if (changed) { DP.applySettings(); DP.render(); }
      return true;
    } catch (e) { this.err = String(e.message || e).slice(0, 120); console.warn("sync", e); return false; }
    finally { this.busy = false; this.paint(); }
  },
  onChange() { if (!this.cfg() || !this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 2500); },
  paint() { const el = DP.$(".sync"); if (!el) return; const s = this.status(); el.innerHTML = `<i class="${s.cls}"></i>${s.label}`; },
};
window.addEventListener("online", () => { DP.render && DP.render(); DP.sync.sync(); });
window.addEventListener("offline", () => DP.render && DP.render());

/* concepts.js — панель «Крок назад» з розгалуженням (DECISIONS: вимога А, Н4.а) */
DP.cchain = [];
DP.LEVELS = { 0: "рівень 0 · фундамент", 1: "рівень 1 · школа", 2: "рівень 2 · курс" };
DP.openConcept = function (id, replaceChain) {
  if (!DP.concept(id)) { DP.toast("Поняття «" + id + "» ще не написане — буде в частині 3"); return; }
  if (replaceChain) DP.cchain = [id]; else { const k = DP.cchain.indexOf(id); if (k >= 0) DP.cchain = DP.cchain.slice(0, k + 1); else DP.cchain.push(id); }
  DP.renderPanel();
};
DP.closeConcept = function () { DP.cchain = []; DP.$$(".dim,.panel").forEach(e => e.remove()); DP.refreshTerms(); };
DP.refreshTerms = function () { DP.$$(".term").forEach(t => { const st = DP.conceptState(t.dataset.c); t.classList.toggle("known", st === "known"); t.classList.toggle("unclear", st === "unclear"); }); };
DP.stateDot = id => { const st = DP.conceptState(id); return st === "known" ? U.dot("good") : st === "unclear" ? U.dot("warn") : U.dot("pen"); };
/* «новий» пишемо ЛИШЕ там, де поняття справді з'являється вперше в курсі —
   інакше воно на десятому уроці поспіль числилося новим (баг зі скріншота). */
DP.stateWord = function (id, cid, lid) {
  const st = DP.conceptState(id);
  if (st === "known") return "зрозумів";
  if (st === "unclear") return "не зрозумів";
  if (cid && lid) return DP.conceptFirst(cid, id) === lid ? "новий" : "повторення";
  return "новий";
};
DP.renderPanel = function () {
  DP.$$(".dim,.panel").forEach(e => e.remove());
  const id = DP.cchain[DP.cchain.length - 1]; const c = DP.concept(id); if (!c) return;
  const chain = DP.cchain.map((x, i) => { const cc = DP.concept(x); const t = cc ? DP.M(DP.lc(cc.t)) : DP.esc(x); return i === DP.cchain.length - 1 ? `<b>${t}</b>` : `<button type="button" data-chain="${i}">${t}</button><span>›</span>`; }).join("");
  const body = (c.body || []).map(([l, t]) => U.blk(DP.esc(l), DP.M(t), /пастк/i.test(l) ? "trap" : "")).join("");
  const pic = c.pic ? `<div class="venn">${c.pic}</div>` : (c.pics || []).map(k => DP.idx.pics[k] || "").join("");
  const pre = (c.prereq || []).map(p => { const q = DP.concept(p); return U.row(q ? DP.M(q.t) : p, "", DP.stateWord(p), DP.stateDot(p), "one", "#c=" + p); }).join("");
  const nxt = (c.next || []).slice(0, 5).map(p => { const q = DP.concept(p); return U.row(q ? DP.M(q.t) : p, "", DP.stateWord(p), DP.stateDot(p), "one", "#c=" + p); }).join("");
  // перевірка поняття: варіанти, якщо відповідь не набрати з клавіатури, і кнопка пояснення
  const ck = c.check;
  const ckBody = !ck ? "" : (ck.opts && ck.opts.length
    ? `<div class="btns opts" data-copts>${ck.opts.map(o => U.btn(DP.M(o), "q", `data-copt data-val="${DP.esc(o)}"`)).join("")}<span class="r" data-cres></span></div>`
    : `<div class="qa">${U.inp(`placeholder="відповідь" data-ccheck="${DP.esc(id)}"`)}<span class="r" data-cres></span></div>`);
  const ckWhy = ck ? (ck.why || c.one || "") : "";
  const check = !ck ? "" : `<div class="qcheck"><div class="q">Перевір: ${DP.M(ck.q)}</div>${ckBody}`
    + (ckWhy ? U.btns(U.btn("Пояснення", "n", "data-cwhy")) + `<div class="hidden" data-cwhybox>${U.blk("Чому", DP.M(ckWhy))}</div>` : "")
    + `</div>`;
  const html = `
    <div style="display:flex;gap:12px;align-items:flex-start"><div class="chain grow">${chain}</div><button type="button" class="ico" data-act="cclose" title="Закрити (Esc)">${U.I.x}</button></div>
    ${U.eyebrow("Крок назад · " + (DP.LEVELS[c.level] || ""))}${U.h2(DP.M(c.t))}
    ${U.scroll(`${U.p(DP.M(c.one || ""), "lead")}${U.SP}${body}${pic ? U.SP + pic : ""}${c.book ? U.SP + U.book(c.book) : ""}
      ${pre ? U.SP + U.eyebrow("Спирається на · " + (c.prereq.length > 1 ? "розвилка" : "один крок назад")) + U.rows(pre) : (c.level === 0 ? U.SP + U.small("Це фундамент — далі назад нічого немає. Якщо й це незрозуміло — натисни «Не зрозумів», і я поясню інакше.", "faint") : "")}
      ${nxt ? U.SP + U.eyebrow("На цьому будується") + U.rows(nxt) : ""}
      ${check ? U.SP + check : ""}`, "fade")}
    <div class="blocks2" style="padding-top:var(--cell)">${U.btn("Зрозумів", "g", 'data-act="cknown"', U.I.check)}${U.btn("Не зрозумів", "n", 'data-act="cunclear"')}</div>`;
  const dim = document.createElement("div"); dim.className = "dim"; dim.dataset.act = "cclose";
  const panel = document.createElement("div"); panel.className = "panel"; panel.innerHTML = html;
  const app = DP.$(".app"); app.appendChild(dim); app.appendChild(panel);
  const showWhy = open => { const box = DP.$("[data-cwhybox]", panel); const b = DP.$("[data-cwhy]", panel); if (!box) return; box.classList.toggle("hidden", !open); if (b) b.textContent = open ? "Сховати пояснення" : "Пояснення"; };
  const verdict = (given, ok) => {
    const r = DP.$("[data-cres]", panel); if (r) r.textContent = given ? (ok ? "✓" : "✗") : "";
    if (given && !ok) showWhy(true);            // помилився — пояснення відкривається саме
    if (given) { DP.addAttempt(c.course || "_", "c:" + id, given, ok, 0, "concept"); DP.save(); }
  };
  const wb = DP.$("[data-cwhy]", panel);
  if (wb) wb.addEventListener("click", () => showWhy(DP.$("[data-cwhybox]", panel).classList.contains("hidden")));
  const inp = DP.$("[data-ccheck]", panel);
  if (inp) inp.addEventListener("keydown", e => { if (e.key !== "Enter") return; const given = inp.value.trim(); const ok = given ? DP.grade(given, c.check.a) !== "no" : false; inp.classList.remove("ok", "err"); if (given) inp.classList.add(ok ? "ok" : "err"); verdict(given, ok); });
  DP.$$("[data-copt]", panel).forEach(btn => btn.addEventListener("click", () => {
    DP.$$("[data-copt]", panel).forEach(b2 => b2.classList.toggle("q", b2 !== btn));
    const given = btn.dataset.val; const ans = c.check.ans || (c.check.a || [])[0] || "";
    verdict(given, DP.norm(given) === DP.norm(ans));
  }));
};
DP.markConcept = function (v) {
  const id = DP.cchain[DP.cchain.length - 1]; if (!id) return; DP.setConcept(id, v);
  if (v === "unclear") { const c = DP.concept(id); DP.addErr(c.course || "_", "c:" + id, "поняття · " + DP.plain(c.t), id); DP.toast("Записав у журнал — перед парою покажу першим"); }
  if (v === "known") { const c = DP.concept(id); DP.resolveErr((c && c.course) || "_", "c:" + id); }
  if (DP.cchain.length > 1) { DP.cchain.pop(); DP.renderPanel(); } else DP.closeConcept();
  DP.refreshTerms();
};

/* find.js — пошук по всій платформі: уроки, навички, поняття, дедлайни.
   Відкривається кнопкою в планці, клавішею «/» або Ctrl+K. Правило 10: гортається лише список. */
DP.findOpen = false;
DP.findQ = "";
DP.findSel = 0;

/* нормалізація під український набір: регістр, апострофи, ё/й-подібні дрібниці */
DP.fnorm = s => String(s || "").toLowerCase()
  .replace(/[’`´ʼ]/g, "'").replace(/́/g, "")
  .replace(/ё/g, "е").replace(/\s+/g, " ").trim();

/* індекс пошуку будуємо один раз — 1000+ задач перебирати щоразу не треба */
DP.findIndex = function () {
  if (DP._find) return DP._find;
  const out = [];
  const add = (kind, title, sub, href, extra) => out.push({
    kind, title, sub, href,
    hay: DP.fnorm(DP.plain(title) + " " + (sub || "") + " " + (extra || ""))
  });
  for (const cid of DP.courses()) {
    const c = DP.course(cid); if (!c) continue;
    const short = c.short || cid;
    for (const s of DP.sessions(cid) || []) {
      if (s.status === "planned") continue;
      add("сесія", s.t || ("Тиждень " + s.w), short + " · тиждень " + (s.w || ""), `#/${cid}/${s.id}`);
    }
    for (const t of DP.idx.theory.values()) {
      if (t.course !== cid) continue;
      add("урок", t.t, short + " · тиждень " + (t.w || ""), `#/${cid}/t:${t.id}`, (t.learn || []).join(" "));
    }
    for (const d of DP.idx.drills.values()) {
      if (d.course !== cid) continue;
      add("навичка", d.t, `${short} · тиждень ${d.w || ""} · ${(d.tasks || []).length} задач`, `#/${cid}/d:${d.id}`, d.idea);
    }
  }
  for (const c of DP.idx.concepts.values())
    add("поняття", c.t, (DP.LEVELS[c.level] || "").replace(/·.*/, "").trim() || "поняття", "#c=" + c.id,
        (c.aliases || []).join(" ") + " " + (c.one || ""));
  for (const d of DP.DATA.deadlines || []) {
    const end = DP.parseDate(d.end);
    add("дедлайн", d.title, (d.course || "") + " · " + (end ? DP.fmtD(end) : "без дати"), "#/reminders", d.notes);
  }
  DP._find = out;
  return out;
};

DP.findHits = function (q) {
  const n = DP.fnorm(q);
  if (!n) return [];
  const words = n.split(" ").filter(Boolean);
  const res = [];
  for (const it of DP.findIndex()) {
    if (!words.every(w => it.hay.includes(w))) continue;
    // ранжування: збіг на початку назви важливіший за збіг десь усередині
    const t = DP.fnorm(DP.plain(it.title));
    const score = t.startsWith(words[0]) ? 0 : t.includes(n) ? 1 : 2;
    res.push([score, it]);
  }
  res.sort((a, b) => a[0] - b[0] || a[1].title.length - b[1].title.length);
  return res.slice(0, 40).map(x => x[1]);
};

DP.openFind = function () {
  DP.findOpen = true; DP.findSel = 0;
  DP.renderFind();
};
DP.closeFind = function () {
  DP.findOpen = false; DP.findQ = "";
  DP.$$(".dim.fdim,.find").forEach(e => e.remove());
};

DP.renderFind = function () {
  DP.$$(".dim.fdim,.find").forEach(e => e.remove());
  if (!DP.findOpen) return;
  const hits = DP.findHits(DP.findQ);
  if (DP.findSel >= hits.length) DP.findSel = Math.max(0, hits.length - 1);
  const rows = hits.map((h, i) => U.row(
    DP.M(h.title), h.sub, `<span class="kind">${h.kind}</span>`, U.dot(
      h.kind === "урок" ? "pen" : h.kind === "навичка" ? "good" : h.kind === "поняття" ? "warn" : ""),
    "one" + (i === DP.findSel ? " on" : ""), h.href)).join("");
  const body = !DP.findQ
    ? U.small("Почни писати: назва уроку, навички, поняття чи дедлайну. ↑ ↓ — вибір, Enter — відкрити, Esc — закрити.", "faint")
    : hits.length ? U.rows(rows) : U.small("Нічого не знайшлось. Спробуй одне слово замість кількох.", "faint");
  const html = `
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div class="grow">${U.eyebrow("Пошук по платформі")}</div>
      <button type="button" class="ico" data-act="fclose" title="Закрити (Esc)">${U.I.x}</button>
    </div>
    ${U.inp(`placeholder="урок, навичка, поняття…" data-find value="${DP.esc(DP.findQ)}"`)}
    ${U.SP}${U.scroll(body, "fade")}`;
  const dim = document.createElement("div"); dim.className = "dim fdim"; dim.dataset.act = "fclose";
  const box = document.createElement("div"); box.className = "find"; box.innerHTML = html;
  const app = DP.$(".app"); app.appendChild(dim); app.appendChild(box);
  DP.$$(".scroll", box).forEach(s => s.setAttribute("data-scroll", ""));
  // висоту картки підганяємо під цілу кількість клітинок — інакше список з'їжджає з сітки (правило 10)
  const cell = parseFloat(getComputedStyle(app).getPropertyValue("--cell")) || 24;
  const top = box.getBoundingClientRect().top - app.getBoundingClientRect().top;
  const avail = Math.floor((app.clientHeight - top - cell) / cell) * cell;
  if (avail > cell * 4) box.style.maxHeight = avail + "px";
  const inp = DP.$("[data-find]", box);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  inp.addEventListener("input", () => { DP.findQ = inp.value; DP.findSel = 0; DP.renderFind(); });
  inp.addEventListener("keydown", e => {
    const hs = DP.findHits(DP.findQ);
    if (e.key === "ArrowDown") { e.preventDefault(); DP.findSel = Math.min(DP.findSel + 1, hs.length - 1); DP.renderFind(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); DP.findSel = Math.max(DP.findSel - 1, 0); DP.renderFind(); }
    else if (e.key === "Enter") { e.preventDefault(); const h = hs[DP.findSel]; if (h) DP.findGo(h.href); }
  });
};

DP.findGo = function (href) {
  DP.closeFind();
  if (href.startsWith("#c=")) DP.openConcept(href.slice(3), true);
  else location.hash = href;
};

/* home.js — «Сьогодні»: яка пара далі, що зробити перед нею, скільки хвилин */
DP.views.home = function () {
  const cid = DP.activeCourse(); const c = DP.course(cid);
  if (!c) return U.top("") + U.wrap("c1", U.card(U.h1("Пакетів курсів немає") + U.ctx("Збірка порожня — перевір build.py"))) + U.nav("home");
  const s = DP.nextSession(cid); const today = DP.today();
  const nc = DP.nextClass(cid);
  let when = "";
  if (nc) { const d = nc.date; const dayTxt = nc.days === 0 ? "сьогодні" : nc.days === 1 ? "завтра" : DP.fmtLong(d); when = nc.cls.confirmed && nc.cls.start ? `пара ${dayTxt} о ${nc.cls.start}` : `пара — ${dayTxt}, <span class="faint">час уточнюється</span>`; }
  const center = [], right = [];
  if (s) {
    const R = DP.readiness(cid, s); const left = R.steps.filter(x => !x.done).reduce((a, x) => a + (x.min || 0), 0);
    const rows = R.steps.map(st => U.row(DP.M(st.title), DP.M(st.sub || ""), st.done ? (st.kind === "quiz" && st.score ? `${st.score.score} з ${st.score.n}` : "готово") : `${st.min} хв`, U.ck(st.done), "", st.go)).join("");
    const first = R.steps.find(x => !x.done);
    const head = R.pct >= 100
      ? `<div style="display:flex;gap:24px;align-items:flex-start"><div class="big-ok">${U.I.check}</div><div>${U.h1("Готовий до пари")}${U.ctx(`Усі ${R.total} кроків зроблено · ${when || "тиждень " + (s.w || s.week.n)}`)}</div></div>`
      : U.h1(DP.esc(DP.plain(s.t))) + U.ctx(`${DP.fmtLong(today)} · тиждень ${DP.currentWeek(cid)} · ${when ? when + " · " : ""}<b>${left ? "лишилось " + DP.plural(left, "хвилина", "хвилини", "хвилин") + " підготовки" : "усе зроблено"}</b>`);
    center.push(U.card(U.eyebrow("Сьогодні · " + c.short + " · тиждень " + (s.w || s.week.n)) + head + U.SP + U.scroll(U.rows(rows), "grid fade") + U.SP
      + U.btns(first ? U.abtn(first.kind === "lesson" ? "Продовжити: " + DP.esc(DP.plain(DP.lesson(cid, first.id).t)) : first.kind === "quiz" ? "До квізу" : "Розібрати пастку", first.go) : U.abtn("Повторити квіз", `#/${cid}/quiz/${s.id}`, "q"), U.abtn("Сесія повністю", `#/${cid}/${s.id}`, "q")), "fill"));
    center.push(U.card(U.eyebrow("Готовність до квізу тижня") + U.meter(R.pct) + U.small(R.pct >= 100 ? `<b class="good">${R.done} з ${R.total} — готовий</b> · наступна перевірка після пари` : `${R.done} з ${R.total} кроків зроблено · <b class="ink">ще ${DP.plural(R.total - R.done, "крок", "кроки", "кроків")} до «готовий»</b>`)));
  } else {
    center.push(U.card(U.eyebrow("Сьогодні") + U.h1("Поки нема підготовленої сесії") + U.ctx("Пакет " + DP.esc(c.title) + " ще без готових тижнів — дивись план у курсі.") + U.SP + U.btns(U.abtn("Відкрити курс", "#/" + cid)), "fill"));
  }
  // праворуч: горить · далі · повторюються
  const hot = DP.deadlines(10);
  const hotRows = hot.slice(0, 8).map(d => U.dlRow(d, false, true)).join("");
  right.push(U.card(U.eyerow(`<a href="#/reminders" style="text-decoration:none;color:inherit"><b class="${hot.some(d => d.diff >= 0 && d.diff < 2) ? "bad" : ""}">Горить</b> · ${hot.filter(d => d.diff >= 0).length}${hot.some(d => d.diff < 0) ? " · минуло " + hot.filter(d => d.diff < 0).length : ""}</a>`, `<a class="small" href="#/reminders">усі →</a>`) + (hot.length ? U.scroll(U.rows(hotRows), "fade") : U.small("Найближчі 10 днів чисті", "faint")), "fill"));
  const tests = DP.tests(cid).map(t => Object.assign({ start: DP.parseDate((t.dates || "").split("/")[0]) }, t)).filter(t => t.start && t.start >= today).sort((a, b) => a.start - b.start);
  if (tests[0]) { const t = tests[0]; right.push(U.card(U.eyebrow("Наступний тест") + U.h3(`${c.short} · Тест ${t.n} · ${DP.fmtRange(t.dates)}`) + U.small(`${t.points} балів · за ${DP.plural(DP.daysBetween(today, t.start), "день", "дні", "днів")}${c.grading.homework ? " · перед ним ДЗ" : ""}`))); }
  const rep = DP.openErrors(cid).filter(e => e.n >= 2).slice(0, 3);
  right.push(U.card(U.eyebrow("Повторюються") + (rep.length ? U.rows(rep.map(e => { const t = DP.task(cid, e.task); return U.row(t ? DP.M(t.task.q.length > 48 ? t.drill.t : t.task.q) : e.task, "", e.n + "×", U.dot("bad"), "one", t ? `#/${cid}/${e.task}?trap=1` : ""); }).join("")) : U.small("Повторюваних помилок немає", "faint"))));
  return U.top(cid) + U.wrap("c3", U.rail(cid, s && s.id) + U.col(center) + U.col(right)) + U.nav("home");
};

/* course.js — курс: тижні картками, бали */
DP.views.course = function (cid) {
  const c = DP.course(cid); if (!c) return DP.views.notfound("Курсу " + cid + " немає");
  const w = DP.currentWeek(cid); const tests = DP.tests(cid);
  const cards = (c.weeks || []).map(wk => {
    const s = (wk.sessions || [])[0]; const test = tests.find(t => t.week === wk.n);
    const st = test ? U.pill(`${test.points} б`, "bad") : wk.n === w ? U.pill("зараз", "pen") : s && s.status === "done" ? U.pill("було", "good") : s && (s.status === "ready" || s.status === "partial") ? U.pill(s.status === "ready" ? "можна вчити" : "частково", "pen") : U.pill("скоро");
    const title = (s && s.t) || (test ? `Тест ${test.n}` : (wk.concepts && wk.concepts[0]) || "—");
    const sub = wk.dates ? DP.fmtRange(wk.dates) + (wk.practicals && wk.practicals.length ? ` · ПР ${wk.practicals.map(p => p.n).join(", ")}` : "") : "";
    const R = s && (s.status === "ready" || s.status === "partial") ? DP.readiness(cid, s) : null;
    const inner = U.eyerow(`Т${wk.n}`, st) + U.h3(DP.esc(title)) + U.small(DP.esc(sub)) + (R ? U.meter(R.pct) : "");
    return s ? `<a class="card ${wk.n === w ? "now" : ""}" href="#/${cid}/${s.id}" style="text-decoration:none;color:inherit">${inner}</a>` : `<div class="card">${inner}</div>`;
  }).join("");
  const g = c.grading || {}; const parts = [];
  if (g.quizzes) parts.push([`${g.quizzes.total} · квізи`, `${g.quizzes.count} по ${g.quizzes.each}${g.quizzes.best ? " · рахуються " + g.quizzes.best : ""}`]);
  if (g.homework) parts.push([`${g.homework.count * g.homework.each} · ДЗ`, `${g.homework.count} по ${g.homework.each}`]);
  for (const t of tests) parts.push([`${t.points} · Тест ${t.n}`, DP.fmtRange(t.dates) || `тиждень ${t.week}`]);
  const score = U.card(U.eyebrow(`${g.max || 100} балів курсу · прохідний ${g.pass || 60}`) + `<div class="cards4">${parts.map(([v, t]) => `<div>${U.h3(v)}${U.small(t)}</div>`).join("")}</div>`);
  const pr = c.practice ? `${c.practice.day ? DP.DAYS_FULL[DP.DAY_KEYS.indexOf(c.practice.day)] : ""}${c.practice.start ? (c.practice.confirmed ? " " + c.practice.start : ", час уточнюється") : ""}${c.practice.ta ? " · " + DP.esc(c.practice.ta) : ""}` : "";
  const head = U.eyebrow(`Курс · ${c.short}${c.group ? " · група " + c.group : ""}`) + U.h1(DP.esc(c.title)) + U.ctx(`Тижнів: ${(c.weeks || []).length}${pr ? " · практика: " + pr : ""}${g.quizzes && g.quizzes.note ? " · квізи: " + DP.esc(g.quizzes.note) : ""}`);
  // курс-заглушка: показуємо чесний порожній стан замість голої сітки без карток
  const empty = !(c.weeks || []).length
    ? U.card(U.h3("Курс ще не наповнений") + U.small("Тижнів, уроків і тренажерів тут поки немає. Відкрий інший курс зверху або повернись на головну.") + U.SP + U.btns(U.abtn("На головну", "#/", "q")))
    : "";
  const bodyHTML = empty || `<div class="cards4">${cards}</div>${U.SP}${score}`;
  return U.top(cid) + U.wrap("c1", `<div class="col fill"><div>${head}</div>${U.scroll(bodyHTML)}</div>`) + U.nav("course");
};
DP.views.notfound = msg => U.top("") + U.wrap("c1", U.card(U.h1("Тут нічого немає") + U.ctx(DP.esc(msg || "")) + U.SP + U.btns(U.abtn("На головну", "#/")))) + U.nav("");

/* session.js — сесія: підготовка до пари */
DP.MOODLE = "https://moodle.kse.ua"; // лише посилання назовні; матеріали лежать у D:\KSE\moodle

    + (R.steps.length ? U.SP + U.scroll(U.rows(rows), "grid fade") + U.SP + U.btns(first ? U.abtn(first.kind === "lesson" ? "Продовжити: " + DP.esc(DP.plain(DP.lesson(cid, first.id).t)) : first.kind === "quiz" ? "До квізу" : "Розібрати пастку", first.go) : U.abtn("Повторити квіз", `#/${cid}/quiz/${s.id}`, "q"), DP.quizPool(cid, s).length ? U.abtn("Лише квіз", `#/${cid}/quiz/${s.id}`, "q") : "") : U.SP + U.small((wk.concepts || []).map(DP.esc).join(" · "), "faint")), "fill"));
  const mats = [];
  for (const l of wk.lectures || []) mats.push(U.row(DP.esc(DP.plain(l.t)), "", l.yt ? "YouTube" : "Moodle", `<span class="ico">${U.I.play}</span>`, "one", l.yt ? `https://www.youtube.com/watch?v=${l.yt}` : (l.cmid ? `${DP.MOODLE}/mod/url/view.php?id=${l.cmid}` : "")));

  if (mats.length) center.push(U.card(U.eyebrow("Матеріали з Moodle до цього тижня") + U.rows(mats.join(""))));
  const right = [];

  if (drills.length) right.push(U.card(U.eyebrow("Тренування · задачі з розбором") + U.scroll(U.rows(drills.map(d => { const n = d.tasks.length; const ok = d.tasks.filter((t, i) => { const p = DP.prog(cid + "/d:" + d.id + ":" + i); return p && p.ok; }).length; return U.row(DP.esc(DP.plain(d.t)), DP.esc(d.tag || ""), `${ok}/${n}`, U.dot(ok === n ? "good" : ok ? "pen" : ""), "", `#/${cid}/d:${d.id}`); }).join("")), "fade"), "fill"));
  const dls = (DP.DATA.deadlines || []).filter(d => d.course && d.course.toLowerCase() === cid && d.end && wk.dates && DP.parseDate(d.end) >= DP.parseDate(wk.dates.split("/")[0]) && DP.parseDate(d.end) <= new Date(DP.parseDate(wk.dates.split("/")[1]).getTime() + 864e5));
  if (dls.length) right.push(U.card(U.eyebrow("Дедлайни курсу цього тижня") + U.rows(dls.map(d => U.row(DP.esc(d.title), DP.fmtD(DP.parseDate(d.end)) + (d.notes ? " · " + DP.esc(d.notes) : ""), "", U.dot("warn"))).join(""))));

/* lesson.js — урок: проста мова + рамка «як у підручнику» (Н6.в); матеріал гортається, сторінка — ні */
DP.lessonConcepts = function (L) { // усі [[c:…]] в уроці
  const ids = new Set(); const scan = s => { String(s || "").replace(/\[\[([^\]|]+)/g, (m, id) => { ids.add(id.trim()); return m; }); };
  scan(L.idea); (L.rules || []).forEach(scan); scan(L.book); scan(L.more); scan(L.recap);
  for (const k of ["ex", "ex2", "ex3"]) (L[k] || []).forEach(r => (r || []).forEach(x => { if (typeof x === "string") scan(x); }));
  for (const p of L.prereq || []) ids.add(p);
  return Array.from(ids);
};
/* Один крок розминки — це масив:
     [мітка, текст]                      — звичайний крок
     [мітка, текст, [[дія, коментар], …]] — крок із мікророзбором: кожна дрібна дія окремо,
                                            праворуч від неї — коментар «чому саме так»
     ["@pic", "КЛЮЧ"]                     — таблиця або малюнок просто в ході розв'язання
     ["@tree", {…}]                       — дерево: дужки розходяться в гілки й зливаються назад
     ["@fan",  {…}]                       — «фонтанчик»: один доданок розлітається в обидві дужки */
DP.mid = 0;
DP.microHTML = function (rows) {
  if (!rows || !rows.length) return "";
  const k = "m" + (++DP.mid);
  const body = rows.map(([a, b], i) => `<div class="mrow"><i>${i + 1}</i><div class="mdo">${DP.M(a)}</div><div class="mwhy">${b ? DP.M(b) : ""}</div></div>`).join("");
  return `<button type="button" class="mbtn" data-micro="${k}">по діях</button><div class="micro hidden" data-microbox="${k}">${body}</div>`;
};
DP.treeHTML = function (t) {
  if (!t) return "";
  const br = (t.branches || []).map(b => `<div class="tbr"><div class="tcap">${DP.M(b.t || "")}</div>${(b.steps || []).map(x => `<div class="tstep">${DP.M(x)}</div>`).join("")}</div>`).join("");
  return `<figure class="pic tree">${t.title ? `<p class="ptitle">${DP.M(t.title)}</p>` : ""}`
    + (t.root ? `<div class="tnode troot">${DP.M(t.root)}</div>` : "")
    + `<div class="tsplit" style="--n:${(t.branches || []).length || 1}">${br}</div>`
    + (t.merge ? `<div class="tjoin"><div class="tnode tres">${DP.M(t.merge)}</div></div>` : "")
    + (t.note ? `<figcaption>${DP.M(t.note)}</figcaption>` : "") + `</figure>`;
};
DP.fanHTML = function (f) {
  if (!f) return "";
  const n = (f.parts || []).length || 2;
  const cells = (f.parts || []).map(x => `<div class="fpart">${DP.M(x)}</div>`).join("");
  const rays = (f.parts || []).map(() => `<div class="fray"><span>${DP.M(f.give || "")}</span></div>`).join("");
  return `<figure class="pic fan">${f.title ? `<p class="ptitle">${DP.M(f.title)}</p>` : ""}`
    + `<div class="ftop">${DP.M(f.t || "")}</div>`
    + `<div class="frays" style="--n:${n}">${rays}</div>`
    + `<div class="fparts" style="--n:${n}">${cells}</div>`
    + (f.res ? `<div class="fres">${DP.M(f.res)}</div>` : "")
    + (f.note ? `<figcaption>${DP.M(f.note)}</figcaption>` : "") + `</figure>`;
};
DP.exSteps = function (ex, fin) {
  if (!ex || !ex.length) return "";
  const [first, ...rest] = ex;
  // «Розминка. Чи істинне…» — слово вже стоїть у мітці ліворуч, у тексті воно зайве
  const headTxt = String(first[0] || "").replace(/^(Розминка|Пастка|Крок далі|Близнюк)\.\s*/i, "");
  const head = U.step("Розминка", DP.M(headTxt) + (first[1] ? " — " + DP.M(first[1]) : ""));
  const body = rest.filter(r => !String(r[0] || "").startsWith("@"));
  // мітки в колонці або ВСІ авторські, або ВСІ «Крок N» — мішанка виглядає як поламана
  const useOwn = body.every(r => DP.plain(r[0]).length <= 14);
  let n = 0;
  const steps = rest.map(row => {
    const l = row[0];
    if (l === "@pic") return `<div class="exfig">${DP.idx.pics[row[1]] || ""}</div>`;
    if (l === "@tree") return `<div class="exfig">${DP.treeHTML(row[1])}</div>`;
    if (l === "@fan") return `<div class="exfig">${DP.fanHTML(row[1])}</div>`;
    n++;
    const t = row[1], micro = DP.microHTML(row[2]);
    const cls = /пастк|увага|зверни/i.test(l) ? "trap" : "";
    if (useOwn) return U.step(DP.esc(DP.plain(l)), DP.M(t) + micro, cls);
    return U.step(`Крок ${n}`, `<b class="slab">${DP.M(l)}</b>` + (t ? " — " + DP.M(t) : "") + micro, cls);
  });
  return `<div class="steps">${head}${steps.join("")}${fin ? U.step("Відповідь", DP.M(fin), "fin") : ""}</div>`;
};
/* Повторення перед уроком: усе, на чому урок стоїть.
   Те, що зустрічається ВПЕРШЕ, розписуємо; що вже було — лише назва, суть за кнопкою «розбір». */
/* Повторення перед уроком — САМЕ коротко: рядок на поняття.
   Нове дістає суть у два рядки, старе — лише назву. Усе інше за кнопкою «розбір». */
DP.recapHTML = function (cid, lid, L) {
  const ids = DP.lessonConcepts(L).filter(id => DP.concept(id));
  if (!ids.length) return "";
  const nNew = ids.filter(id => DP.conceptFirst(cid, id) === lid).length;
  const rows = ids.map(id => {
    const c = DP.concept(id);
    const isNew = DP.conceptFirst(cid, id) === lid;
    const st = DP.conceptState(id);
    const tag = st === "known" ? '<span class="pill good">знаєш</span>'
      : st === "unclear" ? '<span class="pill warn">було важко</span>'
      : isNew ? '<span class="pill pen">вперше</span>' : "";
    const btn = `<button type="button" class="mbtn" data-conc="${DP.esc(id)}">розбір</button>`;
    const head = `<div class="rcph"><b>${DP.M(c.t)}</b>${tag}${btn}</div>`;
    return `<div class="rcp${isNew ? " first" : ""}">${head}`
      + (isNew ? `<div class="rcpb">${DP.M(c.one || "")}</div>` : "") + `</div>`;
  }).join("");
  const sub = (nNew ? DP.plural(nNew, "нове поняття", "нові поняття", "нових понять") : "усе вже було")
    + " · разом " + ids.length;
  return U.blkopen("recap", "Згадати перед уроком", sub, `<div class="rcps">${rows}</div>`, true) + U.SP;
};
DP.views.lesson = function (cid, lid) {
  const c = DP.course(cid); const L = DP.lesson(cid, lid); if (!c || !L) return DP.views.notfound("Уроку " + lid + " немає");
  const s = DP.sessions(cid).find(x => (x.lessons || []).includes(lid)) || null;
  const lessons = s ? DP.sessionLessons(cid, s) : [L]; const i = lessons.findIndex(x => x.id === lid);
  const next = lessons[i + 1]; const nextHref = next ? `#/${cid}/t:${next.id}` : s ? `#/${cid}/quiz/${s.id}` : `#/${cid}`;
  const p = DP.prog(cid + "/t:" + lid); const done = !!(p && p.done);
  const key = cid + "/t:" + lid;
  // ліва рейка — кроки сесії
  let rail = "";
  if (s) { const R = DP.readiness(cid, s); rail = `<div class="rail fill">${U.eyebrow("Сесія · " + DP.esc(DP.plain(s.t)))}${U.scroll(R.steps.map((st, k) => `<a class="wk ${st.kind === "lesson" && st.id === lid ? "on" : st.done ? "done" : ""}" href="${st.go}"><span>${k + 1} · ${DP.esc(DP.plain(st.title.replace(/^(Урок|Квіз|Пастка з журналу) · /, "")))}</span><i>${st.kind === "lesson" && st.id === lid ? "зараз" : st.done ? "✓" : ""}</i></a>`).join(""))}${U.small("Прогрес сесії")}${U.meter(R.pct)}</div>`; }
  else rail = U.rail(cid);
  // матеріал
  const pre = (L.prereq || []).map(id => { const cc = DP.concept(id); return cc ? DP.termHTML(id, DP.M(DP.lc(cc.t))) : ""; }).filter(Boolean);
  const rules = (L.rules || []).map((r, k) => U.step(String(k + 1), DP.M(r))).join("");

DP.lessonCheck = function () {

/* drill.js — тренування: підказка → розбір по кроках → «поясни інакше» → простіше / складніше / ще така сама.
   Рівні складності задачі: 0 легка · 1 звичайна · 2 складніша · 3 олімпіадна. Кнопки «Простіше» і «Складніше»

DP.stepPair = function (l, x, cls) { // мітка коротка → у колонку; довга → у текст кроку
  const plain = DP.plain(l);
  if (plain.length > 12) return U.step("крок", DP.M(l) + (x ? " — " : "") + DP.M(x), cls);
  // мітка-формула ($|E|=\tfrac{nk}{2}$) у ВЕЛИКИХ моношириних літерах читалась як «|E|=NK/2» —
  // набираємо її математикою й лишаємо в нижньому регістрі
  if (/^\s*\$[^$]+\$\s*$/.test(l)) {

    const tall = /\\[td]?frac|\\binom|\\sqrt|\\sum_|\\bigcup_|\\bigcap_/.test(l);
    return U.step(DP.M(l), DP.M(x), ((cls || "") + " f" + (tall ? " tall" : "")).trim());

DP.solHTML = function (t, upto, noFin) { // sol[[label,text]] + fin → кроки; upto: скільки кроків показати

/* сусідні задачі за складністю всередині навички */
DP.nearTask = function (d, idx, dir) {

  if (!cand.length) return -1;
  cand.sort((a, b) => dir < 0 ? (b.lvl - a.lvl || a.i - b.i) : (a.lvl - b.lvl || a.i - b.i));

DP.sameTask = function (d, idx) { // інша задача того самого рівня
  const cur = DP.lvl(d.tasks[idx]);

  if (!cand.length) return -1;

DP.firstOfLvl = function (d, n) { return d.tasks.findIndex(t => DP.lvl(t) === n); };

DP.sessionOf = function (cid, did) { const s = DP.sessions(cid).find(x => (x.drills || []).includes(did)); return s ? `#/${cid}/${s.id}` : `#/${cid}`; };

/* quiz.js — «готовий до квізу»: 5 задач за 5 хвилин без підказок + «ще п'ять» з того ж банку (Н7.в) */
DP.Q = null;
DP.quizPoolUpTo = function (cid, s) { // банк «теми тижнів 1–N»: усі сесії з матеріалом до цього тижня включно
  const w = s.w || s.week.n; const out = []; const seen = new Set();
  for (const x of DP.sessions(cid)) {
    if ((x.w || x.week.n) > w) continue;
    if (!["ready", "partial", "done"].includes(x.status)) continue;
    for (const t of DP.quizPool(cid, x)) if (!seen.has(t.key)) { seen.add(t.key); out.push(t); }
  }
  return out;
};
DP.quizPick = function (cid, s, n, exclude, mix) {
  const pool = (mix ? DP.quizPoolUpTo(cid, s) : DP.quizPool(cid, s)).filter(t => !exclude.has(t.key));
  const wrong = [], fresh = [], rest = [];
  for (const t of pool) { const p = DP.prog(t.key); const open = DP.S.errlog.some(e => !e.resolved && e.course === cid && e.task === t.id); if (open) wrong.push(t); else if (!p || !p.tries) fresh.push(t); else rest.push(t); }
  // Не більше двох задач з однієї навички, поки є з чого вибирати: інакше квіз
  // із п'яти питань перетворюється на «те саме спрощення чотири рази».
  const order = [...DP.shuffle(wrong), ...DP.shuffle(fresh), ...DP.shuffle(rest)];
  const pick = [], cnt = {};
  for (const lim of [2, 99]) {
    for (const t of order) {
      if (pick.length >= n) break;
      if (pick.includes(t)) continue;
      const d = t.drill.id;
      if ((cnt[d] || 0) >= lim) continue;
      pick.push(t); cnt[d] = (cnt[d] || 0) + 1;
    }
    if (pick.length >= n) break;
  }

};
DP.quizStart = function (cid, sid, more, mix) {
  const s = DP.session(cid, sid); const exclude = new Set(more && DP.Q ? DP.Q.used : []);
  if (more && DP.Q && DP.Q.mix) mix = true;
  const n = mix ? Math.max((s.quiz && s.quiz.n) || 5, 8) : ((s.quiz && s.quiz.n) || 5);
  let tasks = DP.quizPick(cid, s, n, exclude, mix);
  if (tasks.length < n && more) { tasks = DP.quizPick(cid, s, n, new Set(), mix); }
  DP.Q = { cid, sid, mix: !!mix, tasks, i: 0, ans: [], started: DP.now(), seconds: DP.quizBudget(tasks), state: "run", used: [...exclude, ...tasks.map(t => t.key)], review: 0 };

};
/* Хвилина на задачу — це неправда: розкласти речення на формулу і довести індукцією
   коштують по-різному. Рахуємо бюджет за складністю кожної задачі. */
DP.QSEC = { 0: 45, 1: 75, 2: 120, 3: 180 };
DP.taskSec = t => DP.QSEC[(t && t.task && t.task.difficulty) || 0] || 75;
DP.quizBudget = tasks => tasks.reduce((a, t) => a + DP.taskSec(t), 0);
DP.quizLeft = () => DP.Q ? Math.max(0, DP.Q.seconds - (DP.now() - DP.Q.started) / 1000) : 0;
DP.quizTick = function () {
  clearInterval(DP._qt); DP._qt = setInterval(() => {
    if (!DP.Q || DP.Q.state !== "run") { clearInterval(DP._qt); return; }
    const left = DP.quizLeft(); DP.$$("[data-timer]").forEach(el => { el.textContent = DP.fmtMMSS(left); el.classList.toggle("hot", left < 60); });
    const m = DP.$("[data-tmeter] i"); if (m) m.style.width = (100 - left * 100 / DP.Q.seconds) + "%";
    if (left <= 0) DP.quizFinish(true);

};
DP.quizAnswer = function (skip) {
  const Q = DP.Q; if (!Q || Q.state !== "run") return; const t = Q.tasks[Q.i]; const inp = DP.$("[data-qans]"); const v = skip ? "" : (inp ? inp.value.trim() : "");
  if (!skip && !v) { inp && inp.focus(); return; }
  const g = v ? DP.grade(v, t.task.a) : "no"; const ok = g !== "no"; const ms = DP.now() - (Q.tstart || Q.started);
  Q.ans.push({ key: t.key, given: v, ok, ms, skip: !!skip });
  DP.addAttempt(Q.cid, t.id, v || "(пропущено)", ok, ms, "quiz");
  const cur = DP.prog(t.key) || {}; DP.setProg(t.key, { tries: (cur.tries || 0) + 1, ok: ok || !!cur.ok, given: v, last: DP.now() });
  if (ok) DP.resolveErr(Q.cid, t.id); else { DP.addErr(Q.cid, t.id, t.drill.t, (t.task.concepts || [])[0]); DP.save(); }
  Q.i++; Q.tstart = DP.now();

DP.quizFinish = function (timeout) {
  const Q = DP.Q; if (!Q) return; clearInterval(DP._qt);
  while (Q.ans.length < Q.tasks.length) { const t = Q.tasks[Q.ans.length]; Q.ans.push({ key: t.key, given: "", ok: false, ms: 0, skip: true, timeout: true }); DP.addAttempt(Q.cid, t.id, "(час вийшов)", false, 0, "quiz"); DP.addErr(Q.cid, t.id, t.drill.t); }

  }).join("");
  const att = DP.S.attempts; const last7 = att.filter(a => DP.now() - a.ts < 7 * 864e5); const okr = last7.length ? Math.round(last7.filter(a => a.ok).length * 100 / last7.length) : 0;
  const center = U.card(U.eyebrow(`Журнал помилок · відкрито ${open.length}`) + U.h1(open.length ? "Пастки перед парою" : "Журнал чистий") + U.ctx(open.length ? `Перед парою покажу до трьох найсвіжіших. Правильна відповідь у режимі пастки знімає рядок.` : "Помилок, які ще не виправлені, немає.") + U.SP + (open.length ? U.scroll(U.rows(rows), "grid fade") : ""), "fill");
  const right = [
    U.card(U.eyebrow("За 7 днів") + `<div class="blocks2">${`<div>${U.h3(String(last7.length))}${U.small("відповідей")}</div><div>${U.h3(okr + " %")}${U.small("правильних")}</div>`}</div>`),
    U.card(U.eyebrow("Усього") + U.rows(U.row("Помилок записано", "", String(all), U.dot(""), "one"), U.row("Виправлено", "", String(resolved), U.dot("good"), "one"), U.row("Відповідей за весь час", "", String(att.length), U.dot("pen"), "one"))),
    U.card(U.eyebrow("Поняття") + U.rows(U.row("Зрозумів", "", String(Object.values(DP.S.concepts).filter(c => c.v === "known").length), U.dot("good"), "one"), U.row("Не зрозумів", "", String(Object.values(DP.S.concepts).filter(c => c.v === "unclear").length), U.dot("warn"), "one"))),
  ];

/* висота робочої області має бути кратна клітинці — інакше все, що притиснуте донизу, з'їжджає з сітки */
DP.snap = function () {

  const cell = parseFloat(getComputedStyle(app).getPropertyValue("--cell")) || 24;
  wrap.style.paddingBottom = ""; const cs = getComputedStyle(wrap);
  const inner = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

/* Клітинка має лежати ПІД буквами: зсуваємо фон так, щоб лінія проходила по базовій

DP.gridAlign = function () {
  const app = DP.$(".app"); if (!app) return;
  const cell = parseFloat(getComputedStyle(app).getPropertyValue("--cell")) || 24;
  DP.$$(".scroll.grid", app).forEach(sc => {
    const host = sc.querySelector(".p,.step div,.fr .f,.rcpb"); if (!host) return;
    const probe = document.createElement("span");
    probe.style.cssText = "display:inline-block;width:0;height:0;overflow:hidden;vertical-align:baseline";
    host.insertBefore(probe, host.firstChild);
    const base = probe.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
