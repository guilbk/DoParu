ть ланцюжка рівностей будують ланцюжок ОЦІНОК. Одна ланка — чиста алгебра, друга — припущення [[c:math115:induction|індукції]]. Склеїв дві ланки, отримав потрібне.","rules":["Схема: ліва частина при $k+1$ $\\le$ проміжна оцінка $\\le$ права частина при $k+1$","Одна з ланок обов'язково використовує припущення — інакше це не індукція","Множити нерівність можна лише на невід'ємне число; саме для цього в умові пишуть обмеження","Доданок вигляду $kx^2$ завжди можна відкинути, бо він невід'ємний — нерівність від цього лише слабшає","Якщо в умові написано «для всіх $n\\ge 4$» — база при $n=4$, і це не формальність"],"pics":["INEQ"],"ex":[["ПР 4, A5. Довести, що $n^3<3^n$ для всіх $n\\ge 4$",""],["База, $n=4$","$4^3=64$, а $3^4=81$. Справді $64<81$"],["Чому не з $n=1$","при $n=3$ маємо $27$ і $27$ — строгої нерівності немає, тому в умові й стоїть $n\\ge 4$"],["Припущення","нехай $k^3<3^k$ при $k\\ge 4$"],["Перша ланка, чиста алгебра","$(k+1)^3\\le 3k^3$, бо $\\left(1+\\frac{1}{k}\\right)^3\\le\\left(\\frac54\\right)^3\\approx 1{,}95<3$"],["Друга ланка, припущення","$3k^3<3\\cdot 3^k=3^{k+1}$"],["Склеюємо ланцюжок","$(k+1)^3\\le 3k^3<3^{k+1}$"]],"exFin":"Доведено для всіх $n\\ge 4$","ex2":[["ПР 4, A7, нерівність Бернуллі. Довести, що $(1+x)^n\\ge 1+nx$ при $x\\ge -1$",""],["База, $n=1$","$1+x\\ge 1+x$ — рівність, отже виконується"],["Припущення","$(1+x)^k\\ge 1+kx$"],["Множимо обидві частини на $(1+x)$","це можна, бо з $x\\ge -1$ маємо $1+x\\ge 0$ і знак не змінюється"],["Отримуємо","$(1+x)^{k+1}\\ge(1+kx)(1+x)=1+(k+1)x+kx^2$"],["Останній доданок невід'ємний","$kx^2\\ge 0$, тому його можна відкинути"],["Залишається","$(1+x)^{k+1}\\ge 1+(k+1)x$"]],"ex2Fin":"Доведено","ex3":[["ПР 4, A6. Довести, що $\\frac{1}{\\sqrt1}+\\frac{1}{\\sqrt2}+\\dots+\\frac{1}{\\sqrt n}\\ge\\sqrt n$",""],["База, $n=1$","ліворуч $1$, праворуч $1$. Рівність — годиться"],["Припущення","нехай сума $S_k\\ge\\sqrt k$"],["Перехід","$S_{k+1}=S_k+\\frac{1}{\\sqrt{k+1}}\\ge\\sqrt k+\\frac{1}{\\sqrt{k+1}}$"],["Мета","показати, що це $\\ge\\sqrt{k+1}$"],["Домножимо потрібну нерівність на $\\sqrt{k+1}$","$\\sqrt{k(k+1)}+1\\ge k+1$, тобто $\\sqrt{k(k+1)}\\ge k$"],["Підносимо до квадрата","$k(k+1)\\ge k^2$ — очевидно істинно"]],"ex3Fin":"Доведено","more":"Загальний рецепт для нерівностей: випиши, що маєш після додавання доданка, випиши, що хочеш отримати, і зведи [[c:math115:difference|різницю]] між ними до чогось очевидного — квадрата, добутку додатних чисел або відомої нерівності. У задачі A6 саме так і вийшло: усе звелося до $k(k+1)\\ge k^2$.","check":[{"q":"$n^3<3^n$: чому дорівнює $3^4$?","a":["81"]},{"q":"Чому в Бернуллі потрібна умова $x\\ge -1$? Щоб при множенні не змінився ... (одне слово)","a":["знак","знак нерівності"]},{"q":"Який доданок відкидають у переході Бернуллі? Запиши вираз","a":["kx^2","kx²","k*x^2","kx*x"]}],"learn":["$(k+1)^3\\le 3k^3<3\\cdot 3^k=3^{k+1}$","Бернуллі: $(1+x)^n\\ge 1+nx$ при $x\\ge -1$","База для $n^3<3^n$ — при $n=4$: $64<81$"],"ref":["Що саме оцінювати в першій ланці — видно з бажаного вигляду","Умова $x\\ge -1$ потрібна рівно для одного кроку"],"kids":true},{"id":"p11","w":2,"s":"s2","min":4,"t":"Індукція: подільність","pr":"ПР 4 · A8–A10 · B1, B5 · ДЗ 4","idea":"П'ять задач ПР 4 — на подільність, і всі вони робляться одним прийомом: винести множник так, щоб у дужках опинився рівно вираз із припущення, а те, що лишилось поза дужкою, показати кратним окремо. Розклади нижче варто просто вивчити — вони закривають усю тему.","rules":["Схема: вираз при $k+1$ дорівнює $q\\cdot(\\,$вираз при $k\\,)$ плюс залишок, і залишок теж кратний","$5^{k+1}-1=5(5^k-1)+4$, і $4$ ділиться на $4$","$11^{k+1}-6=11(11^k-6)+60$, і $60$ ділиться на $5$","$6\\cdot 7^{k+1}-2\\cdot 3^{k+1}=7\\left(6\\cdot 7^k-2\\cdot 3^k\\right)+8\\cdot 3^k$, і $8\\cdot 3^k$ ділиться на $4$","$3^{k+1}+7^{k+1}-2=3\\left(3^k+7^k-2\\right)+4\\left(7^k+1\\right)$, а $7^k+1$ парне, тому хвіст кратний $8$","$k^{n+1}-1=k(k^n-1)+(k-1)$, і хвіст кратний $k-1$","Множник $q$ підбирають так: це основа степеня, яка росте найшвидше"],"pics":["DIVTRICK"],"ex":[["ПР 4, A10. Довести, що $6\\cdot 7^n-2\\cdot 3^n$ ділиться на $4$",""],["База, $n=1$","$6\\cdot 7-2\\cdot 3=42-6=36$, а $36=4\\cdot 9$"],["Припущення","нехай $6\\cdot 7^k-2\\cdot 3^k$ ділиться на $4$"],["Перехід. Виносимо сімку","$6\\cdot 7^{k+1}-2\\cdot 3^{k+1}=7\\cdot 6\\cdot 7^{k}-3\\cdot 2\\cdot 3^{k}$"],["Додаємо і віднімаємо $7\\cdot 2\\cdot 3^k$","$7\\left(6\\cdot 7^k-2\\cdot 3^k\\right)+7\\cdot 2\\cdot 3^k-3\\cdot 2\\cdot 3^k$"],["Рахуємо хвіст","$14\\cdot 3^k-6\\cdot 3^k=8\\cdot 3^k$"],["Дивимось на обидва доданки","перший кратний $4$ за припущенням, другий — бо $8$ ділиться на $4$"]],"exFin":"Доведено","ex2":[["ПР 4, B5. Довести, що $3^n+7^n-2$ ділиться на $8$",""],["База, $n=1$","$3+7-2=8$"],["Перехід. Виносимо трійку","$3^{k+1}+7^{k+1}-2=3\\cdot 3^k+7\\cdot 7^k-2$"],["Підганяємо під припущення","$3\\left(3^k+7^k-2\\right)=3\\cdot 3^k+3\\cdot 7^k-6$"],["Різниця між тим, що треба, і тим, що вийшло","$(7\\cdot 7^k-2)-(3\\cdot 7^k-6)=4\\cdot 7^k+4$"],["Отже","$3^{k+1}+7^{k+1}-2=3\\left(3^k+7^k-2\\right)+4\\left(7^k+1\\right)$"],["Чому хвіст кратний восьми","$7^k$ непарне, тому $7^k+1$ парне; четвірка на парне дає число, кратне $8$"]],"ex2Fin":"Доведено","ex3":[["ПР 4, B1. Довести, що $k^n-1$ ділиться на $k-1$ для будь-яких $n,k\\in\\mathbb{N}$, $k>1$",""],["База, $n=1$","$k^1-1=k-1$, ділиться на себе"],["Припущення","нехай $k^m-1$ ділиться на $k-1$"],["Перехід","$k^{m+1}-1=k\\cdot k^m-1$"],["Додаємо і віднімаємо $k$","$k\\cdot k^m-k+k-1=k(k^m-1)+(k-1)$"],["Обидва доданки кратні $k-1$","перший за припущенням, другий очевидно"],["Це узагальнення A8","при $k=5$ виходить рівно $5^n-1\\ \\vdots\\ 4$"]],"ex3Fin":"Доведено для всіх $k>1$","more":"Прийом «додати і відняти» виглядає як фокус, але вибір того, що саме додавати, не випадковий. Ти дивишся, який вираз має стояти в дужках (він у припущенні), множиш його на потрібний коефіцієнт, порівнюєш із тим, що маєш, і [[c:math115:difference|різниця]] — це і є хвіст. Тобто спершу пишеш $q$ помножене на вираз із припущення, а потім рахуєш, чого бракує.","check":[{"q":"$5^{k+1}-1=5(5^k-1)+?$","a":["4"]},{"q":"$11^{k+1}-6=11(11^k-6)+?$","a":["60"]},{"q":"ПР 4, ДЗ 4: перевір базу для «$7^n-1$ ділиться на $6$» при $n=1$","a":["6"]}],"learn":["$5^{k+1}-1=5(5^k-1)+4$","$11^{k+1}-6=11(11^k-6)+60$","$6\\cdot 7^{k+1}-2\\cdot 3^{k+1}=7\\left(6\\cdot 7^k-2\\cdot 3^k\\right)+8\\cdot 3^k$","$3^{k+1}+7^{k+1}-2=3\\left(3^k+7^k-2\\right)+4\\left(7^k+1\\right)$"],"ref":["Що саме додавати й віднімати — видно з бажаного вигляду дужки","Умова $x\\ge -1$ у Бернуллі потрібна рівно для одного кроку — множення без зміни знака"],"kids":true},{"id":"p11b","w":2,"s":"s2","min":4,"t":"Складніші індукції: частина C і домашнє","pr":"ПР 4 · C1 · ДЗ 1–3","idea":"Останні задачі ПР 4 виглядають страшніше за решту, але метод той самий. Змінюється лише алгебра всередині переходу: замість суми може бути добуток, замість степеня — факторіал. Скелет доведення не міняється жодного разу.","rules":["Для добутку перехід виглядає так: $P(k+1)=P(k)\\cdot a_{k+1}$","Факторіал зручно розкривати як $(k+1)!=(k+1)\\cdot k!$","Корисно знати: $\\sum k^3=\\left(\\frac{n(n+1)}{2}\\right)^2$ — квадрат суми перших $n$ чисел","$\\sum k\\cdot k!=(n+1)!-1$","$\\prod\\left(1+\\frac1k\\right)=n+1$ — добуток телескопує","$\\sum\\frac{k}{2^k}=2-\\frac{n+2}{2^n}$"],"pics":["SUMSTEP"],"ex":[["ПР 4, ДЗ 3. Довести, що $\\sum\\limits_{k=1}^{n}k\\cdot k!=(n+1)!-1$",""],["База, $n=1$","ліворуч $1\\cdot 1!=1$; праворуч $2!-1=1$"],["Припущення","нехай $\\sum\\limits_{k=1}^{m}k\\cdot k!=(m+1)!-1$"],["Перехід. Додаємо наступний доданок","$(m+1)!-1+(m+1)\\cdot(m+1)!$"],["Виносимо $(m+1)!$","$(m+1)!\\left(1+(m+1)\\right)-1$"],["У дужці $m+2$","$(m+1)!\\cdot(m+2)-1$"],["А це і є факторіал наступного числа","$(m+2)!-1$"]],"exFin":"Доведено","ex2":[["ПР 4, ДЗ 1. Довести, що $\\prod\\limits_{k=1}^{n}\\left(1+\\frac1k\\right)=n+1$",""],["База, $n=1$","ліворуч $1+\\frac11=2$; праворуч $1+1=2$"],["Припущення","нехай добуток перших $m$ множників дорівнює $m+1$"],["Перехід. Домножуємо на наступний множник","$(m+1)\\left(1+\\frac{1}{m+1}\\right)$"],["Зводимо дужку","$1+\\frac{1}{m+1}=\\frac{m+2}{m+1}$"],["Множимо","$(m+1)\\cdot\\frac{m+2}{m+1}=m+2$"],["Це і є $n+1$ при $n=m+1$"," "]],"ex2Fin":"Доведено","ex3":[["ПР 4, C1. Довести, що $\\frac{1}{2}+\\frac{2}{2^2}+\\dots+\\frac{n}{2^n}=2-\\frac{n+2}{2^n}$",""],["База, $n=1$","ліворуч $\\frac12$; праворуч $2-\\frac{3}{2}=\\frac12$"],["Припущення","нехай сума перших $m$ доданків дорівнює $2-\\frac{m+2}{2^m}$"],["Перехід. Додаємо наступний доданок","$2-\\frac{m+2}{2^m}+\\frac{m+1}{2^{m+1}}$"],["Зводимо до знаменника $2^{m+1}$","$2-\\frac{2(m+2)}{2^{m+1}}+\\frac{m+1}{2^{m+1}}$"],["Складаємо чисельники","$2-\\frac{2m+4-m-1}{2^{m+1}}=2-\\frac{m+3}{2^{m+1}}$"],["А це і є формула при $n=m+1$","бо $m+3=(m+1)+2$"]],"ex3Fin":"Доведено","more":"У задачах ПР 4 B3 і B4 просять спочатку САМОМУ здогадатися, чому дорівнює сума, і лише потім довести. Спосіб один: порахувати перші три-чотири значення й придивитись. Сума перших $n$ непарних чисел дає $1, 4, 9, 16$ — це очевидно $n^2$. Сума $\\sum\\frac{1}{k(k+1)}$ дає $\\frac12,\\frac23,\\frac34$ — тобто $\\frac{n}{n+1}$. Гіпотезу знайдено, далі звичайна [[c:math115:induction|індукція]].","check":[{"q":"Сума перших $n$ непарних чисел дорівнює ... Запиши формулою через $n$","a":["n^2","n²","n*n","n²"]},{"q":"$\\sum\\limits_{k=1}^{n}\\frac{1}{k(k+1)}$ дорівнює ... Запиши дробом через $n$","a":["n/(n+1)","n/(n+1)","n:(n+1)"]},{"q":"$\\sum\\limits_{k=1}^{n}k\\cdot k!$ при $n=3$ дорівнює ...","a":["23"]}],"learn":["$\\sum k^3=\\left(\\frac{n(n+1)}{2}\\right)^2$","$\\sum k\\cdot k!=(n+1)!-1$","$\\prod\\left(1+\\frac1k\\right)=n+1$","$\\sum\\frac{k}{2^k}=2-\\frac{n+2}{2^n}$"],"ref":["Гіпотезу в задачах B3 і B4 знаходять підрахунком перших значень"],"kids":true},{"id":"w3a","w":3,"s":"s3","min":4,"t":"Множина як мішок","pr":"ПР 6 · A1–A3","kids":true,"prereq":["c:set-bag","c:element"],"idea":"Множина — це просто мішок із речами. Уся сила слова в одному: мішок визначається лише тим, ЩО всередині. Ні порядок, ні повтори не рахуються. І мішок може лежати в іншому мішку — звідси всі пастки тижня.","rules":["[[c:math115:set|Множину]] задають переліком у фігурних дужках $\\{1;3;5\\}$ або умовою $\\{x\\mid E(x)\\}$ — «усі $x$, для яких виконується $E(x)$», наприклад $E(x)$ — «$x$ парне»","$x\\in A$ — «$x$ лежить у мішку $A$» ([[c:math115:membership|належність]]); $x\\notin A$ — не лежить. Зліва завжди ОДИН предмет","Порядок і повтори не важливі: $\\{1;2;3\\}=\\{3;1;2\\}=\\{1;1;2;3\\}$ — це та сама множина","[[c:math115:cardinality|Кількість елементів]] $|A|$ рахує різні речі: $|\\{1;1;2\\}|=2$","[[c:math115:empty-set|Порожня множина]] $\\varnothing=\\{\\}$ — мішок без речей, $|\\varnothing|=0$. А $\\{\\varnothing\\}$ — мішок з одною річчю (порожнім мішком), $|\\{\\varnothing\\}|=1$","Мішок може бути елементом: у $A=\\{1;2;\\{1\\}\\}$ три елементи — $1$, $2$ і мішок $\\{1\\}$"],"book":"Множина — сукупність об'єктів, що розглядається як єдине ціле; ці об'єкти називають елементами множини. Множина повністю визначається своїми елементами: $A=B$ тоді й лише тоді, коли вони складаються з тих самих елементів. Множину без елементів називають порожньою і позначають $\\varnothing$.","pics":["EMPTY_BAGS"],"ex":[["Розминка. $A=\\{1;2;\\{1\\}\\}$. Скільки елементів і які?",""],["Рахуємо речі в мішку","число $1$, число $2$, мішок $\\{1\\}$"],["Разом","$|A|=3$. Мішок $\\{1\\}$ — одна річ, хай усередині й лежить число"]],"exFin":"$|A|=3$: елементи $1$, $2$, $\\{1\\}$","ex2":[["ПР 6, A2 (а, б, е). $A=\\{1;2;\\{1\\}\\}$. Чи вірно: $1\\in A$; $\\{1\\}\\in A$; $\\{2\\}\\in A$?",""],["$1\\in A$","число $1$ лежить у мішку — так"],["$\\{1\\}\\in A$","мішок $\\{1\\}$ лежить у $A$ як окрема річ — так"],["$\\{2\\}\\in A$","у $A$ лежить число $2$, а не мішок $\\{2\\}$ — ні"]],"ex2Fin":"так; так; ні","ex3":[["Пастка. Чи рівні $\\{1;2;2;3\\}$ і $\\{3;2;1\\}$?",""],["Дивимось лише на те, ЩО всередині","в обох — числа $1$, $2$, $3$"],["Повтори й порядок","не рахуються"],["Отже","рівні"]],"ex3Fin":"так, $\\{1;2;2;3\\}=\\{3;2;1\\}$","more":"Умова замість переліку рятує, коли елементів нескінченно багато: $\\{x\\in\\N\\mid x>10\\}$ — усі натуральні, більші за $10$. Переліком таке не запишеш.","learn":["$x\\in A$ — предмет у мішку; $x\\notin A$ — нема","Порядок і повтори не важливі: $\\{1;2\\}=\\{2;1;1\\}$","$|\\varnothing|=0$, а $|\\{\\varnothing\\}|=1$"],"ref":["Фігурні дужки — це і є мішок. Скільько пар дужок навколо — стільько мішків один в одному."],"check":[{"q":"$A=\\{3;5;\\{3\\}\\}$. Скільки елементів у $A$?","a":["3","три"]},{"q":"Чи $\\{3\\}\\in\\{3;5;\\{3\\}\\}$? (так / ні)","a":["так"]},{"q":"$|\\{\\varnothing\\}| = ?$","a":["1"]}]},{"id":"w3b","w":3,"s":"s3","min":5,"t":"Підмножина і включення","pr":"ПР 6 · A2–A5","kids":true,"prereq":["c:math115:membership","c:all-some"],"idea":"Дві коробки. Якщо все, що лежить у маленькій, знайдеться й у великій, — маленька є частиною великої. Це і є підмножина. Найдорожча помилка тижня — переплутати «річ лежить у мішку» ($\\in$) і «мішок уміщається в мішок» ($\\subseteq$).","rules":["$A\\subseteq B$ ([[c:math115:subset|підмножина]]): кожен елемент $A$ лежить і в $B$. Перевіряємо ВСІ елементи лівої множини по черзі","$\\subseteq$ ставлять лише між двома множинами. $\\in$ — між предметом і множиною. Питай: «що стоїть зліва — річ чи мішок?»","$\\varnothing\\subseteq A$ для будь-якої $A$ — перевіряти нічого, тож умова виконана. І $A\\subseteq A$ завжди","[[c:math115:set-equality|Рівність]]: $A=B$ тоді й лише тоді, коли $A\\subseteq B$ і $B\\subseteq A$ — два включення, не одне","$\\{\\varnothing\\}\\subseteq\\{\\varnothing\\}$ — так (будь-яка множина є підмножиною самої себе); $\\{\\varnothing\\}\\subseteq\\varnothing$ — ні (у правому мішку нічого нема, а лівий не порожній)","Усіх підмножин у множині з $n$ елементів — $2^n$ ([[c:math115:powerset|булеан]]): кожен елемент або береш, або ні"],"book":"[[c:math115:set|Множина]] $A$ називається підмножиною множини $B$ ($A\\subseteq B$), якщо кожний елемент $A$ є [[c:math115:membership|елементом]] $B$: $A\\subseteq B\\Leftrightarrow\\forall x\\,(x\\in A\\to x\\in B)$. Множини рівні, $A=B$, тоді й лише тоді, коли $A\\subseteq B$ і $B\\subseteq A$. Множину всіх підмножин $A$ називають булеаном $\\mathcal{P}(A)$; якщо $|A|=n$, то $|\\mathcal{P}(A)|=2^n$.","pics":["SET_VS_ELEM","SUBSETS_8"],"ex":[["Розминка. $A=\\{2;4\\}$, $B=\\{1;2;3;4\\}$. Чи $A\\subseteq B$?",""],["Беремо кожен елемент $A$ по черзі","$2$ — є в $B$? Так"],["Далі","$4$ — є в $B$? Так. Інших елементів у $A$ нема"],["Перевір навпаки","$B\\subseteq A$? Ні: $1\\in B$, але $1\\notin A$"]],"exFin":"$A\\subseteq B$ — так; $B\\subseteq A$ — ні","ex2":[["ПР 6, A4. Чи вірно: (а) $\\varnothing\\subseteq\\varnothing$; (б) $\\varnothing\\subseteq\\{\\varnothing\\}$; (в) $\\{\\varnothing\\}\\subseteq\\varnothing$; (г) $\\{\\varnothing\\}\\subseteq\\{\\{\\varnothing\\}\\}$?",""],["(а)","[[c:math115:empty-set|порожня]] — підмножина будь-якої, зокрема себе: так"],["(б)","те саме правило: так"],["(в)","лівий мішок має річ ($\\varnothing$), правий — порожній, речі нема де знайтися: ні"],["(г)","лівий містить $\\varnothing$; правий містить лише $\\{\\varnothing\\}$ — це інша річ, не $\\varnothing$: ні"]],"ex2Fin":"(а) так; (б) так; (в) ні; (г) ні","ex3":[["Пастка. $A=\\{a;b;\\{c;d\\}\\}$. Чи $\\{c;d\\}\\subseteq A$? А $\\{c;d\\}\\in A$?",""],["$\\subseteq$ — перевіряємо елементи лівої","$c\\in A$? У $A$ лежать $a$, $b$ і мішок $\\{c;d\\}$ — окремого $c$ нема. Ні"],["$\\in$ — чи лежить мішок $\\{c;d\\}$ у $A$ як річ","так, він там третій"]],"ex3Fin":"$\\{c;d\\}\\subseteq A$ — ні; $\\{c;d\\}\\in A$ — так","more":"Одноелементна $B$ така, що одночасно $A\\in B$ і $A\\subseteq B$ (ПР 6, A5)? $B=\\{A\\}$: тоді $A\\in B$ автоматично. Щоб ще й $A\\subseteq B$, кожен елемент $A$ має бути елементом $B$, тобто дорівнювати $A$. Виходить $A=\\{A\\}$ або $A=\\varnothing$. Беремо $A=\\varnothing$, $B=\\{\\varnothing\\}$: $\\varnothing\\in B$ і $\\varnothing\\subseteq B$ — обидва вірні. Існує.","learn":["$A\\subseteq B\\Leftrightarrow\\forall x\\,(x\\in A\\to x\\in B)$","$\\varnothing\\subseteq A$ і $A\\subseteq A$ — завжди","$A=B\\Leftrightarrow A\\subseteq B\\wedge B\\subseteq A$","$|\\mathcal{P}(A)|=2^{|A|}$"],"ref":["Чому $\\varnothing\\subseteq A$: означення каже «для кожного $x\\in\\varnothing$…» — таких $x$ нема, тож порушити умову нічим. Це те саме «порожньо істинне», що й імплікація з хибною лівою частиною."],"check":[{"q":"Чи $\\varnothing\\subseteq\\{1;2\\}$? (так / ні)","a":["так"]},{"q":"Скільки підмножин у $\\{a;b\\}$?","a":["4","чотири"]},{"q":"Чи $\\{1\\}\\subseteq\\{1;\\{1\\}\\}$? (так / ні)","a":["так"]}]},{"id":"w3c","w":3,"s":"s3","min":5,"t":"Операції ∪ ∩ \\ △ і діаграми Венна","pr":"ПР 6 · A1, A6–A8, B","kids":true,"prereq":["c:math115:set","c:and-or-not"],"idea":"Чотири дії з мішками. Зсипати разом — об'єднання. Лишити лише спільне — перетин. Забрати з одного те, що є в другому — різниця. Лишити лише «зайве» з обох — симетрична різниця. Замість зубріння властивостей — малюнок із двома колами: заштрихував ліву і праву частини рівності, збіглися — рівність правильна.","rules":["[[c:math115:union-intersection|Об'єднання]] $A\\cup B$ — усе, що є хоч в одному ($x\\in A\\vee x\\in B$). Перетин $A\\cap B$ — лише спільне ($x\\in A\\wedge x\\in B$)","[[c:math115:difference|Різниця]] $A\\setminus B$ — з $A$ викинули все, що є в $B$ ($x\\in A\\wedge x\\notin B$). Не симетрична: $A\\setminus B\\ne B\\setminus A$","[[c:math115:symmetric-difference|Симетрична різниця]] $A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)=(A\\cup B)\\setminus(A\\cap B)$ — «або-або» для множин","Доповнення $\\overline{A}=U\\setminus A$ — усе поза $A$ у межах універсальної множини $U$","З $\\varnothing$: $A\\cup\\varnothing=A$, $A\\cap\\varnothing=\\varnothing$, $A\\setminus\\varnothing=A$, $\\varnothing\\setminus A=\\varnothing$, $A\\setminus A=\\varnothing$, $A\\triangle A=\\varnothing$","Закони де Моргана: $\\overline{A\\cup B}=\\overline A\\cap\\overline B$, $\\overline{A\\cap B}=\\overline A\\cup\\overline B$; і $A\\setminus B=A\\cap\\overline B$","[[c:math115:venn|Діаграма Венна]]: два кола — 4 області, три — 8. Рівність перевіряють, штрихуючи обидві частини окремо","Через $\\triangle$: $A\\cup B=(A\\triangle B)\\triangle(A\\cap B)$; $A\\setminus B=A\\triangle(A\\cap B)$; $A\\cap B=(A\\triangle B)\\triangle(A\\cup B)$"],"book":"$A\\cup B=\\{x\\mid x\\in A\\vee x\\in B\\}$ — об'єднання; $A\\cap B=\\{x\\mid x\\in A\\wedge x\\in B\\}$ — перетин; $A\\setminus B=\\{x\\mid x\\in A\\wedge x\\notin B\\}$ — різниця; $A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)$ — симетрична різниця; $\\overline A=U\\setminus A$ — доповнення до універсальної [[c:math115:set|множини]] $U$.","pics":["VENN_OPS","VENN_COMPL"],"ex":[["Розминка. $S=\\{1;3;5;7;9\\}$, $T=\\{1;2;3;4;5\\}$ (ПР 6, A1). Знайти $S\\cap T$, $S\\cup T$, $S\\setminus T$, $T\\setminus S$, $S\\triangle T$",""],["Спільне","$S\\cap T=\\{1;3;5\\}$"],["Усе разом, без повторів","$S\\cup T=\\{1;2;3;4;5;7;9\\}$"],["З $S$ викидаємо те, що є в $T$","$S\\setminus T=\\{7;9\\}$; навпаки $T\\setminus S=\\{2;4\\}$"],["Зайве з обох боків","$S\\triangle T=\\{7;9\\}\\cup\\{2;4\\}=\\{2;4;7;9\\}$"]],"exFin":"$\\{1;3;5\\}$; $\\{1;2;3;4;5;7;9\\}$; $\\{7;9\\}$; $\\{2;4\\}$; $\\{2;4;7;9\\}$","ex2":[["ПР 6, A6. Чому рівні: (а) $\\varnothing\\cap\\{\\varnothing\\}$; (б) $\\{\\varnothing\\}\\cap\\{\\varnothing\\}$; (в) $\\{\\varnothing\\}\\cup\\varnothing$; (д) $\\{\\varnothing;\\{\\varnothing\\}\\}\\setminus\\{\\varnothing\\}$?",""],["(а) перетин із порожньою","спільного нема — $\\varnothing$"],["(б) перетин множини з собою","вона сама — $\\{\\varnothing\\}$"],["(в) об'єднання з порожньою","нічого не додає — $\\{\\varnothing\\}$"],["(д) з мішка $\\{\\varnothing;\\{\\varnothing\\}\\}$ викидаємо річ $\\varnothing$","лишається $\\{\\{\\varnothing\\}\\}$"]],"ex2Fin":"(а) $\\varnothing$; (б) $\\{\\varnothing\\}$; (в) $\\{\\varnothing\\}$; (д) $\\{\\{\\varnothing\\}\\}$","ex3":[["ПР 6, A8. Перевірити діаграмою: $(A\\cup B)\\setminus C=(A\\setminus C)\\cup(B\\setminus C)$",""],["Ліва частина","штрихуємо обидва кола $A$ і $B$, потім стираємо все, що в колі $C$"],["Права частина","штрихуємо $A$ без $C$, окремо $B$ без $C$, накладаємо"],["Порівнюємо","області збіглися — рівність правильна для будь-яких $A$, $B$, $C$"]],"ex3Fin":"рівність правильна","more":"Виразити $\\cup$ через $\\triangle$ і $\\cap$ (ПР 6, B1а): $A\\triangle B$ — це все крім спільної частини, а $A\\cap B$ — саме спільна частина, і вони не перетинаються. Тому $A\\cup B=(A\\triangle B)\\triangle(A\\cap B)$ — «або-або» двох областей, що не перетинаються, дає їхнє об'єднання. Так само $A\\setminus B=A\\triangle(A\\cap B)$.","learn":["$A\\setminus B=A\\cap\\overline B$","$A\\triangle B=(A\\cup B)\\setminus(A\\cap B)$","$\\overline{A\\cup B}=\\overline A\\cap\\overline B$ — де Морган","$|A\\cup B|=|A|+|B|-|A\\cap B|$"],"given":["$A\\cup B$, $A\\cap B$, $A\\setminus B$, $A\\triangle B$","$\\overline A=U\\setminus A$"],"ref":["Кожна операція над множинами — це зв'язка над висловлюваннями «$x\\in A$», «$x\\in B$»: $\\cup$ це $\\vee$, $\\cap$ це $\\wedge$, $\\setminus$ це $\\wedge\\neg$, $\\triangle$ це $\\oplus$. Тому й закони ті самі, що в логіці."],"check":[{"q":"$\\{1;2;3\\}\\cap\\{2;3;4\\} = ?$","a":["{2;3}"]},{"q":"$\\{1;2;3\\}\\setminus\\{2;3;4\\} = ?$","a":["{1}"]},{"q":"$\\{1;2;3\\}\\triangle\\{2;3;4\\} = ?$","a":["{1;4}"]}]}],"drills":[{"id":"t1","w":1,"s":"s1","t":"Розкласти речення на формулу","tag":"ПР 1 · A1","how":["Знайди ГОЛОВНУ зв'язку — ту, що ділить речення надвоє","Виділи атоми: найдрібніші шматки, які вже не діляться","Розбери кожну половину окремо, ставлячи дужки","«але», «проте», «а» — це $\\wedge$; «тоді й тільки тоді» — це $\\leftrightarrow$"],"trap":"Головна зв'язка не обов'язково перша або найчастіша. У «якщо A і B, то C або D» головна — імплікація.","tasks":[{"q":"«Якщо на Марсі існує ж
