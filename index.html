<style>/* DoParu · styles v0.1 · правила з DESIGN-RULES.md: клітинка = ритм; правило 10 — сторінка не гортається */
html,body{height:100%;margin:0;overflow:hidden;background:#F2F5F8}
.app{--cell:24px;--c2:calc(var(--cell)*2);--c3:calc(var(--cell)*3);--c4:calc(var(--cell)*4);
 --paper:#F2F5F8;--raised:#FFFFFF;--sunken:#E8EDF3;--grid:rgba(29,63,168,.13);--rule:#C4463C;
 --ink:#131F35;--ink-soft:#47596F;--ink-faint:#74869B;
 --pen:#1D3FA8;--pen-soft:#E3EAF9;--pen-line:#B9C8EC;--on-pen:#FFFFFF;
 --good:#12694A;--good-soft:#DDEFE6;--good-line:#9CCFB8;
 --warn:#8E5A0B;--warn-soft:#F8ECD6;--warn-line:#E0BF87;
 --bad:#AC2F26;--bad-soft:#FAE2DF;--bad-line:#E7AEA7;
 --line:#C9D5E1;--line-soft:#DEE6EE;--dim:rgba(13,19,28,.28);
 --shadow:0 1px 0 rgba(21,34,58,.06),0 6px 18px -12px rgba(21,34,58,.35);
 --f-disp:"Unbounded",system-ui,sans-serif;
 --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
 --f-math:"Cambria Math","STIX Two Math","Times New Roman",serif;
 font-family:var(--f-body);font-size:17px;line-height:var(--cell);color:var(--ink);background:var(--paper);
 position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.app.dark{--paper:#0D131C;--raised:#131B26;--sunken:#0A1017;--grid:rgba(131,167,255,.11);--rule:#8A3F37;
 --ink:#E9EFF7;--ink-soft:#A3B4C8;--ink-faint:#7286A0;
 --pen:#83A7FF;--pen-soft:#182240;--pen-line:#2C3C68;--on-pen:#0B1220;
 --good:#4DC792;--good-soft:#0F2620;--good-line:#1F5341;
 --warn:#D8A144;--warn-soft:#261F12;--warn-line:#54421F;
 --bad:#EE7A6C;--bad-soft:#2A1513;--bad-line:#5A2C26;
 --line:#222E3D;--line-soft:#1A2432;--dim:rgba(0,0,0,.45);
 --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -14px rgba(0,0,0,.9)}
.app.big{--cell:26px;font-size:19px}
.app.big .small,.app.big .eyebrow,.app.big .row .t em,.app.big .row .m{font-size:15px}
.app *{box-sizing:border-box;margin:0}
.app sup{font-size:.7em;line-height:0;vertical-align:baseline;position:relative;top:-.45em}
.app a{color:var(--pen)} .app a:hover{color:var(--ink)}
.app button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.app input{font:inherit;color:var(--ink);background:var(--raised);border:0;outline:0}
.hidden{display:none!important}
/* верхня планка */
.top{height:var(--c2);flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--raised);box-shadow:inset 0 -1px 0 var(--line-soft);position:relative;z-index:2}
.top .mark,.top .small{line-height:var(--c2)}
.mark{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:var(--cell);color:var(--pen);letter-spacing:-.02em;white-space:nowrap;text-decoration:none}
.mark em{font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-left:12px}
.chips{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden}
.chip{height:var(--cell);padding:0 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:var(--cell);font-weight:600;color:var(--ink-soft);background:var(--paper);white-space:nowrap;text-decoration:none;display:inline-block}
.chip.on{background:var(--pen);color:var(--on-pen);box-shadow:none}
.chip.add{color:var(--ink-faint);background:transparent;box-shadow:none;outline:1px dashed var(--line);outline-offset:-1px}

.col{display:flex;flex-direction:column;gap:var(--cell);min-width:0;min-height:0}

.app .fill{flex:1;min-height:0;display:flex;flex-direction:column}

.app .inp{height:var(--cell);padding:0 8px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:15px;line-height:var(--cell);min-width:120px;width:240px;max-width:100%}

.app .inp.err{box-shadow:inset 0 0 0 1px var(--bad-line);background:var(--bad-soft);color:var(--bad)}
.qa{display:flex;gap:0 12px;align-items:flex-start;flex-wrap:wrap}

.qa .r{width:var(--cell);height:var(--cell);flex:none;font-family:var(--f-mono);font-size:14px;line-height:var(--cell);text-align:center}
.tabs{display:flex;gap:24px;height:var(--c2);box-shadow:inset 0 -2px 0 var(--line-soft)}
.tab{height:var(--c2);line-height:var(--c2);font-weight:600;color:var(--ink-soft);white-space:nowrap}
.tab.on{color:var(--pen);box-shadow:inset 0 -2px 0 var(--pen)}
/* картинки з уроків (перенесені з тренажера) */
.pic{padding:0;margin:0 0 var(--cell)}
.pic .nline{display:block;width:100%;max-width:min(470px,100%);margin:0 auto;height:auto;color:var(--ink-soft)}
.pic figcaption{font-size:14px;color:var(--ink-soft);text-align:center;line-height:var(--cell)}

.pic th{background:var(--sunken);font-weight:700;font-size:13px;color:var(--ink-soft)}
.pic td.t{color:var(--good);font-weight:700} .pic td.f{color:var(--bad);font-weight:700}

.pic .ptitle{text-align:center;font-weight:700;font-size:14px;line-height:var(--cell);color:var(--ink);margin:0}

.nline .ax{stroke:currentColor;stroke-width:1.2;opacity:.45} .nline .axf{fill:currentColor;opacity:.45} .nline .tick{stroke:currentColor;stroke-width:1.2;opacity:.5}
.nline .band{stroke:var(--pen);stroke-width:4.5} .nline .dot{stroke:var(--pen);stroke-width:2.5;margin:0;width:auto;height:auto;border-radius:0;display:inline;background:none} .nline .dot.open{fill:var(--raised)} .nline .dot.fill{fill:var(--pen)}
.nline .pt{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--f-body)} .nline .pl{fill:var(--pen);font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nline .pn{fill:currentColor;font-size:12px;opacity:.7;font-family:var(--f-mono)} .nline .pv{fill:var(--pen);font-size:11px;font-weight:600;font-family:var(--f-body)}
.nline .arw{stroke:var(--pen);stroke-width:1.6;fill:none;opacity:.8} .nline .arwf{fill:var(--pen);opacity:.8} .nline .axf2{fill:var(--pen)}
.nline .pgood{fill:var(--good);font-size:11.5px;font-weight:700;font-family:var(--f-body)} .nline .pbad{fill:var(--bad);font-size:11.5px;font-weight:700;font-family:var(--f-body)}
.nline .pmono{fill:var(--ink);font-size:12.5px;font-family:var(--f-mono)} .nline .pmonohi{fill:var(--pen);font-size:12.5px;font-weight:700;font-family:var(--f-mono)}
.nline .pval{fill:var(--ink);font-size:12.5px;font-weight:700;font-family:var(--f-mono)} .nline .pvalb{fill:var(--pen);font-size:12.5px;font-weight:700;font-family:var(--f-mono)}

.focus{display:flex;flex-direction:column;flex:1;min-height:0;padding-top:var(--c3)}

/* телефон */
@media (max-width:760px){

 .wrap.c3,.wrap.c2,.wrap.half,.wrap.c1{grid-template-columns:none}
 .app .rail{display:none} .col{min-height:auto} .app .fill{flex:none} .chip:not(.on){display:none}
 .scroll{flex:none;overflow:visible;margin:0;padding:0;min-height:auto} .scroll.fade::after{display:none}
 .fill > .scroll{margin-bottom:0}
 .card{padding:var(--cell) 16px}
 .blocks,.cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .step,.blk{grid-template-columns:72px 1fr}
 .panel{top:auto;left:0;right:0;bottom:0;height:78%;width:auto;border-radius:12px 12px 0 0;box-shadow:0 -1px 0 var(--line),0 -12px 30px rgba(0,0,0,.18);padding:var(--cell) 16px}
 .panel .scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -16px 0;padding:0 16px}
 .nav{position:absolute;left:0;right:0;bottom:0;height:var(--c3);background:var(--raised);box-shadow:inset 0 1px 0 var(--line-soft);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:calc(var(--cell)/2) 0 0;z-index:2}
 .nav a{display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:var(--cell);color:var(--ink-faint);text-decoration:none}
 .nav a.on{color:var(--pen)}
 .nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
 .app .inp{width:100%}
 .toast{bottom:var(--c4);max-width:92%;white-space:normal;height:auto;padding:0 12px}
}
@media print{.app{position:static;overflow:visible}}
</style>

eeks":16,"tz":"Europe/Kyiv"},"title_short":"Дискретка"},"theory":[{"id":"w1a","w":1,"s":"s1","min":3,"t":"Висловлювання й атоми","pr":"ПР 1 · A1","idea":"Курс починається з однієї перевірки: чи можна про це речення сказати «правда» або «неправда». Можна — це [[c:math115:statement|висловлювання]]. Далі його розбирають на найдрібніші шматки, які вже не діляться, — [[c:math115:atom|атоми]], — і зв'язують їх значками. Уся перша практична — це саме такий розбір.","rules":["Означення: логічне висловлювання — фраза, стосовно якої можна визначити її істинність чи хибність","Атомарне висловлювання (атом) — те, що вже не розкладається на простіші. Позначаємо $a$, $b$, $c$","Складене висловлювання (формула) будується з атомів зв'язками. Позначаємо $A$, $B$, $F$","Істинність задає функція інтерпретація: $I(a)\\in\\{0,1\\}$, де $0$ — хиба, $1$ — істина","Хибне речення теж є висловлюванням. «Не висловлювання» означає «неможливо перевірити»","Шукай у реченні слова-[[c:math115:connective|зв'язки]]: «і», «або», «якщо…то», «тоді й тільки тоді», «не»"],"pics":["STMT"],"ex":[["Розминка. Чи є висловлюванням «Якщо я дівчина, то я не тигр»?",""],["Ставимо єдине питання","чи можна сказати «правда» або «неправда»? Можна"],["Отже, це висловлювання","до того ж складене: усередині сидить «якщо…, то…»"],["Виділяємо атоми","$a$ — «я дівчина», $b$ — «я тигр»"],["Записуємо формулою","$a\\to\\neg b$"]],"exFin":"Складене висловлювання; формула $a\\to\\neg b$","ex2":[["ПР 1, A1 (б). Розкласти: «Якщо сьогодні гарна погода і в мене не поганий настрій, то я піду гуляти або подзвоню подружці»",""],["Виділяємо атоми","$a$ — гарна погода, $b$ — поганий настрій, $c$ — піду гуляти, $d$ — подзвоню подружці"],["Ліва частина «якщо»","«гарна погода І не поганий настрій» — це $a\\wedge\\neg b$"],["Права частина «то»","«піду гуляти АБО подзвоню» — це $c\\vee d$"],["З'єднуємо головною зв'язкою","$(a\\wedge\\neg b)\\to(c\\vee d)$"]],"ex2Fin":"$(a\\wedge\\neg b)\\to(c\\vee d)$","ex3":[["ПР 1, A1 (в) і (г). Ще два речення",""],["(в) «Петро сумлінно вчиться, але не отримує високих оцінок»","«але» — це $\\wedge$: $a\\wedge\\neg b$"],["(г) «Ведмідь зможе поїсти меду тоді і тільки тоді, коли він полізе на дерево, і на цьому дереві будуть жити дикі бджоли»",""],["«Тоді і тільки тоді» — головна зв'язка","це $\\leftrightarrow$"],["Права частина","«полізе на дерево І там бджоли» — $b\\wedge c$"],["Разом","$a\\leftrightarrow(b\\wedge c)$"]],"ex3Fin":"(в) $a\\wedge\\neg b$;  (г) $a\\leftrightarrow(b\\wedge c)$","more":"Головне вміння тут — знайти ГОЛОВНУ зв'язку, ту, що ділить речення надвоє. У пункті (б) це «якщо…то», а не «і» та «або», хоч їх і більше. Знайшов головну — далі кожну половину розбираєш окремо, і плутанини не буде. Ставити дужки навколо половин варто завжди, навіть коли здається, що можна без них.","check":[{"q":"Скільки атомів у реченні «Якщо сьогодні гарна погода і в мене не поганий настрій, то я піду гуляти або подзвоню подружці»?","a":["4","чотири"]},{"q":"Яка головна зв'язка в «Ведмідь поїсть меду тоді і тільки тоді, коли…»? Одним символом","a":["↔","\\leftrightarrow","<->","<=>","еквіваленція"]},{"q":"Запиши «Петро вчиться, але не отримує оцінок» через $a$ і $b$","a":["a∧¬b","a&&¬b","a\\wedge\\neg b","a&¬b","a*¬b","a∧!b"]}],"learn":["Висловлювання — фраза, стосовно якої можна визначити істинність чи хибність","Атом — те, що вже не розкладається; позначаємо $a,b,c$","$I(a)\\in\\{0,1\\}$: $0$ — хиба, $1$ — істина"],"ref":["Розбір речення — це звичайне читання. Шукай слова «і», «або», «якщо», «не»"],"kids":true},{"id":"w1b","w":1,"s":"s1","min":3,"t":"П'ять зв'язок і формула імплікації","pr":"ПР 1 · A2","idea":"Зв'язок рівно п'ять, і вчити їхні таблиці рядок за рядком не треба. У кожної є один особливий рядок — той, що вибивається. Запам'ятай його, і решта дістанеться сама. А ще ці рядки читаються у зворотний бік: якщо відомо значення всієї [[c:math115:connective|зв'язки]], часто можна витягти значення окремого атома. Саме про це задача A2.","rules":["$a\\wedge b$ — кон'юнкція, «і». Істинна ЛИШЕ коли обидва істинні","$a\\vee b$ — диз'юнкція, «або». Хибна ЛИШЕ коли обидва хибні","$a\\oplus b$ — виключне або, XOR. Істинне коли значення РІЗНІ","$a\\to b$ — [[c:math115:implication|імплікація]]. Хибна ЛИШЕ у випадку $1\\to 0$. Це і є «основна формула для імплікації»","$a\\leftrightarrow b$ — еквіваленція. Істинна коли значення ОДНАКОВІ","$\\neg a$ — заперечення: $I(\\neg a)=1-I(a)$","Робоча рівність, яка знадобиться скрізь: $a\\to b\\simeq\\neg a\\vee b$"],"pics":["CONN","TT4","IMPL"],"ex":[["Розминка. $I(a)=0$, $I(b)=0$. Чому дорівнює $I(a\\to b)$?",""],["Особливого рядка немає","бо $a$ не одиниця"],["А якщо не особливий рядок — то одиниця","імплікація хибна ТІЛЬКИ в одному рядку з чотирьох"],["По-людськи","я обіцяв: «якщо піде дощ — візьму парасолю». Дощу не було. Обіцянку я не порушив"]],"exFin":"$1$","ex2":[["ПР 1, A2. Встановити істинність $a$, якщо відомо: (а) $a\\wedge b$ істинне; (б) $a\\vee b$ хибне; (в) $a\\to b$ хибне",""],["(а) Кон'юнкція істинна лише коли обидва істинні","отже $a=1$ (і заразом $b=1$)"],["(б) Диз'юнкція хибна лише коли обидва хибні","отже $a=0$"],["(в) Імплікація хибна лише в рядку $1\\to 0$","отже $a=1$ (і заразом $b=0$)"],["Зверни увагу","у всіх трьох випадках відповідь однозначна саме тому, що особливий рядок один"]],"ex2Fin":"(а) $a=1$;  (б) $a=0$;  (в) $a=1$","ex3":[["Пастка. $I(a)=1$, $I(b)=1$. Порівняй $a\\vee b$ і $a\\oplus b$",""],["Звичайне «або»","достатньо, щоб хоч одне було істинним: $a\\vee b=1$"],["Виключне «або»","вимагає, щоб значення були РІЗНІ. А вони однакові"],["Отже","$a\\oplus b=0$"]],"ex3Fin":"$a\\vee b=1$, а $a\\oplus b=0$","more":"А тепер спробуй те саме навпаки з рештою зв'язок — і побачиш, чому задача A2 взяла саме ці три. Якби спитали «$a\\vee b$ істинне, чому дорівнює $a$» — відповіді не було б: годяться і $0$, і $1$. Однозначну відповідь дає лише той бік зв'язки, де можливий рівно один набір.","check":[{"q":"$a\\vee b$ хибне. Чому дорівнює $a$?","a":["0"]},{"q":"$a\\to b$ хибне. Чому дорівнює $b$?","a":["0"]},{"q":"$a\\wedge b$ хибне. Чи можна однозначно сказати, чому дорівнює $a$? (так / ні)","a":["ні"]}],"learn":["$\\wedge$ істинна лише коли ОБИДВА істинні","$\\vee$ хибна лише коли ОБИДВА хибні","$\\oplus$ істинне коли значення РІЗНІ","$\\to$ хибна лише при $1\\to 0$ — основна формула для імплікації","$\\leftrightarrow$ істинна коли значення ОДНАКОВІ"],"ref":["Уся таблиця з чотирьох рядків відновлюється з п'яти рядків ліворуч","Не з кожної зв'язки можна витягти атом назад — лише там, де рядок один"],"kids":true},{"id":"w1c","w":1,"s":"s1","min":4,"t":"«Лише якщо», «проте» та інші пастки","pr":"ПР 2 · A4 · ДЗ 1","idea":"Тут губиться найбільше балів у всьому Тижні 1, і не через складність, а через українську мову. «a якщо b» і «a лише якщо b» дають ПРОТИЛЕЖНІ стрілки. Вивчи табличку нижче дослівно — вона економить більше, ніж будь-яка формула.","rules":["«Якщо $a$, то $b$» $\\Rightarrow$ $a\\to b$","«$a$, лише якщо $b$» $\\Rightarrow$ $a\\to b$ — те саме, що й попереднє","«$a$, якщо $b$» $\\Rightarrow$ $b\\to a$ — стрілка в ІНШИЙ бік","«$a$ тоді й лише тоді, коли $b$» $\\Rightarrow$ $a\\leftrightarrow b$","«$a$, проте $b$» (а також «але», «а», «однак») $\\Rightarrow$ $a\\wedge b$","«$a$ достатньо для $b$» $\\Rightarrow$ $a\\to b$: достатня умова стоїть ЗЛІВА","«$a$ необхідно для $b$» $\\Rightarrow$ $b\\to a$: необхідна умова стоїть СПРАВА"],"pics":["ONLYIF","NECSUF"],"ex":[["ПР 2, A4. $a$ — «склянка наполовину [[c:math115:empty-set|порожня]]», $b$ — «у мене хороший настрій»",""],["(а) «У мене не хороший настрій, проте склянка наполовину порожня»","«проте» — це $\\wedge$; перший доданок із запереченням"],["Записуємо","$\\neg b\\wedge a$"],["(б) «Склянка наполовину порожня ЛИШЕ ЯКЩО у мене хороший настрій»","«лише якщо» лишає стрілку в природному напрямку"],["Записуємо","$a\\to b$"],["(в) «Якщо склянка наполовину порожня, то у мене не хороший настрій»","звичайне «якщо…то»"],["Записуємо","$a\\to\\neg b$"]],"exFin":"(а) $\\neg b\\wedge a$;  (б) $a\\to b$;  (в) $a\\to\\neg b$","ex2":[["ПР 2, ДЗ 1. $a$ — «я вдало напишу контрольну з ДМ», $b$ — «я робитиму всі домашні завдання»",""],["(а) «Я вдало напишу ЛИШЕ ЯКЩО робитиму всі ДЗ»","$a\\to b$ — робити ДЗ необхідно, щоб написати вдало"],["(б) «Я робитиму не всі ДЗ, ПРОТЕ вдало напишу»","$\\neg b\\wedge a$"],["(в) «Якщо вдало напишу, то робитиму не всі ДЗ»","$a\\to\\neg b$"],["Порівняй (а) і (б)","вони прямо суперечать одне одному, і формули це чесно показують"]],"ex2Fin":"(а) $a\\to b$;  (б) $\\neg b\\wedge a$;  (в) $a\\to\\neg b$","ex3":[["Перевірка розуміння. Чому «$a$ лише якщо $b$» — це $a\\to b$, а не $b\\to a$?",""],["Читаємо фразу буквально","«$a$ трапляється лише у випадку, коли є $b$»"],["Тобто якщо $b$ немає","то й $a$ бути не може: $\\neg b\\to\\neg a$"],["А це контрапозиція","$\\neg b\\to\\neg a$ рівносильне $a\\to b$"],["Життєвий приклад","«ти студент, лише якщо склав НМТ». Без НМТ студентом не станеш — але сам НМТ студентом не робить"]],"ex3Fin":"$a\\to b$, бо «лише якщо» задає НЕОБХІДНУ умову","more":"Запам'ятай через слова «необхідно» і «достатньо». У записі $a\\to b$ лівий бік — достатній: його вистачає. Правий — необхідний: без нього не буде лівого. «Лише якщо $b$» каже саме про необхідність, тому $b$ іде праворуч. А «якщо $b$» каже про достатність, тому $b$ іде ліворуч.","check":[{"q":"Запиши «$p$, лише якщо $q$»","a":["p→q","p->q","p\\to q","p=>q"]},{"q":"Запиши «$p$, якщо $q$»","a":["q→p","q->p","q\\to p","q=>p"]},{"q":"У записі $a\\to b$ яка умова НЕОБХІДНА — $a$ чи $b$? Однією літерою","a":["b"]}],"learn":["«$a$, лише якщо $b$» $=$ $a\\to b$","«$a$, якщо $b$» $=$ $b\\to a$","«$a$, проте $b$» $=$ $a\\wedge b$","У $a\\to b$: $a$ достатня, $b$ необхідна"],"ref":["Чому саме такі стрілки — видно через «необхідно» і «достатньо»"],"kids":true},{"id":"w1d","w":1,"s":"s1","min":3,"t":"Інтерпретація: рахуємо формулу","pr":"ПР 1 · A3","idea":"Коли значення всіх [[c:math115:atom|атомів]] відомі, значення формули рахується однозначно. Робиться це зсередини назовні: спершу найглибші дужки, потім наступний шар, і головна [[c:math115:connective|зв'язка]] — останньою. Ніякої кмітливості, лише порядок дій і охайність.","rules":["Порядок дій: спершу $\\neg$, потім $\\wedge$, потім $\\vee$ і $\\oplus$, наприкінці $\\to$ та $\\leftrightarrow$","Дужки перебивають порядок — те, що в них, рахують першим","Виписуй кожен проміжний результат окремим рядком, а не тримай у голові","Головна зв'язка формули — та, яку виконують ОСТАННЬОЮ","Якщо в диз'юнкції один доданок уже дорівнює $1$, решту можна не рахувати"],"pics":["TTROWS"],"ex":[["ПР 1, A3 (а). $F=((a\\oplus b)\\to c)\\vee(\\neg a\\to b)$ при $I(a)=I(b)=1$, $I(c)=0$",""],["Крок 1. Найглибше","$a\\oplus b=1\\oplus 1=0$, бо значення однакові"],["Крок 2. Ліва дужка","$(a\\oplus b)\\to c=0\\to 0=1$ — ліворуч нуль, отже одиниця"],["Крок 3. Уже можна зупинитись","головна зв'язка — диз'юнкція, а один доданок уже $1$"],["Крок 4. Для повноти права дужка","$\\neg a=0$, тому $\\neg a\\to b=0\\to 1=1$"],["Разом","$1\\vee 1=1$"]],"exFin":"$I(F)=1$","ex2":[["ПР 1, A3 (б). Та сама формула при $I(a)=1$, $I(b)=I(c)=0$",""],["Крок 1","$a\\oplus b=1\\oplus 0=1$, значення різні"],["Крок 2. Ліва дужка","$1\\to 0=0$ — це той самий єдиний хибний рядок"],["Крок 3. Права дужка","$\\neg a=0$, отже $0\\to 0=1$"],["Крок 4. Головна зв'язка","$0\\vee 1=1$"],["Зверни увагу","ліва частина стала нулем, а формула все одно істинна — врятувала друга дужка"]],"ex2Fin":"$I(F)=1$","more":"У пункті (а) можна було не рахувати праву дужку взагалі: щойно один доданок диз'юнкції став одиницею, уся диз'юнкція одиниця. На контрольній це економить час. Але поки не набив руку — рахуй усе: скорочення допомагають тільки тоді, коли ти впевнений, що правильно визначив головну зв'язку.","check":[{"q":"$F=(a\\wedge b)\\vee\\neg c$ при $a=0$, $b=1$, $c=1$. Чому дорівнює $F$?","a":["0"]},{"q":"$F=(a\\to b)\\oplus c$ при $a=1$, $b=0$, $c=1$. Чому дорівнює $F$?","a":["1"]},{"q":"У формулі $((a\\vee b)\\wedge c)\\to d$ яка зв'язка головна? Одним символом","a":["→","->","\\to","=>","імплікація"]}],"learn":["Порядок дій: $\\neg$, потім $\\wedge$, потім $\\vee$ і $\\oplus$, наприкінці $\\to$ та $\\leftrightarrow$"],"ref":["Скорочення (диз'юнкція з одиницею) працює, лише коли впевнений у головній зв'язці"],"kids":true},{"id":"w1e","w":1,"s":"s1","min":4,"t":"Таблиця істинності й еквівалентність","pr":"ПР 1 · A4","idea":"[[c:math115:truth-table|Таблиця істинності]] — чесний перебір усіх варіантів. Її будують, коли треба порівняти дві формули або перевірити, чи формула істинна завжди. Головне — не збитися: рядки заповнюють за двійковим лічильником, а проміжні стовпці виписують обов'язково.","rules":["Змінних $n$ — рядків рівно $2^n$: дві змінні дають $4$, три дають $8$, чотири дають $16$","Ліві стовпці за лічильником: права колонка міняється щорядка, наступна — через два, наступна — через чотири","Проміжні стовпці обов'язкові. Спочатку дужки, потім усе інше, головна [[c:math115:connective|зв'язка]] — остання","Дві формули [[c:math115:equivalence|еквівалентні]] ($F\\simeq G$), якщо їхні останні стовпці збігаються В УСІХ рядках","Щоб спростувати еквівалентність, достатньо ОДНОГО рядка, де стовпці різні"],"pics":["TT8"],"ex":[["ПР 1, A4. Порівняти $F=(a\\vee b)\\wedge c\\to\\neg(a\\wedge b)\\vee c$ і $G=(a\\vee b)\\wedge(\\neg a\\vee c)$",""],["Спершу подивимось на $F$ уважно","головна зв'язка — [[c:math115:implication|імплікація]]"],["Коли $c=1$","права частина $\\neg(a\\wedge b)\\vee c$ містить $\\vee\\,1$, отже дорівнює $1$, і вся імплікація $1$"],["Коли $c=0$","ліва частина $(a\\vee b)\\wedge 0=0$, отже імплікація теж $1$"],["Висновок про $F$","інших випадків немає — $F$ є [[c:math115:tautology|тавтологією]], у неї стовпець із самих одиниць"],["Тепер $G$ при $a=0$, $b=0$","$(0\\vee 0)\\wedge(1\\vee c)=0$"],["Знайшли розбіжність","$F=1$, а $G=0$ — цього досить"]],"exFin":"Не еквівалентні: $F$ — тавтологія, а $G$ хибна вже при $a=b=0$","ex2":[["Виписуємо стовпці повністю, щоб побачити всю картину",""],["Рядки $(a,b,c)$","$000,\\ 001,\\ 010,\\ 011,\\ 100,\\ 101,\\ 110,\\ 111$"],["Стовпець $F$","$1,\\ 1,\\ 1,\\ 1,\\ 1,\\ 1,\\ 1,\\ 1$"],["Стовпець $G$","$0,\\ 0,\\ 1,\\ 1,\\ 0,\\ 1,\\ 0,\\ 1$"],["Розбіжностей аж чотири","у рядках $000$, $001$, $100$ і $110$"]],"ex2Fin":"$G=0$ у чотирьох рядках, тому формули точно не еквівалентні","more":"Помітив хід у першому прикладі? Замість вісьмох рядків вистачило двох випадків: $c=1$ і $c=0$. Так робити можна завжди, коли одна змінна «вирішує» всю формулу. Але записувати таке міркування треба акуратно — воно зараховується як повноцінне доведення, лише якщо ти справді перебрав ВСІ випадки.","check":[{"q":"Скільки рядків у таблиці для формули з чотирма змінними?","a":["16"]},{"q":"Скільки рядків достатньо, щоб спростувати еквівалентність двох формул?","a":["1","один","одного"]},{"q":"$F=\\neg a\\vee b$. Чому дорівнює $F$ при $a=1$, $b=0$?","a":["0"]}],"learn":["Змінних $n$ — рядків $2^n$","$F\\simeq G$, якщо стовпці збігаються В УСІХ рядках","Спростувати еквівалентність можна ОДНИМ рядком"],"ref":["Заповнення лівих стовпців — це лічба у двійковій системі","Іноді замість восьми рядків вистачає розбору двох випадків за однією змінною"],"kids":true},{"id":"w1f","w":1,"s":"s1","min":3,"t":"Тавтологія, суперечливе, виконливе","pr":"ПР 1 · A6 · ДЗ 1","idea":"Побудували стовпець — дивимось, що в ньому. Самі одиниці, самі нулі або мішанина. Це три різні слова, і викладач винесе їх у список ключових понять тижня. Означення варто знати дослівно.","rules":["[[c:math115:tautology|Тавтологія]] (тотожно-істинна): $I(F)=1$ за БУДЬ-ЯКОЇ інтерпретації. Приклад: $a\\vee\\neg a$","Тотожно-хибна (суперечливе твердження): $I(F)=0$ за будь-якої інтерпретації. Приклад: $a\\wedge\\neg a$","Виконлива: $F$ НЕ є тавтологією, але хоча б за однієї інтерпретації $I(F)=1$","$F\\simeq G$ тоді й лише тоді, коли $F\\leftrightarrow G$ — тавтологія","Швидкий спосіб перевірити тавтологію: припустити, що формула хибна, і показати, що це неможливо"],"pics":["KINDS"],"ex":[["ПР 1, A6. Чи є тавтологією $(a\\to(b\\to c))\\leftrightarrow(b\\to(a\\to c))$?",""],["Замість вісьмох рядків спростимо обидві половини","$a\\to(b\\to c)\\simeq\\neg a\\vee(\\neg b\\vee c)$"],["Прибираємо дужки","$\\neg a\\vee\\neg b\\vee c$"],["Тепер права половина","$b\\to(a\\to c)\\simeq\\neg b\\vee(\\neg a\\vee c)=\\neg b\\vee\\neg a\\vee c$"],["Порівнюємо","та сама диз'юнкція, лише переставлені доданки"],["А диз'юнкція комутативна","отже половини [[c:math115:equivalence|еквівалентні]], і $\\leftrightarrow$ між ними — тавтологія"]],"exFin":"Так, тавтологія","ex2":[["ПР 1, ДЗ 1 (а). Чи є тавтологією $\\neg(a\\to b)\\to a$?",""],["Припустимо, що формула хибна","тоді $\\neg(a\\to b)=1$ і $a=0$"],["Розкриваємо перше","$\\neg(a\\to b)\\simeq a\\wedge\\neg b$, отже потрібно $a=1$"],["Але ми щойно взяли $a=0$","суперечність"],["Хибного рядка не існує","отже це тавтологія"]],"ex2Fin":"Так, тавтологія","ex3":[["ПР 1, ДЗ 1 (б). Чи є тавтологією $(a\\wedge b)\\to(a\\to b)$?",""],["Припустимо, що хибна","тоді $a\\wedge b=1$ і $a\\to b=0$"],["З першого","$a=1$ і $b=1$"],["Підставляємо в друге","$1\\to 1=1$, а нам потрібен нуль"],["Суперечність","отже тавтологія"]],"ex3Fin":"Так, тавтологія","more":"Хід «припустимо, що формула хибна» працює саме через [[c:math115:implication|імплікацію]]: вона хибна рівно в одному випадку, тому припущення одразу задає значення обох половин. Для $\\vee$ це теж зручно (хибна лише коли всі доданки нулі), а от для $\\wedge$ — навпаки: припущення «$A\\wedge B=0$» розгалужується на два випадки, і виграшу немає.","check":[{"q":"Як називають формулу, у якої стовпець складається лише з нулів? (через дефіс)","a":["тотожно-хибна","тотожнохибна","тотожно-хибною","суперечлива"]},{"q":"Чи є $a\\wedge\\neg a$ виконливою? (так / ні)","a":["ні"]},{"q":"Чому еквівалентна $a\\to(b\\to c)$? Запиши через $\\vee$","a":["¬a∨¬b∨c","¬a v ¬b v c","\\neg a\\vee\\neg b\\vee c","!a|!b|c"]}],"learn":["Тавтологія: $I(F)=1$ за будь-якої інтерпретації","Тотожно-хибна: $I(F)=0$ за будь-якої інтерпретації","Виконлива: не тавтологія, але хоч раз $I(F)=1$","$F\\simeq G$ $\\Leftrightarrow$ $F\\leftrightarrow G$ — тавтологія"],"ref":["Хід «припустимо, що формула хибна» найкраще працює саме з імплікацією"],"kids":true},{"id":"w1g","w":1,"s":"s1","min":4,"t":"Властивості зв'язок","pr":"ПР 1 · A5 · ПР 2 · A5","idea":"Список рівностей, за якими формули перетворюють, не будуючи таблиць. Майже все в ньому впізнаване зі школи: комутативність, асоціативність, дистрибутивність. Нового рівно дві речі — де Морган і заміна [[c:math115:implication|імплікації]]. Саме цим списком робиться вся частина B обох практичних.","rules":["Ідемпотентність: $A\\vee A\\simeq A\\simeq A\\wedge A$","Комутативність і асоціативність — як у $+$ та $\\cdot$","Дистрибутивність: $(A\\vee B)\\wedge C\\simeq(A\\wedge C)\\vee(B\\wedge C)$ і $(A\\wedge B)\\vee C\\simeq(A\\vee C)\\wedge(B\\vee C)$","Доповнювальність: $A\\vee\\neg A\\simeq 1$, $A\\wedge\\neg A\\simeq 0$, $\\neg(\\neg A)\\simeq A$","Поглинання: $(A\\vee B)\\wedge A\\simeq A$ і $(A\\wedge B)\\vee A\\simeq A$","Де Морган: $\\neg(A\\vee B)\\simeq\\neg A\\wedge\\neg B$ і $\\neg(A\\wedge B)\\simeq\\neg A\\vee\\neg B$","Дві заміни: $A\\to B\\simeq\\neg A\\vee B$ і $\\neg(A\\to B)\\simeq A\\wedge\\neg B$"],"pics":["DEMORG"],"ex":[["ПР 2, A5. Перевірити де Моргана для трьох змінних: $\\neg(a\\wedge b\\wedge c)\\simeq\\neg a\\vee\\neg b\\vee\\neg c$",""],["Групуємо в дві частини","$\\neg((a\\wedge b)\\wedge c)$ — тепер це де Морган для двох"],["Застосовуємо","$\\neg(a\\wedge b)\\vee\\neg c$"],["Ще раз де Морган на першій дужці","$(\\neg a\\vee\\neg b)\\vee\\neg c$"],["Прибираємо зайві дужки","$\\neg a\\vee\\neg b\\vee\\neg c$"],["Другий пункт робиться дзеркально","$\\neg(a\\vee b\\vee c)\\simeq\\neg a\\wedge\\neg b\\wedge\\neg c$"]],"exFin":"Обидві рівності справджуються","ex2":[["ПР 1, A5. Чи виконується дистрибутивність кон'юнкції відносно ксора: $a\\wedge(b\\oplus c)\\simeq(a\\wedge b)\\oplus(a\\wedge c)$?",""],["Випадок $a=0$","ліворуч $0\\wedge(\\dots)=0$; праворуч $0\\oplus 0=0$. Збігається"],["Випадок $a=1$","ліворуч $1\\wedge(b\\oplus c)=b\\oplus c$"],["Праворуч при $a=1$","$(1\\wedge b)\\oplus(1\\wedge c)=b\\oplus c$. Теж збігається"],["Обидва випадки пройдені","отже рівність виконується завжди"],["Чому так","$\\oplus$ поводиться як додавання, а $\\wedge$ як множення — і множення розподіляється відносно додавання"]],"ex2Fin":"Так, дистрибутивність виконується","more":"Аналогія з арифметикою тут не випадкова: якщо вважати $0$ і $1$ числами, то $\\oplus$ — це додавання за модулем два, а $\\wedge$ — звичайне множення. Тому все, що ти знаєш про розкриття дужок, працює і тут. А от у зворотний бік не працює: $a\\oplus(b\\wedge c)$ НЕ дорівнює $(a\\oplus b)\\wedge(a\\oplus c)$ — так само, як $2+3\\cdot 4\\ne(2+3)(2+4)$.","check":[{"q":"Спрости $\\neg(\\neg a\\vee b)$","a":["a∧¬b","a&&¬b","a\\wedge\\neg b","a&¬b","a*¬b","a∧!b"]},{"q":"Спрости $(a\\wedge b)\\vee a$","a":["a"]},{"q":"Чому еквівалентна $\\neg(a\\to b)$?","a":["a∧¬b","a&&¬b","a\\wedge\\neg b","a&¬b","a*¬b","a∧!b"]}],"learn":["Де Морган: $\\neg(A\\vee B)\\simeq\\neg A\\wedge\\neg B$, $\\neg(A\\wedge B)\\simeq\\neg A\\vee\\neg B$","$A\\to B\\simeq\\neg A\\vee B$","$\\neg(A\\to B)\\simeq A\\wedge\\neg B$","Поглинання: $(A\\vee B)\\wedge A\\simeq A$"],"ref":["Комутативність, асоціативність, дистрибутивність — як у $+$ та $\\cdot$ зі школи","$\\oplus$ поводиться як додавання, $\\wedge$ — як множення"],"kids":true},{"id":"w1h","w":1,"s":"s1","min":4,"t":"Спрощення до однієї дії","pr":"ПР 1 · B2 · ПР 2 · A2, A6","idea":"Формулювання «звести кількість дій до однієї» означає: маєш отримати щось на кшталт $a\\vee\\neg c$ — два [[c:math115:atom|атоми]] й один значок. Виглядає страшно, робиться механічно, якщо тримати порядок кроків: прибрати стрілки, загнати заперечення всередину, розкрити дужки, скоротити.","rules":["Крок 1: прибери ВСІ $\\to$ і $\\leftrightarrow$ через $A\\to B\\simeq\\neg A\\vee B$","Крок 2: заганяй $\\neg$ всередину через де Моргана","Крок 3: знімай подвійні заперечення","Крок 4: розкривай або виноси дужки за дистрибутивністю","Крок 5: скорочуй через поглинання, $A\\vee\\neg A\\simeq 1$ і $A\\wedge\\neg A\\simeq 0$","Корисно пам'ятати: $(b\\to a)\\wedge(\\neg b\\to a)\\simeq a$ — що б не було з $b$, маємо $a$"],"pics":["STEPS5"],"ex":[["ПР 2, A2. Звести до однієї дії: $\\big((b\\to a)\\wedge(\\neg b\\to a)\\wedge(a\\to c)\\big)\\vee\\neg c$",""],["Дивимось на перші дві дужки","$(b\\to a)\\wedge(\\neg b\\to a)$"],["Що б не було з $b$, обидві дають $a$","отже ця пара спрощується просто до $a$"],["Лишилось у великій дужці","$a\\wedge(a\\to c)$, а це $a\\wedge(\\neg a\\vee c)=a\\wedge c$"],["Тепер уся формула","$(a\\wedge c)\\vee\\neg c$"],["Дистрибутивність","$(a\\vee\\neg c)\\wedge(c\\vee\\neg c)=(a\\vee\\neg c)\\wedge 1$"],["Залишається","$a\\vee\\neg c$"]],"exFin":"$a\\vee\\neg c$, тобто $c\\to a$ — одна дія","ex2":[["ПР 1, B2. Звести до однієї дії: $\\big((a\\to b)\\wedge(a\\vee(b\\wedge c))\\wedge(a\\to c)\\big)\\vee\\neg c$",""],["Позначимо велику дужку через $X$","працюємо з нею окремо"],["Розглянемо випадок $a=1$","тоді $a\\to b$ дає $b=1$, $a\\to c$ дає $c=1$, і $X=1$"],["Розглянемо випадок $a=0$","тоді $a\\vee(b\\wedge c)$ вимагає $b\\wedge c=1$, тобто $b=1$ і $c=1$; решта дужок істинні. Знову $X=1$"],["Отже $X=1$ саме тоді, коли $b=1$ і $c=1$","тобто $X\\simeq b\\wedge c$"],["Підставляємо","$(b\\wedge c)\\vee\\neg c=(b\\vee\\neg c)\\wedge(c\\vee\\neg c)$"],["Скорочуємо","$b\\vee\\neg c$"]],"ex2Fin":"$b\\vee\\neg c$, тобто $c\\to b$","ex3":[["ПР 2, A6. Спростити дві короткі формули",""],["(а) $(a\\wedge b)\\vee\\neg a$","дистрибутивність: $(a\\vee\\neg a)\\wedge(b\\vee\\neg a)$"],["Перша дужка це $1$","лишається $b\\vee\\neg a$, тобто $a\\to b$"],["(б) $\\neg(a\\wedge b)\\wedge\\neg b$","де Морган: $(\\neg a\\vee\\neg b)\\wedge\\neg b$"],["Це поглинання","$(X\\vee Y)\\wedge Y\\simeq Y$, де $Y=\\neg b$"],["Отже","$\\neg b$"]],"ex3Fin":"(а) $a\\to b$;  (б) $\\neg b$","more":"Прийом із другого прикладу — «розглянемо випадок $a=1$ і випадок $a=0$» — цілком законний і часто швидший за формальні перетворення. Головне: перебрати обидва випадки й записати висновок як формулу, а не лишити його словами. У роботі це виглядає так: «при $a=1$ маємо $X=1$; при $a=0$ маємо $X=b\\wedge c$; отже $X\\simeq b\\wedge c$».","check":[{"q":"Спрости $(b\\to a)\\wedge(\\neg b\\to a)$","a":["a"]},{"q":"Спрости $(a\\wedge b)\\vee\\neg a$","a":["a→b","a->b","¬a∨b","\\neg a\\vee b","!a|b","a=>b"]},{"q":"Спрости $\\neg(a\\wedge b)\\wedge\\neg b$","a":["¬b","\\neg b","!b","~b","не b"]}],"learn":["Порядок спрощення: стрілки $\\to$ де Морган $\\to$ дужки $\\to$ скорочення","$(b\\to a)\\wedge(\\neg b\\to a)\\simeq a$"],"ref":["Розбір випадків $a=0$ і $a=1$ — законна альтернатива перетворенням"],"kids":true},{"id":"w1i","w":1,"s":"s1","min":4,"t":"Довести тавтологію перетвореннями","pr":"ПР 1 · B1 · ПР 2 · A1, B1 · ДЗ 2","idea":"Одне й те саме завдання формулюють двома способами: «пересвідчіться, що формула є [[c:math115:tautology|тавтологією]]» і «доведіть [[c:math115:equivalence|еквівалентність]]». Робиться і те, і те однаково: перетворюєш формулу за списком рівностей, поки не отримаєш $1$ (для тавтології) або поки дві сторони не збіжаться (для еквівалентності).","rules":["Тавтологія доведена, коли ланцюжок перетворень закінчився символом $1$","Еквівалентність доведена, коли обидві сторони зведено до одного й того самого вигляду","Найнадійніший спосіб звести все до спільного вигляду — розкрити всі стрілки й отримати чисту диз'юнкцію","Якщо в диз'юнкції зустрілися $A$ і $\\neg A$ — уся диз'юнкція дорівнює $1$","Якщо звести до $1$ не вдається — можливо, формула НЕ тавтологія. Тоді шукай контрприклад"],"pics":["STEPS5"],"ex":[["ПР 2, A1. Довести, що $\\big((a\\to b)\\wedge(\\neg a\\to c)\\big)\\to(b\\vee c)$ — тавтологія",""],["Крок 1. Прибираємо внутрішні стрілки","$a\\to b\\simeq\\neg a\\vee b$, а $\\neg a\\to c\\simeq a\\vee c$"],["Крок 2. Прибираємо головну стрілку","$\\neg\\big((\\neg a\\vee b)\\wedge(a\\vee c)\\big)\\vee b\\vee c$"],["Крок 3. Де Морган","$\\neg(\\neg a\\vee b)\\vee\\neg(a\\vee c)\\vee b\\vee c$"],["Крок 4. Ще раз де Морган","$(a\\wedge\\neg b)\\vee(\\neg a\\wedge\\neg c)\\vee b\\vee c$"],["Крок 5. Поглинання","$(a\\wedge\\neg b)\\vee b\\simeq a\\vee b$, бо $(X\\wedge\\neg Y)\\vee Y\\simeq X\\vee Y$"],["Так само з другою парою","$(\\neg a\\wedge\\neg c)\\vee c\\simeq\\neg a\\vee c$"],["Лишилось","$a\\vee b\\vee\\neg a\\vee c$, а тут є і $a$, і $\\neg a$"]],"exFin":"Дорівнює $1$ — тавтологія (це правило резолюцій)","ex2":[["ПР 2, B1. Довести еквівалентність $(A\\wedge B)\\to C\\simeq\\neg A\\vee(B\\to C)$",""],["Ліва сторона. Прибираємо стрілку","$\\neg(A\\wedge B)\\vee C$"],["Де Морган","$\\neg A\\vee\\neg B\\vee C$"],["Права сторона. Прибираємо внутрішню стрілку","$\\neg A\\vee(\\neg B\\vee C)$"],["Прибираємо дужки","$\\neg A\\vee\\neg B\\vee C$"],["Сторони збіглися","еквівалентність доведена"]],"ex2Fin":"Обидві сторони дорівнюють $\\neg A\\vee\\neg B\\vee C$","ex3":[["ПР 2, ДЗ 2. Чи є тавтологією $(a\\vee b\\vee c)\\to\\big((\\neg a\\wedge\\neg b)\\vee(a\\wedge(b\\vee((c\\vee d)\\wedge b)))\\big)$?",""],["Спершу приберемо сміття","$b\\vee((c\\vee d)\\wedge b)$ — це поглинання, дорівнює просто $b$"],["Формула стала простішою","$(a\\vee b\\vee c)\\to\\big((\\neg a\\wedge\\neg b)\\vee(a\\wedge b)\\big)$"],["Тепер шукаємо контрприклад","треба ліву частину $1$, праву $0$"],["Пробуємо $a=0$, $b=1$, $c=0$","ліворуч $0\\vee 1\\vee 0=1$"],["Праворуч","$(\\neg a\\wedge\\neg b)=(1\\wedge 0)=0$, а $(a\\wedge b)=(0\\wedge 1)=0$; разом $0$"],["Знайшли рядок $1\\to 0$","отже не тавтологія"]],"ex3Fin":"Не тавтологія; контрприклад $a=0$, $b=1$, $c=0$ (при будь-якому $d$)","more":"Зверни увагу на порядок дій у третьому прикладі: спершу спрощення, і лише потім пошук контрприкладу. Величезна дужка з чотирма змінними виявилась звичайним $b$ — і задача, яка на вигляд вимагала таблиці з шістнадцяти рядків, розв'язалась однією підстановкою. Завжди спрощуй, перш ніж рахувати.","check":[{"q":"Спрости $b\\vee((c\\vee d)\\wedge b)$","a":["b"]},{"q":"Чому дорівнює $a\\vee b\\vee\\neg a\\vee c$?","a":["1","істина","тавтологія"]},{"q":"$(A\\wedge B)\\to C$ у вигляді чистої диз'юнкції — це $\\neg A\\vee\\ ?\\ \\vee C$","a":["¬b","\\neg B","!b","~b","¬B"]}],"learn":["Тавтологія доведена, коли ланцюжок закінчився символом $1$","Якщо в диз'юнкції є $A$ і $\\neg A$ — уся диз'юнкція $1$"],"ref":["Спершу спрощуй, і лише потім рахуй або шукай контрприклад"],"kids":true},{"id":"w1j","w":1,"s":"s1","min":4,"t":"Логічний наслідок і побутові міркування","pr":"ПР 2 · A3, B2 · ДЗ 3, ДЗ 4","idea":"[[c:math115:consequence|Логічний наслідок]] відповідає на питання «чи можна з цих посилок чесно зробити цей висновок». Формально: не існує ситуації, де всі посилки істинні, а висновок хибний. Перевіряється завжди однаково — припусти, що висновок хибний, і спробуй утримати посилки істинними.","rules":["Означення: $F$ — логічний наслідок $H_1,\\dots,H_n$, якщо з $I(H_1)=\\dots=I(H_n)=1$ завжди випливає $I(F)=1$","Записують $H_1,\\dots,H_n\\models F$","Теорема: це рівносильно тому, що $(H_1\\wedge\\dots\\wedge H_n)\\to F$ — [[c:math115:tautology|тавтологія]]","Метод: припусти висновок хибним. Утримав посилки — контрприклад; суперечність — наслідок є","Правильні схеми: $A,\\ A\\to B\\models B$ (ponens) і $A\\to B,\\ \\neg B\\models\\neg A$ (tollens)","Хибна схема: з $A\\to B$ та $B$ НЕ випливає $A$. Це найпоширеніша помилка в побутових міркуваннях"],"pics":["CHECKM","RULES4","CONTRAD"],"ex":[["ПР 2, A3. «Лікарі багато заробляють. Сашко багато заробляє. Отже, Сашко лікар». Чи логічно?",""],["Позначаємо","$a$ — «Сашко лікар», $b$ — «Сашко багато заробляє»"],["Посилки","$a\\to b$ і $b$"],["Висновок","$a$"],["Шукаємо контрприклад","беремо $a=0$, $b=1$"],["Перевіряємо","$a\\to b=0\\to 1=1$ — істинна; $b=1$ — істинна; висновок $a=0$ — хибний"],["Контрприклад знайдено","Сашко може бути програмістом"]],"exFin":"Ні, міркування не логічне","ex2":[["ПР 2, B2 (а). Чи правильно стоїть знак: $x\\to y,\\ z\\to u,\\ \\neg y\\vee\\neg u\\models\\neg x\\vee\\neg y$?",""],["Припускаємо висновок хибним","$\\neg x\\vee\\neg y=0$ можливо лише коли $x=1$ і $y=1$"],["Перша посилка","$x\\to y=1\\to 1=1$. Тримається"],["Третя посилка","$\\neg y\\vee\\neg u=0\\vee\\neg u$, отже потрібно $u=0$"],["Друга посилка","$z\\to u=z\\to 0$, отже потрібно $z=0$"],["Усі посилки істинні при $x=1$, $y=1$, $z=0$, $u=0$","а висновок хибний"]],"ex2Fin":"Неправильно; контрприклад $x=1$, $y=1$, $z=0$, $u=0$","ex3":[["ПР 2, B2 (б). Чи правильно: $x\\wedge y\\wedge\\neg z,\\ y\\to z,\\ y\\to x\\models y\\to(x\\vee z)$?",""],["Дивимось на першу посилку","$x\\wedge y\\wedge\\neg z=1$ означає $x=1$, $y=1$, $z=0$"],["Підставляємо в другу","$y\\to z=1\\to 0=0$ — вона хибна"],["Отже, посилки суперечливі","не існує жодного набору, де всі три істинні"],["А якщо такого набору немає","то й «поганого рядка» бути не може"],["За означенням","наслідок є — знак стоїть правильно"]],"ex3Fin":"Правильно: посилки суперечливі, тому наслідком є будь-яка формула","more":"ПР 2, ДЗ 3 — це чотири побутові міркування, і всі вони на ту саму пару схем. «Якщо голодний — їм бутерброд; їм бутерброд; отже голодний» — хибна схема. «Якщо проспить — не встигне; встиг; отже не проспав» — modus tollens, правильна. «Кожен птах літає; Гаррі не літає; отже не птах» — теж tollens, правильна. «Всі діти не люблять овочі; Аня не любить овочі; отже Аня дитина» — знову хибна. Дивись не на зміст, а на напрямок стрілки.","check":[{"q":"«Якщо проспить — не встигне. Встиг. Отже не проспав». Логічно? (так / ні)","a":["так"]},{"q":"«Всі діти не люблять овочі. Аня не любить овочі. Отже Аня дитина». Логічно? (так / ні)","a":["ні"]},{"q":"ПР 2, ДЗ 4: чи правильно $x\\to(y\\to z),\\ y\\models x\\to z$? (так / ні)","a":["так"]}],"learn":["$F$ — наслідок $H_1,\\dots,H_n$, якщо з усіх посилок істинних випливає $I(F)=1$","$A,\\ A\\to B\\models B$ — modus ponens","$A\\to B,\\ \\neg B\\models\\neg A$ — modus tollens","З $A\\to B$ і $B$ НЕ випливає $A$","Суперечливі посилки $\\Rightarrow$ наслідком є будь-що"],"ref":["Чотири правила висновку — це впізнавання, а не заучування","У побутових міркуваннях дивись на напрямок стрілки, а не на зміст"],"kids":true},{"id":"w1k","w":1,"s":"s1","min":4,"t":"Скласти формулу за умовою","pr":"ПР 2 · C1, C2","idea":"Частина C перевертає задачу: не «порахуй формулу», а «побудуй формулу, яка поводиться ось так». Звучить творчо, робиться механічно — за кожен потрібний рядок таблиці пишеш одну кон'юнкцію, а всі кон'юнкції з'єднуєш через $\\vee$.","rules":["Правило: за кожен рядок, де треба $1$, пиши кон'юнкцію всіх змінних","Змінну беремо як є, якщо в цьому рядку вона $1$, і з запереченням, якщо $0$","Усі такі кон'юнкції з'єднуємо через $\\vee$","Рядки, де треба $0$, нічого не додають — їх просто пропускаємо","Отримана формула істинна рівно в тих рядках, які ти виписав, і більше ніде"],"pics":["REVERSE","CHAINS"],"ex":[["ПР 2, C2 (а). Скласти формулу, істинну тоді й лише тоді, коли $I(a)=I(b)=1$, $I(c)=0$",""],["Потрібен рівно один рядок","$a=1$, $b=1$, $c=0$"],["Пишемо кон'юнкцію за правилом","$a$ як є, $b$ як є, $c$ із запереченням"],["Отримуємо","$a\\wedge b\\wedge\\neg c$"],["Перевіряємо","при $a=b=1$, $c=0$ маємо $1\\wedge 1\\wedge 1=1$"],["А в будь-якому іншому рядку","хоча б один множник стане нулем"]],"exFin":"$a\\wedge b\\wedge\\neg c$","ex2":[["ПР 2, C2 (б). Скласти формулу, істинну тоді й лише тоді, коли рівно два з $a$, $b$, $c$ істинні",""],["Випишемо всі підхожі рядки","$(1,1,0)$, $(1,0,1)$, $(0,1,1)$ — рівно три"],["Перший рядок","$a\\wedge b\\wedge\\neg c$"],["Другий","$a\\wedge\\neg b\\wedge c$"],["Третій","$\\neg a\\wedge b\\wedge c$"],["З'єднуємо через $\\vee$","$(a\\wedge b\\wedge\\neg c)\\vee(a\\wedge\\neg b\\wedge c)\\vee(\\neg a\\wedge b\\wedge c)$"]],"ex2Fin":"$(a\\wedge b\\wedge\\neg c)\\vee(a\\wedge\\neg b\\wedge c)\\vee(\\neg a\\wedge b\\wedge c)$","ex3":[["ПР 2, C1 (б). Для яких $n$ формула $(\\dots(((x\\to x)\\to x)\\to x)\\to x)\\dots$ з $n$ імплікаціями є тавтологією?",""],["Спершу подивимось на випадок $x=1$","будь-яка [[c:math115:implication|імплікація]] з одиницею праворуч дорівнює $1$, тож уся формула $1$ завжди"],["Отже, вирішує лише $x=0$","рахуємо ланцюжок зсередини"],["$n=1$","$x\\to x=0\\to 0=1$"],["$n=2$","попереднє $\\to x$, тобто $1\\to 0=0$"],["$n=3$","$0\\to 0=1$"],["Значення чергуються $1,0,1,0,\\dots$","одиниця стоїть на непарних місцях"]],"ex3Fin":"Тавтологія при непарних $n$","more":"У пункті (а) тієї самої задачі ланцюжок починається з $x\\to\\neg x$, і там відповідь інша: [[c:math115:tautology|тавтології]] не виходить НІ ПРИ ЯКОМУ $n$. Порахуй сам обидва стовпці — це найшвидший спосіб переконатися. Загальний прийом однаковий: зафіксуй $x$, порахуй кілька перших значень, знайди період.","check":[{"q":"Скільки кон'юнкцій буде у формулі «рівно два з трьох істинні»?","a":["3","три"]},{"q":"Формула, істинна лише при $a=0$, $b=1$: запиши через $\\wedge$","a":["¬a∧b","¬a&&b","\\neg a\\wedge b","!a&b","¬a*b","¬a&&b"]},{"q":"$(\\dots((x\\to x)\\to x)\\dots)$ з $n$ імплікаціями — тавтологія при яких $n$? (одне слово)","a":["непарних","непарні","непарне","при непарних"]}],"learn":["За кожен потрібний рядок — одна кон'юнкція; з'єднати через $\\vee$","Змінна як є при $1$, із $\\neg$ при $0$"],"ref":["У ланцюжку імплікацій при $x=1$ усе завжди $1$ — вирішує лише $x=0$"],"kids":true},{"id":"p1","w":2,"s":"s2","min":3,"t":"Чи правильно стоїть знак $\\models$","pr":"ПР 3 · A1","idea":"Перше завдання ПР 3 виглядає страшно, а робиться за півхвилини і без жодної таблиці. Хід один: припусти, що ВИСНОВОК хибний, і подивись, чи вдасться при цьому втримати всі посилки істинними. Вдалося — знак стоїть неправильно, і ти вже маєш контрприклад. Не вдалося — стоїть правильно.","rules":["Означення: $F$ — [[c:math115:consequence|логічний наслідок]] $H_1,\\dots,H_n$, якщо за будь-якої інтерпретації з $I(H_1)=\\dots=I(H_n)=1$ випливає $I(F)=1$","Тобто «поганий рядок» — це той, де всі посилки $1$, а висновок $0$. Наслідок є тоді й лише тоді, коли такого рядка немає","Теорема: $H_1,\\dots,H_n\\models F$ рівносильно тому, що $(H_1\\wedge\\dots\\wedge H_n)\\to F$ — [[c:math115:tautology|тавтологія]]","[[c:math115:implication|Імплікація]] хибна лише при $1\\to 0$ — це єдине, що треба пам'ятати під час перевірки","Знайшов контрприклад — ОБОВ'ЯЗКОВО випиши його: «при $x=1$, $y=1$, $z=0$…». Це і є відповідь"],"pics":["CHECKM","RULES4"],"ex":[["Задача A1 (а). Чи правильно, що $x\\to y,\\ x\\to\\neg y\\models\\neg x$?",""],["Припускаємо, що висновок хибний","$\\neg x=0$, отже $x=1$"],["Тягнемо першу посилку","$x\\to y$ при $x=1$ істинна лише якщо $y=1$"],["Тягнемо другу","$x\\to\\neg y$ при $x=1$ вимагає $\\neg y=1$, тобто $y=0$"],["Порівнюємо","$y$ мусить бути водночас $1$ і $0$ — так не буває"],["Поганого рядка не існує","отже знак стоїть правильно"]],"exFin":"Правильно: $x\\to y,\\ x\\to\\neg y\\models\\neg x$","ex2":[["Задача A1 (б). Чи правильно, що $\\neg x\\to\\neg y,\\ \\neg x\\to\\neg(y\\vee z),\\ \\neg z\\models\\neg x\\vee\\neg y$?",""],["Припускаємо, що висновок хибний","$\\neg x\\vee\\neg y=0$ можливо лише коли обидва доданки нулі"],["Звідси одразу","$x=1$ і $y=1$"],["Третя посилка","$\\neg z=1$, отже $z=0$"],["Перевіряємо першу й другу","у них ліворуч стоїть $\\neg x=0$, а імплікація з нулем ліворуч істинна завжди"],["Отже, всі три посилки істинні, а висновок хибний","поганий рядок знайдено"]],"ex2Fin":"Неправильно; контрприклад $x=1$, $y=1$, $z=0$","more":"Зверни увагу, чому другий приклад «зламався»: посилки з $\\neg x$ ліворуч виявились порожніми обіцянками — при $x=1$ вони істинні автоматично і не обмежують нічого. Тому, припустивши висновок хибним, першими перевіряй ті посилки, що при цих значеннях ще щось вимагають.","check":[{"q":"Скільки «поганих» рядків достатньо знайти, щоб знак $\\models$ виявився неправильним?","a":["1","один","одного","одного рядка"]},{"q":"У «поганому» рядку висновок дорівнює ... ?","a":["0","хиба","хибний"]},{"q":"$a\\to b$ і $b$. Чи правильно, що звідси випливає $a$? (так / ні)","a":["ні"]}],"learn":["$F$ — логічний наслідок $H_1,\\dots,H_n$, якщо з $I(H_1)=\\dots=I(H_n)=1$ випливає $I(F)=1$","Перевірка: припусти висновок хибним і спробуй утримати посилки істинними","Імплікація хибна лише при $1\\to 0$"],"ref":["Повна таблиця істинності тут не потрібна ніколи — вистачає одного припущення","Чотири правила висновку (ponens, tollens, силогізм, резолюція) — це впізнавання, а не заучування"],"kids":true},{"id":"p2","w":2,"s":"s2","min":3,"t":"Чи логічний висновок про кроликів","pr":"ПР 3 · B1","idea":"Частина B починається з двох побутових міркувань, і від них потрібне те саме: сказати «так, логічний» або показати ОДНОГО кролика, на якому все ламається. Формула тут навіть не обов'язкова — достатньо описати одну тварину трьома словами.","rules":["Висновок логічний, якщо НЕ ІСНУЄ ситуації, де всі посилки істинні, а висновок хибний","Ситуація тут — це один кролик із трьома ознаками: старий чи ні, ненажерливий чи ні, чорний чи ні","Щоб спростувати — вигадай такого кролика. Щоб довести — покажи, що будь-яка спроба веде до суперечності","Посилка виду «усі P є Q» на кролика, який не є P, взагалі не поширюється — вона про нього мовчить","Саме через це мовчання зазвичай і проходить контрприклад"],"pics":["MODEL"],"ex":[["Задача B1 (а). Жоден старий кролик не ненажерливий. Усі чорні кролики ненажерливі. Отже, не існує чорного кролика, який є старим",""],["Припускаємо протилежне","нехай такий кролик є: він і чорний, і старий"],["Він чорний","за другою посилкою він ненажерливий"],["Він старий","за першою посилкою він НЕ ненажерливий"],["Отримали [[c:math115:tautology|суперечність]]","один кролик не може бути й ненажерливим, і ні"],["Отже, такого кролика не буває","висновок логічний"]],"exFin":"Так, висновок логічний","ex2":[["Задача B1 (б). Усі ненажерливі кролики чорні. Жоден старий кролик не є ненажерою. Отже, усі старі кролики не чорні",""],["Шукаємо контрприклад","треба старий і водночас чорний кролик, який не ламає посилок"],["Пробуємо: старий, чорний, НЕ ненажерливий",""],["Перша посилка","«усі ненажерливі чорні» — наш кролик не ненажерливий, посилка про нього мовчить. Не порушена"],["Друга посилка","«жоден старий не ненажера» — наш кролик старий і не ненажера. Не порушена"],["Висновок","«усі старі не чорні» — а наш старий і чорний. Порушений"]],"ex2Fin":"Ні, висновок не логічний; контрприклад — старий чорний кролик, що не є ненажерою","more":"[[c:math115:difference|Різниця]] між двома пунктами лише в напрямку стрілок. У першому обидві посилки чіпляються за одного кролика й стикаються лобами. У другому одна з посилок при потрібних нам ознаках стає порожньою — і саме в цю дірку пролазить контрприклад. Тому, шукаючи спростування, завжди питай: яка посилка тут нічого не вимагає?","check":[{"q":"Скільки кроликів достатньо, щоб спростувати висновок?","a":["1","один","одного"]},{"q":"Посилка «усі ненажерливі чорні» щось вимагає від кролика, який не є ненажерливим? (так / ні)","a":["ні"]},{"q":"Висновок B1 (а) логічний? (так / ні)","a":["так"]}],"learn":["Спростувати висновок = пред'явити ОДИН об'єкт, на якому посилки істинні, а висновок ні","Посилка «усі P є Q» нічого не вимагає від того, хто не є P"],"ref":["Формулу писати не обов'язково: контрприклад можна описати трьома словами"],"kids":true},{"id":"p2b","w":2,"s":"s2","min":3,"t":"Предикати: висловлювання зі змінною","pr":"основа теми","idea":"Досі кожне [[c:math115:statement|висловлювання]] було або істинним, або хибним. А про «$x>5$» так сказати не можна: усе залежить від $x$. Такі речення називають предикатами, і вони стають нормальними висловлюваннями рівно двома способами — або підставити конкретне значення, або поставити перед ними [[c:math115:quantifier|квантор]].","rules":["[[c:math115:predicate|Предикат]] $P(x)$ — речення зі змінною, яке стає висловлюванням після підстановки значення","Предикатів від кількох змінних теж скільки завгодно: $Z(x,y)$ — «$x$ склав залік $y$»","$\\forall x\\ P(x)$ — «для кожного $x$ виконується $P(x)$». Хибне, щойно знайшовся один контрприклад","$\\exists x\\ P(x)$ — «існує хоча б один $x$, для якого $P(x)$». Істинне, щойно знайшовся один приклад","Область, по якій бігає $x$, треба знати: $\\forall x\\in\\mathbb{R}$ і $\\forall x\\in\\mathbb{N}$ можуть дати різні відповіді","Порядок кванторів міняти НЕ можна: $\\forall x\\exists y$ і $\\exists y\\forall x$ — різні твердження"],"pics":["PREDIC","QORDER"],"ex":[["Розминка. Чи істинне $\\forall x\\in\\mathbb{R}\\ (x^2>0)$?",""],["Квантор загальний","отже вистачить одного контрприкладу"],["Пробуємо $x=0$","$0^2=0$, а $0>0$ хибно"],["Контрприклад знайдено","отже твердження хибне"],["Як його полагодити","правильно буде $\\forall x\\in\\mathbb{R}\\ (x^2\\ge 0)$"]],"exFin":"Хибне; контрприклад $x=0$","ex2":[["Крок далі. Чи істинне $\\exists x\\in\\mathbb{R}\\ (x^2=-1)$?",""],["Квантор існування","достатньо знайти ОДИН приклад"],["Квадрат дійсного числа","ніколи не буває від'ємним"],["Прикладу немає","отже твердження хибне"],["Але увага на область","на комплексних числах це саме твердження було б істинним"]],"ex2Fin":"Хибне на $\\mathbb{R}$","ex3":[["Пастка з порядком. Порівняти $\\forall x\\exists y\\ (y>x)$ і $\\exists y\\forall x\\ (y>x)$ на $\\mathbb{R}$",""],["Перше читаємо зліва направо","для кожного $x$ знайдеться СВІЙ $y$"],["Такий $y$ завжди є","беремо $y=x+1$. Істина"],["Друге","існує ОДНЕ $y$, більше за всі $x$ одразу"],["Такого числа немає","для будь-якого $y$ візьми $x=y$, і $y>y$ хибно"]],"ex3Fin":"Перше істинне, друге хибне","more":"[[c:math115:difference|Різниця]] між двома останніми формулами — у тому, від чого залежить $y$. У $\\forall x\\exists y$ кожен $x$ має право на власний $y$, бо $y$ обирається ПІСЛЯ $x$. У $\\exists y\\forall x$ спочатку фіксують один $y$, і він мусить підійти всім. Читай ланцюжок строго зліва направо — і плутанини не буде.","check":[{"q":"Скільки контрприкладів треба, щоб спростувати $\\forall x\\ P(x)$?","a":["1","один","одного"]},{"q":"Скільки прикладів треба, щоб довести $\\exists x\\ P(x)$?","a":["1","один","одного"]},{"q":"Чи істинне $\\exists x\\in\\mathbb{R}\\ (x^2=-1)$? (так / ні)","a":["ні"]}],"learn":["$\\forall x\\,P(x)$ — «для кожного»; хибне від одного контрприкладу","$\\exists x\\,P(x)$ — «існує хоча б один»; істинне від одного прикладу","Порядок кванторів міняти не можна: $\\forall x\\exists y\\ne\\exists y\\forall x$"],"ref":["Що порядок кванторів важливий — не формула, а розуміння: читай ланцюжок зліва направо","Від чого залежить область ($\\mathbb{R}$, $\\mathbb{N}$) — завжди сказано в умові"],"kids":true},{"id":"p3","w":2,"s":"s2","min":4,"t":"Два шаблони: «усі» і «деякі»","pr":"ПР 3 · A2, A3","idea":"Це найважливіший урок для ПР 3. Майже всі завдання A2 і A3 — це переклад однієї фрази українською в одну з двох конструкцій. Запам'ятай пару: $\\forall$ ходить зі стрілкою, $\\exists$ ходить із кон'юнкцією. Переплутаєш — формула стане беззмістовною.","rules":["«Усі P є Q» $\\Rightarrow$ $\\forall x\\,(P(x)\\to Q(x))$","«Жоден P не є Q» $\\Rightarrow$ $\\forall x\\,(P(x)\\to\\neg Q(x))$","«Деякі P є Q» $\\Rightarrow$ $\\exists x\\,(P(x)\\wedge Q(x))$","«Деякі P не є Q» $\\Rightarrow$ $\\exists x\\,(P(x)\\wedge\\neg Q(x))$","«Не всі P є Q» — це те саме, що «деякі P не є Q»: $\\exists x\\,(P(x)\\wedge\\neg Q(x))$","Слова «молодий», «нероба», «не чорний» — це не нові [[c:math115:predicate|предикати]], а заперечення вже наявних"],"pics":["QPATTERN","QWRONG","RABBIT"],"ex":[["Задача A2. Кролики: $M(x)$ — ненажерливий, $S(x)$ — старий, $B(x)$ — чорний",""],["(а) Жоден старий кролик не ненажерливий","шаблон «жоден»: $\\forall x\\,(S(x)\\to\\neg M(x))$"],["(б) Деякі ненажерливі кролики чорні","шаблон «деякі»: $\\exists x\\,(M(x)\\wedge B(x))$"],["(в) Усім не чорним кроликам не властива ненажерливість","«усім не чорним» — це $\\neg B(x)$ ліворуч: $\\forall x\\,(\\neg B(x)\\to\\neg M(x))$"],["(г) Усі ненажерливі кролики молоді","«молодий» дорівнює $\\neg S(x)$: $\\forall x\\,(M(x)\\to\\neg S(x))$"]],"exFin":"$\\forall x(S\\to\\neg M)$; $\\exists x(M\\wedge B)$; $\\forall x(\\neg B\\to\\neg M)$; $\\forall x(M\\to\\neg S)$","ex2":[["Задача A3 (а). Записати «Не всі двієчники ледачі»",""],["Позначаємо","$D(x)$ — «$x$ двієчник», $L(x)$ — «$x$ ледачий»"],["Спочатку без «не»","«усі двієчники ледачі» — це $\\forall x\\,(D(x)\\to L(x))$"],["Тепер ставимо заперечення","$\\neg\\forall x\\,(D(x)\\to L(x))$"],["І одразу згортаємо його всередину","$\\exists x\\,(D(x)\\wedge\\neg L(x))$"],["Читаємо вголос","«знайдеться двієчник, який не ледачий» — саме те, що сказано в умові"]],"ex2Fin":"$\\exists x\\,(D(x)\\wedge\\neg L(x))$","ex3":[["Задача A3 (в). «Жодному лисому не потрібен гребінець»",""],["Позначаємо","$L(x)$ — «$x$ лисий», $G(x)$ — «$x$ потрібен гребінець»"],["Шаблон «жоден»","$\\forall x\\,(L(x)\\to\\neg G(x))$"],["Перевіряємо себе","чи не хочеться написати $\\forall x\\,(L(x)\\wedge\\neg G(x))$?"],["Ні, не можна","це означало б, що КОЖНА людина у світі лиса. Умова такого не каже"]],"ex3Fin":"$\\forall x\\,(L(x)\\to\\neg G(x))$","more":"Причина, чому шаблони саме такі, проста. Стрілка ОБМЕЖУЄ: «якщо вже P — то Q», а про інших мовчить, і це рівно те, що треба для «усі». Кон'юнкція СТВЕРДЖУЄ: «є хтось, у кого одразу і P, і Q», і це рівно те, що треба для «деякі». Тому $\\forall$ з $\\wedge$ говорить надто багато, а $\\exists$ зі стрілкою — надто мало.","check":[{"q":"Запиши «усі митці талановиті» через $A(x)$ і $T(x)$","a":["∀x(A(x)→T(x))","∀x (A(x) → T(x))","\\forall x(A(x)\\to T(x))","∀x(a(x)->t(x))"]},{"q":"Запиши «деякі митці не є неробами» через $A(x)$ і $N(x)$","a":["∃x(A(x)∧¬N(x))","∃x (A(x) ∧ ¬N(x))","\\exists x(A(x)\\wedge\\neg N(x))","∃x(a(x)&!n(x))"]},{"q":"З якою зв'язкою ходить квантор $\\exists$ у цих шаблонах? Одним символом","a":["∧","\\wedge","&","and","кон'юнкція","конюнкція"]}],"learn":["«Усі P є Q»: $\\forall x\\,(P(x)\\to Q(x))$","«Жоден P не є Q»: $\\forall x\\,(P(x)\\to\\neg Q(x))$","«Деякі P є Q»: $\\exists x\\,(P(x)\\wedge Q(x))$","«Деякі P не є Q»: $\\exists x\\,(P(x)\\wedge\\neg Q(x))$","$\\forall$ — зі стрілкою, $\\exists$ — з кон'юнкцією"],"ref":["Чому саме такі шаблони — видно з сенсу: стрілка обмежує, кон'юнкція стверджує","«Молодий», «нероба», «не чорний» — це заперечення наявних предикатів, а не нові"],"kids":true},{"id":"p4","w":2,"s":"s2","min":3,"t":"Заперечення тверджень із кванторами","pr":"ПР 3 · A3 · ДЗ 1","idea":"Завдання A3 просить не лише записати твердження, а й заперечити його. Робиться це механічно: [[c:math115:quantifier|квантор]] перевертається, стрілка перетворюється на кон'юнкцію (або навпаки), а останній [[c:math115:predicate|предикат]] міняє знак. Чотири пари — і всі випадки ПР 3 закриті.","rules":["$\\neg\\forall x\\,P(x)\\simeq\\exists x\\,\\neg P(x)$ і $\\neg\\exists x\\,P(x)\\simeq\\forall x\\,\\neg P(x)$","$\\neg\\forall x\\,(P\\to Q)\\simeq\\exists x\\,(P\\wedge\\neg Q)$ — бо $\\neg(P\\to Q)\\simeq P\\wedge\\neg Q$","$\\neg\\exists x\\,(P\\wedge Q)\\simeq\\forall x\\,(P\\to\\neg Q)$","Предикат, що обмежує область (той, що стоїть ліворуч від стрілки), заперечення НЕ міняє","Готове заперечення завжди перечитуй українською: якщо звучить як маячня — десь помилка"],"pics":["NEGFORMS","QUANT"],"ex":[["Задача A3 (б). Записати «Деякі митці не є неробами» і заперечити",""],["Позначаємо","$A(x)$ — «$x$ митець», $N(x)$ — «$x$ нероба»"],["Шаблон «деякі»","$\\exists x\\,(A(x)\\wedge\\neg N(x))$"],["Заперечуємо. Квантор перевертається","$\\exists$ стає $\\forall$"],["Кон'юнкція стає стрілкою, останній предикат міняє знак","$\\forall x\\,(A(x)\\to N(x))$"],["Читаємо","«усі митці — нероби». Звучить осмислено, отже все правильно"]],"exFin":"Твердження $\\exists x(A\\wedge\\neg N)$; заперечення $\\forall x(A\\to N)$","ex2":[["Задача A3 (г). «Той, хто вміє приборкувати крокодилів, заслуговує на повагу»",""],["Позначаємо","$K(x)$ — «$x$ вміє приборкувати крокодилів», $R(x)$ — «$x$ заслуговує на повагу»"],["Тут прихований квантор загальності","фраза означає «усі, хто вміє…»: $\\forall x\\,(K(x)\\to R(x))$"],["Заперечуємо","$\\exists x\\,(K(x)\\wedge\\neg R(x))$"],["Читаємо","«знайдеться той, хто вміє приборкувати крокодилів, але поваги не заслуговує»"]],"ex2Fin":"$\\forall x(K\\to R)$; заперечення $\\exists x(K\\wedge\\neg R)$","more":"Найчастіша помилка тут — заперечити ОБИДВА предикати: написати $\\exists x\\,(\\neg K(x)\\wedge\\neg R(x))$. Але лівий предикат лише окреслює, про кого мова, і під заперечення не потрапляє. Ми не стверджуємо, що хтось не вміє приборкувати крокодилів — ми стверджуємо, що серед тих, хто вміє, знайдеться неповажаний.","check":[{"q":"Заперечи $\\forall x\\,(P(x)\\to Q(x))$","a":["∃x(P(x)∧¬Q(x))","∃x (P(x) ∧ ¬Q(x))","\\exists x(P(x)\\wedge\\neg Q(x))","∃x(p(x)&!q(x))"]},{"q":"Заперечи $\\exists x\\,(P(x)\\wedge Q(x))$","a":["∀x(P(x)→¬Q(x))","∀x (P(x) → ¬Q(x))","\\forall x(P(x)\\to\\neg Q(x))","∀x(p(x)->!q(x))"]},{"q":"Чи міняє знак предикат, що стоїть ЛІВОРУЧ від стрілки? (так / ні)","a":["ні"]}],"learn":["$\\neg\\forall x\\,(P\\to Q)\\simeq\\exists x\\,(P\\wedge\\neg Q)$","$\\neg\\exists x\\,(P\\wedge Q)\\simeq\\forall x\\,(P\\to\\neg Q)$","Предикат ліворуч від стрілки знак НЕ міняє"],"ref":["Правильність заперечення завжди перевіряється читанням уголос"],"kids":true},{"id":"p5","w":2,"s":"s2","min":4,"t":"Виразити предикат через задані","pr":"ПР 3 · A4, A5 · ДЗ 2","idea":"Завдання A4 і A5 виглядають різними — геометрія й арифметика — а прийом у них однаковий. Те, чого в наборі бракує, оголошуємо новою змінною під [[c:math115:quantifier|квантором]] існування. «$x$ менше за $y$» перекладається як «існує щось ненульове, що можна додати до $x$ і отримати $y$».","rules":["Даний набір — це весь твій словник. Нічого стороннього писати не можна","Бракує об'єкта — вводь його через $\\exists z$ і накладай на нього умови кон'юнкцією","$S(x,y,z)$ означає $x+y=z$; $P(x,y,z)$ означає $x\\cdot y=z$ — порядок аргументів важливий","«Дорівнює» — це «додати нуль»; «менше» — це «додати щось ненульове»","«Ділиться» — це «існує множник»; «паралельні» — це «НЕ існує спільної точки»"],"pics":["EXPRESS","GEOM"],"ex":[["Задача A5. Виразити через $1(x)$, $0(x)$, $S(x,y,z)$, $P(x,y,z)$",""],["(а) Числа $x$ та $y$ рівні","$x=y$ рівносильно $x+0=y$: $\\exists z\\,(0(z)\\wedge S(x,z,y))$"],["(б) $x<y$","те саме, але додане число має бути ненульовим: $\\exists z\\,(\\neg 0(z)\\wedge S(x,z,y))$"],["(в) $x$ ділиться на $y$","існує множник: $\\exists z\\,P(y,z,x)$, тобто $y\\cdot z=x$"],["(г) $x$ — частка від ділення $y$ на $z$","це просто $x\\cdot z=y$: $P(x,z,y)$"],["Зверни увагу на (г)","тут квантор не потрібен взагалі — усі три числа вже є в умові"]],"exFin":"$\\exists z(0(z)\\wedge S(x,z,y))$; $\\exists z(\\neg 0(z)\\wedge S(x,z,y))$; $\\exists z\\,P(y,z,x)$; $P(x,z,y)$","ex2":[["Задача A4 (в). Прямі $x$ та $y$ паралельні. Дано: $P_1$ — точка, $P_2$ — пряма, $P_3(x,y)$ — «$x$ [[c:math115:membership|належить]] $y$»",""],["Спочатку протилежне","«перетинаються» означає, що є спільна точка"],["Записуємо [[c:math115:union-intersection|перетин]]","$\\exists z\\,(P_1(z)\\wedge P_3(z,x)\\wedge P_3(z,y))$"],["Паралельність — це заперечення перетину","$\\neg\\exists z\\,(P_1(z)\\wedge P_3(z,x)\\wedge P_3(z,y))$"],["Можна й через $\\forall$","$\\forall z\\,(P_1(z)\\to\\neg(P_3(z,x)\\wedge P_3(z,y)))$ — те саме іншими словами"],["Якщо в умові важливо, що це саме прямі","допиши спереду $P_2(x)\\wedge P_2(y)$"]],"ex2Fin":"$P_2(x)\\wedge P_2(y)\\wedge\\neg\\exists z\\,(P_1(z)\\wedge P_3(z,x)\\wedge P_3(z,y))$","more":"Перевіряй себе підстановкою. Для (б) візьми $x=2$, $y=5$: чи існує ненульове $z$ з $2+z=5$? Так, $z=3$ — [[c:math115:predicate|предикат]] істинний, і це правильно. Тепер $x=5$, $y=2$: ненульового $z$ з $5+z=2$ у натуральних числах немає — предикат хибний, і це теж правильно. Дві підстановки ловлять майже будь-яку помилку в порядку аргументів.","check":[{"q":"Через $S(x,y,z)$, тобто $x+y=z$: запиши «$x$ дорівнює $y$», використавши $0(z)$","a":["∃z(0(z)∧S(x,z,y))","∃z (0(z) ∧ S(x,z,y))","\\exists z(0(z)\\wedge S(x,z,y))"]},{"q":"Через $P(x,y,z)$, тобто $x\\cdot y=z$: запиши «$x$ ділиться на $y$»","a":["∃zP(y,z,x)","∃z P(y,z,x)","\\exists z P(y,z,x)","∃z(P(y,z,x))"]},{"q":"Паралельність прямих — це заперечення якого предиката? (одне слово)","a":["перетину","перетин","перетинаються","перетинання"]}],"learn":["$S(x,y,z)$ це $x+y=z$; $P(x,y,z)$ це $x\\cdot y=z$","$x=y$: $\\exists z\\,(0(z)\\wedge S(x,z,y))$","$x<y$: $\\exists z\\,(\\neg 0(z)\\wedge S(x,z,y))$","$x$ ділиться на $y$: $\\exists z\\,P(y,z,x)$"],"ref":["Порядок аргументів перевіряється підстановкою двох чисел, наприклад $x=2$, $y=5$","Паралельність — просто заперечення перетину, окремої ідеї немає"],"kids":true},{"id":"p5b","w":2,"s":"s2","min":3,"t":"Предикати про людей","pr":"ПР 3 · ДЗ 3","idea":"Домашнє до ПР 3 просить виразити «брат», «сестра», «тітка», «дід» через чотири базові [[c:math115:predicate|предикати]]. Прийом той самий, що й з числами: якщо в означенні є слово «спільний» або «чийсь», вводимо цю людину новою змінною під $\\exists$.","rules":["Дано: $B(x,y)$ — «$x$ батько $y$», $M(x,y)$ — «$x$ мати $y$», $S(x,y)$ — «$x$ син $y$», $D(x,y)$ — «$x$ дочка $y$»","Зручне скорочення: «$z$ — батько або мати $y$» це $B(z,y)\\vee M(z,y)$","«Брат» і «сестра» вимагають спільного батька чи матір — отже $\\exists z$","Не забувай умову $x\\ne y$: сам собі братом ніхто не є","Складні родичі будуються з простих: тітка — це сестра одного з батьків"],"pics":["EXPRESS"],"ex":[["ПР 3, ДЗ 3 (а). Виразити «$x$ брат $y$»",""],["Що це означає","$x$ — чийсь син, і той самий хтось є батьком або матір'ю для $y$"],["Вводимо спільного предка","$\\exists z$"],["Перша умова","$S(x,z)$ — тобто $x$ син цього $z$"],["Друга умова","$y$ теж дитина $z$: $S(y,z)\\vee D(y,z)$"],["Складаємо","$\\exists z\\,\\big(S(x,z)\\wedge(S(y,z)\\vee D(y,z))\\big)\\wedge x\\ne y$"]],"exFin":"$\\exists z\\,\\big(S(x,z)\\wedge(S(y,z)\\vee D(y,z))\\big)\\wedge x\\ne y$","ex2":[["(б) і (г) — за тим самим зразком",""],["(б) «$x$ сестра $y$»","те саме, але $x$ — дочка: $\\exists z\\,\\big(D(x,z)\\wedge(S(y,z)\\vee D(y,z))\\big)\\wedge x\\ne y$"],["(г) «$x$ дід $y$ з боку батька»","два кроки по батьківській лінії"],["Вводимо проміжну людину","$\\exists z$ — це батько $y$"],["Записуємо","$\\exists z\\,\\big(B(x,z)\\wedge B(z,y)\\big)$"],["Читаємо вголос","«існує $z$: $x$ батько $z$, а $z$ батько $y$» — саме дід по батькові"]],"ex2Fin":"(б) через $D(x,z)$;  (г) $\\exists z\\,(B(x,z)\\wedge B(z,y))$","ex3":[["(в) «$x$ тітка $y$» — найскладніший пункт",""],["Що таке тітка","сестра батька або сестра матері"],["Уже маємо «сестра»","позначимо його $\\operatorname{sis}(x,z)$ з пункту (б)"],["Потрібен ще один $\\exists$","$z$ — це батько або мати $y$"],["Записуємо","$\\exists z\\,\\big((B(z,y)\\vee M(z,y))\\wedge \\operatorname{sis}(x,z)\\big)$"],["Розгортаємо повністю","$\\exists z\\,\\Big((B(z,y)\\vee M(z,y))\\wedge\\exists w\\,\\big(D(x,w)\\wedge(S(z,w)\\vee D(z,w))\\big)\\Big)$"]],"ex3Fin":"Тітка — це сестра одного з батьків, тобто два вкладені $\\exists$","more":"Помітив, що складні предикати збираються з уже готових? Це нормальна практика: спершу окремо будуєш «сестра», далі користуєшся ним як цеглиною. У роботі так і пиши — введи позначення для проміжного предиката, а наприкінці підстав його розгорнутий вигляд. Це і коротше, і перевіряти легше.","check":[{"q":"Скільки кванторів $\\exists$ потрібно для «$x$ дід $y$ з боку батька»?","a":["1","один","одного"]},{"q":"«$x$ брат $y$»: яким предикатом задають самого $x$ — $S$ чи $D$?","a":["S","s","син","S(x,z)"]},{"q":"Чому до «$x$ брат $y$» треба дописувати $x\\ne y$? Одним словом: щоб не був братом ...","a":["собі","сам собі","самому собі","сам"]}],"learn":["$B(x,y)$ батько, $M(x,y)$ мати, $S(x,y)$ син, $D(x,y)$ дочка","Брат: $\\exists z\\,(S(x,z)\\wedge(S(y,z)\\vee D(y,z)))$, і $x\\ne y$","Дід по батькові: $\\exists z\\,(B(x,z)\\wedge B(z,y))$"],"ref":["Складні родичі збираються з простих — тітка це сестра одного з батьків"],"kids":true},{"id":"p6","w":2,"s":"s2","min":3,"t":"Парність: як доводять «якщо…, то…»","pr":"ПР 3 · B2, C2 · ДЗ 4, ДЗ 5","idea":"Задачі B2 і C2 — про парність, і в них усе тримається на двох записах: парне число це $2k$, непарне це $2k+1$. Побачив слово «парне» — одразу пиши $2k$ і підставляй. Другий прийом: якщо доводити прямо незручно, доводь контрапозицію — це те саме твердження, тільки перевернуте.","rules":["Парне: $x=2k$. Непарне: $x=2k+1$, де $k\\in\\mathbb{Z}$","Сума й добуток: парне + парне = парне; парне $\\cdot$ будь-що = парне; непарне $\\cdot$ непарне = непарне","Важливий факт: $x^2$ парне тоді й лише тоді, коли $x$ парне","Контрапозиція: «якщо $A$, то $B$» рівносильне «якщо не $B$, то не $A$». Доводити можна будь-яке з них","Від супротивного: припускаємо, що потрібне НЕ виконується, і шукаємо [[c:math115:tautology|суперечність]]"],"pics":["PARITY","PROOFWAYS"],"ex":[["Задача B2. Довести: якщо $x^2-6x+5$ парне, то $x$ непарне",""],["Прямо незручно","з парності виразу важко щось витягти про $x$"],["Беремо контрапозицію","доведемо: якщо $x$ ПАРНЕ, то $x^2-6x+5$ НЕпарне"],["Пишемо $x=2k$","$(2k)^2-6(2k)+5=4k^2-12k+5$"],["Виносимо двійку","$2(2k^2-6k+2)+1$"],["Це число виду $2m+1$","отже непарне — що й треба було"],["Контрапозиція доведена","а разом із нею і початкове твердження"]],"exFin":"Доведено через контрапозицію","ex2":[["Задача C2. $m,n\\in\\mathbb{Z}$, $n$ непарне. Довести, що $x^2+2mx+2n=0$ не має цілих коренів",""],["«Не має» — беремо від супротивного","припустимо, що ціле $x$ таки є коренем"],["Переносимо","$x^2=-2mx-2n=-2(mx+n)$"],["Праворуч стоїть парне число","отже $x^2$ парне, а значить і $x$ парне"],["Пишемо $x=2k$ і підставляємо","$4k^2+4mk+2n=0$"],["Ділимо все на $2$","$2k^2+2mk+n=0$, звідки $n=-2(k^2+mk)$"],["Але це означає, що $n$ парне","а за умовою воно непарне. Суперечність"]],"ex2Fin":"Цілих коренів немає","more":"Як обрати спосіб. Якщо в умові є слова «не існує», «не має коренів», «неможливо» — бери від супротивного. Якщо це «якщо A, то B» і заперечити $B$ простіше, ніж працювати з $A$ — бери контрапозицію. У решті випадків підставляй означення прямо. Один із трьох способів спрацює завжди.","check":[{"q":"Як записують парне число однією формулою з $k$?","a":["2k"]},{"q":"Як записують непарне число?","a":["2k+1","2k-1"]},{"q":"Контрапозиція до «якщо $A$, то $B$» — це «якщо ..., то ...». Запиши через $\\neg A$ і $\\neg B$","a":["¬B→¬A","¬b→¬a","\\neg B\\to\\neg A","!b->!a","не b то не a"]}],"learn":["Парне $=2k$, непарне $=2k+1$","$x^2$ парне $\\Leftrightarrow$ $x$ парне","Контрапозиція: «якщо $A$, то $B$» $\\simeq$ «якщо $\\neg B$, то $\\neg A$»"],"ref":["Який зі способів брати — підказує формулювання задачі","Правила «парне + парне = парне» відновлюються підстановкою $2k$"],"kids":true},{"id":"p7","w":2,"s":"s2","min":3,"t":"«Довести чи спростувати»","pr":"ПР 3 · B3, C1 · ДЗ 6","idea":"Це формулювання майже завжди означає «спростуйте». Перше, що треба зробити, — витратити хвилину на пошук контрприкладу: підставити $1$, $2$, $3$, потім щось від'ємне, потім парне й непарне. Знайшов одне число, яке ламає твердження — усе, задача закрита.","rules":["Один контрприклад спростовує повністю. Доводити при цьому нічого не треба","Якщо контрприклад не знаходиться за хвилину — швидше за все, твердження істинне, і його треба доводити в загальному вигляді","Загальний вигляд: замість чисел пиши $n$, $n+1$, $n+2$ і рахуй з буквами","Корисна пара: $a^2-b^2=(a-b)(a+b)$, причому $a-b$ і $a+b$ завжди однакової парності","Якщо твердження хибне не завжди — умова може просити описати ВСІ випадки, коли воно правильне"],"pics":["PROOFWAYS"],"ex":[["Задача B3. Довести чи спростувати: кожне ціле число можна подати як [[c:math115:difference|різницю]] квадратів двох цілих",""],["Пробуємо кілька чисел","$3=2^2-1^2$, $4=2^2-0^2$, $5=3^2-2^2$, $8=3^2-1^2$ — поки все виходить"],["Пробуємо $2$","треба $a^2-b^2=2$, тобто $(a-b)(a+b)=2$"],["Розкладаємо двійку на множники","$1\\cdot 2$ або $2\\cdot 1$ — в обох випадках множники різної парності"],["А так не буває","$a-b$ і $a+b$ відрізняються на $2b$, тому вони завжди однакової парності"],["Двійку подати неможливо","контрприклад знайдено"]],"exFin":"Спростовано: число $2$ подати неможливо","ex2":[["Задача C1. Довести чи спростувати: (а) сума трьох послідовних цілих ділиться на $3$; (б) сума чотирьох — на $4$",""],["(а) Пишемо в загальному вигляді","$n+(n+1)+(n+2)=3n+3=3(n+1)$"],["Множник $3$ видно явно","отже ділиться. Пункт (а) істинний"],["(б) Так само","$n+(n+1)+(n+2)+(n+3)=4n+6$"],["Дивимось на остачу","$4n$ ділиться на $4$, а $6$ дає остачу $2$"],["Перевіряємо на числах","$1+2+3+4=10$, а $10$ на $4$ не ділиться"]],"ex2Fin":"(а) істинно; (б) хибно — контрприклад $1+2+3+4=10$","ex3":[["Пункт (в). Для яких $n$ сума $n$ послідовних цілих ділиться на $n$?",""],["Записуємо суму","$a+(a+1)+\\dots+(a+n-1)=na+\\frac{n(n-1)}{2}$"],["Перший доданок на $n$ ділиться завжди","питання лише про другий"],["$\\frac{n(n-1)}{2}$ ділиться на $n$ тоді","коли $\\frac{n-1}{2}$ ціле, тобто коли $n-1$ парне"],["А це означає","$n$ непарне"],["Звіряємось із (а) і (б)","$n=3$ непарне — ділиться; $n=4$ парне — не ділиться. Збіглося"]],"ex3Fin":"Тільки для непарних $n$","more":"Пункт (в) показує, як влаштовані такі задачі загалом: (а) і (б) — це два окремі випадки одного правила, і питання «а коли взагалі?» відповідає на обидва одразу. Якщо бачиш у роботі кілька схожих пунктів поспіль — швидше за все, останній просить знайти закономірність, а не порахувати ще один приклад.","check":[{"q":"Скільки контрприкладів потрібно, щоб спростувати твердження?","a":["1","один","одного"]},{"q":"Сума чотирьох послідовних цілих завжди дає при діленні на $4$ остачу ...","a":["2"]},{"q":"Чи ділиться сума п'яти послідовних цілих на $5$? (так / ні)","a":["так"]}],"learn":["Один контрприклад спростовує повністю","$a^2-b^2=(a-b)(a+b)$, і ці множники завжди однакової парності"],"ref":["Загальний вигляд суми послідовних чисел виводиться на місці"],"kids":true},{"id":"p8","w":2,"s":"s2","min":2,"t":"Доведення існування","pr":"ПР 3 · B4","idea":"Задача B4 просить довести, що існує просте число, більше за $10^{100}$. Шукати його не треба — і не можна. Замість цього показують, що таке число мусить бути: будують число, у якого будь-який простий дільник свідомо завеликий.","rules":["Щоб довести існування, достатньо або пред'явити приклад, або показати, що об'єкт не може не бути","Стандартна конструкція: береш $N$ і розглядаєш $N!+1$","Ключовий факт: якщо просте $p\\le N$, то $p$ ділить $N!$","Якщо $p$ ділить і $N!$, і $N!+1$, то воно ділить їхню [[c:math115:difference|різницю]], тобто $1$ — а це неможливо","Будь-яке число, більше за $1$, має принаймні один простий дільник"],"pics":["EXIST"],"ex":[["Задача B4. Довести, що існує просте число, більше за $10^{100}$",""],["Позначимо","$N=10^{100}$"],["Розглянемо число","$M=N!+1$. Воно більше за $1$, отже має простий дільник $p$"],["Припустимо, що $p\\le N$","тоді $p$ входить множником у $N!$, тобто ділить $N!$"],["Але $p$ ділить і $M$","а отже ділить і різницю $M-N!=1$"],["Просте число не може ділити одиницю","[[c:math115:tautology|суперечність]]"],["Значить, припущення хибне","тобто $p>N=10^{100}$"]],"exFin":"Такий $p$ існує: будь-який простий дільник числа $10^{100}!+1$","ex2":[["Той самий хід у загальному вигляді: простих чисел нескінченно багато",""],["Припустимо протилежне","їх скінченна кількість: $p_1,\\dots,p_k$"],["Розглянемо","$M=p_1p_2\\cdots p_k+1$"],["$M$ має простий дільник","але жодне $p_i$ ним бути не може — кожне дає остачу $1$"],["Отже, є простий дільник поза списком","суперечність зі скінченністю списку"]],"ex2Fin":"Простих чисел нескінченно багато (доведення Евкліда)","more":"Такі доведення називають неконструктивними: вони гарантують, що об'єкт існує, але не дають способу його знайти. У задачі B4 ми не знаємо жодної цифри того простого числа — і це нормально, бо питали не «яке воно», а «чи існує».","check":[{"q":"Яке число розглядають у доведенні Евкліда для заданого $N$? Запиши формулою","a":["N!+1","n!+1"]},{"q":"Якщо просте $p$ ділить і $N!$, і $N!+1$, то воно ділить ...","a":["1","одиницю","різницю"]},{"q":"Чи потрібно в задачі B4 назвати конкретне просте число? (так / ні)","a":["ні"]}],"learn":["Для заданого $N$ беруть $M=N!+1$","Якщо просте $p\\le N$, то $p$ ділить $N!$","Просте не може ділити $1$"],"ref":["Що конкретне число називати не треба — випливає з формулювання «існує»"],"kids":true},{"id":"p9","w":2,"s":"s2","min":3,"t":"Індукція: скелет доведення","pr":"ПР 4 · A1","idea":"Уся ПР 4 — це одна й та сама схема з чотирьох рядків, у якій змінюється лише алгебра всередині. Вивчи скелет так, щоб писати його не думаючи, і тоді вся увага піде на єдине справді змістовне місце — перехід.","rules":["База: перевіряємо твердження при найменшому $n$ — підставляємо число в обидві частини","Припущення: нехай твердження виконується при $n=k$. Виписуємо його повністю","Перехід: доводимо твердження при $n=k+1$, ОБОВ'ЯЗКОВО скориставшись припущенням","Висновок: за принципом математичної [[c:math115:induction|індукції]] твердження істинне для всіх $n$","База — не формальність: без неї доведення не існує","Якщо в умові написано «для всіх $n\\ge 4$» — база саме при $n=4$, а не при $n=1$"],"pics":["INDSKEL","INDUCT"],"ex":[["Задача A1. Довести, що $\\sum\\limits_{k=0}^{n}2^k=2^{n+1}-1$",""],["База, $n=0$","ліворуч $2^0=1$; праворуч $2^1-1=1$. Збіглося"],["Припущення","нехай $\\sum\\limits_{k=0}^{m}2^k=2^{m+1}-1$"],["Перехід. Додаємо наступний доданок","$\\sum\\limits_{k=0}^{m+1}2^k=\\left(2^{m+1}-1\\right)+2^{m+1}$"],["Зводимо подібні","$2\\cdot 2^{m+1}-1$"],["Це і є потрібний вигляд","$2^{m+2}-1$, тобто формула при $n=m+1$"]],"exFin":"Доведено для всіх натуральних $n$","ex2":[["Перевірка розуміння: чому база обов'язкова",""],["Візьмемо хибне твердження","«$n=n+1$ для всіх натуральних $n$»"],["Спробуємо перехід","з $k=k+1$ додаємо $1$ до обох частин: $k+1=k+2$"],["Перехід «працює»","формально він бездоганний"],["Але бази немає","$1=2$ хибно, і весь ланцюжок ні на що не спирається"],["Мораль","перехід без бази доводить рівно нічого"]],"ex2Fin":"Без бази доведення недійсне","more":"У переході є дуже поширена помилка: почати з того, що треба довести, і зводити його до чогось істинного. Правильний напрямок протилежний — почати з відомого (припущення) і прийти до потрібного. На папері це видно одразу: ліворуч має стояти вираз для $k+1$, а далі йти ланцюжок рівностей, а не «доведемо, що…» з рівнянням.","check":[{"q":"Як називається перший крок доведення за індукцією? (одне слово)","a":["база","базa","базис"]},{"q":"$\\sum\\limits_{k=0}^{n}2^k=2^{n+1}-1$. Чому дорівнює сума при $n=3$?","a":["15"]},{"q":"В умові написано «для всіх $n\\ge 4$». При якому $n$ перевіряємо базу?","a":["4"]}],"learn":["Чотири рядки: база — припущення при $n=k$ — перехід до $k+1$ — висновок","Без бази доведення недійсне","«для всіх $n\\ge 4$» означає базу при $n=4$"],"ref":["Слова висновку («за принципом математичної індукції») — стандартний рядок"],"kids":true},{"id":"p10","w":2,"s":"s2","min":4,"t":"Індукція для сум","pr":"ПР 4 · A2–A4 · B3, B4","idea":"Задачі A1–A4 — це суми, і перехід у них завжди один і той самий рух: до суми з $k$ доданків додаємо наступний доданок, стару суму замінюємо формулою з припущення, а далі — чиста алгебра. Ніякої вигадки, лише охайність із дробами.","rules":["Перехід у сумі: $S(k+1)=S(k)+a_{k+1}$, де $a_{k+1}$ — наступний доданок","Наступний доданок беруть із загального члена: якщо доданок $\\frac{1}{(2k-1)(2k+1)}$, то наступний — $\\frac{1}{(2k+1)(2k+3)}$","Далі: спільний знаменник, зведення чисельника, розкладання на множники, скорочення","Мета переходу — отримати ту саму формулу, у якій $k$ замінено на $k+1$. Випиши цю мету одразу, ще до обчислень","Перед доведенням підстав $n=1,2,3$ — це і база, і перевірка, що ти правильно переписав умову"],"pics":["SUMSTEP","TELESC"],"ex":[["Задача A2. Довести, що $\\sum\\limits_{k=1}^{n}k^2=\\frac{n(n+1)(2n+1)}{6}$",""],["База, $n=1$","ліворуч $1$; праворуч $\\frac{1\\cdot 2\\cdot 3}{6}=1$"],["Мета переходу","отримати $\\frac{(m+1)(m+2)(2m+3)}{6}$"],["Додаємо наступний доданок","$\\frac{m(m+1)(2m+1)}{6}+(m+1)^2$"],["Виносимо $\\frac{m+1}{6}$","$\\frac{m+1}{6}\\left(m(2m+1)+6(m+1)\\right)$"],["Розкриваємо дужку","$m(2m+1)+6(m+1)=2m^2+7m+6$"],["Розкладаємо на множники","$2m^2+7m+6=(m+2)(2m+3)$"],["Підставляємо назад","$\\frac{(m+1)(m+2)(2m+3)}{6}$ — саме те, що потрібно"]],"exFin":"Доведено","ex2":[["Задача A4. Довести, що $\\frac{1}{1\\cdot 3}+\\frac{1}{3\\cdot 5}+\\dots+\\frac{1}{(2n-1)(2n+1)}=\\frac{n}{2n+1}$",""],["База, $n=1$","ліворуч $\\frac{1}{3}$; праворуч $\\frac{1}{3}$"],["Наступний доданок","у ньому $k$ замінюємо на $m+1$: $\\frac{1}{(2m+1)(2m+3)}$"],["Додаємо","$\\frac{m}{2m+1}+\\frac{1}{(2m+1)(2m+3)}$"],["Спільний знаменник $(2m+1)(2m+3)$","$\\frac{m(2m+3)+1}{(2m+1)(2m+3)}$"],["Чисельник","$2m^2+3m+1=(2m+1)(m+1)$"],["Скорочуємо на $(2m+1)$","$\\frac{m+1}{2m+3}$ — це і є $\\frac{n}{2n+1}$ при $n=m+1$"]],"ex2Fin":"Доведено","more":"У задачі A4 чисельник розклався на множники так, що один із них скоротився зі знаменником. Це не випадковість: у всіх задачах на суму перехід зобов'язаний зійтися, тому якщо після зведення нічого не скорочується — шукай арифметичну помилку, а не новий метод.","check":[{"q":"$\\sum\\limits_{k=1}^{n}k^2$ при $n=3$ дорівнює ...","a":["14"]},{"q":"$\\frac{1}{1\\cdot 3}+\\frac{1}{3\\cdot 5}$ дорівнює $\\frac{n}{2n+1}$ при $n=2$. Чому саме?","a":["2/5","0.4","2:5"]},{"q":"Наступний доданок після $\\frac{1}{(2k-1)(2k+1)}$ — це $\\frac{1}{(2k+1)(?)}$. Що замість знака питання?","a":["2k+3","(2k+3)"]}],"learn":["Перехід у сумі: $S(k+1)=S(k)+a_{k+1}$","Мету переходу виписуй ДО обчислень"],"ref":["Наступний доданок береться із загального члена заміною $k$ на $k+1$","Якщо після зведення нічого не скорочується — це арифметична помилка, а не новий метод"],"kids":true},{"id":"p10b","w":2,"s":"s2","min":4,"t":"Індукція для нерівностей","pr":"ПР 4 · A5–A7 · B2","idea":"У нерівностях перехід виглядає інакше, ніж у рівностях: заміс
